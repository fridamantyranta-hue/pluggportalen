<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggledning projektering - frågor till boken</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20352e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(115deg,#183d34,#396e59);color:white;padding:42px 20px}main,.inner{max-width:920px;margin:auto}h1{font-size:clamp(1.9rem,4vw,3rem);margin:7px 0}header p{color:#dcebe2}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #b7c9be;background:white;color:#234b3b;border-radius:12px;padding:11px 17px}button:hover{border-color:#315d4a}button.active,.primary{background:#285b47;color:white;border-color:#285b47}.panel{background:white;border:1px solid #e2e7de;border-radius:20px;padding:clamp(18px,4vw,35px);box-shadow:0 10px 35px #1c3b2910;margin-bottom:20px}.muted{color:#61766c}.progress{height:9px;background:#e8eee9;border-radius:9px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#5e9974;transition:width .2s}.options{display:grid;gap:10px;margin:24px 0}.option{text-align:left;width:100%;padding:15px;border:1px solid #cbd8ce}.option.selected{background:#e4f0e8;border-color:#447d5c}.option.correct{background:#d9f2df;border-color:#32804b}.option.wrong{background:#fce6e4;border-color:#b54b43}.feedback{border-left:4px solid #568d6b;padding:14px;background:#f1f7f2;border-radius:8px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.small{font-size:.9rem}.flash{min-height:240px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#f4f8f3;border:1px dashed #8eac98;border-radius:18px;padding:25px;margin:20px 0}.flash strong{font-size:1.6rem}.hide{display:none}.pill{display:inline-block;background:#e4ede4;color:#335e46;border-radius:99px;padding:5px 11px;font-size:.85rem}footer{text-align:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Byggledning projektering - frågor till boken</h1><p>Fördjupande quiz med resonemang och flervalsfrågor från kurslitteraturen · Kapitel 4 och 13.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 24 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Studiematerial · Bygg- och anläggningsprojektering P0009B</footer><script>const Q=[{"ch":4,"q":"En projektmedarbetare får motstridiga instruktioner från sin linjechef och projektledaren. Vilken organisationsform är särskilt förknippad med denna risk?","opts":["Ren projektorganisation","Matrisorganisation","Funktionsorganisation utan projektansvar","Entreprenadorganisation"],"correct":[1],"why":"Matrisorganisationen innebär delat ansvar mellan projekt och linje, vilket kräver tydliga prioriteringar och mandat."},{"ch":4,"q":"Vilka förhållanden bör klargöras när en projektorganisation etableras? Markera alla rätta.","opts":["Vem som får fatta olika beslut","Hur ansvar och rapportering fördelas","Vilka resurser projektet får disponera","Att varje deltagare själv får välja sina avtalsvillkor"],"correct":[0,1,2],"why":"Beslutsmandat, ansvar och resursfördelning behöver vara tydliga; avtalsvillkor kan inte väljas fritt av varje deltagare."},{"ch":4,"q":"Beställaren vill fatta investeringsbeslut men saknar tekniskt underlag. Vilken insats är mest ändamålsenlig från projektledningen?","opts":["Ta fram beslutsunderlag med alternativ och konsekvenser","Låta entreprenören ensam bestämma projektets mål","Skjuta upp all riskbedömning till produktionen","Ersätta beställarens beslut med ett informellt möte"],"correct":[0],"why":"Projektledningen ska ge beställaren ett tillräckligt underlag; själva investeringsbeslutet ligger hos behörig beslutsfattare."},{"ch":4,"q":"Vilka risker kan uppstå om projektgruppens roller är otydliga? Markera alla rätta.","opts":["Arbetsuppgifter kan falla mellan ansvarsområden","Samma arbete kan utföras parallellt av flera","Beslut kan fördröjas i väntan på ansvarig","Alla gränssnitt försvinner automatiskt"],"correct":[0,1,2],"why":"Oklara roller ger luckor, dubbelarbete och försenade beslut; gränssnitt försvinner inte av sig själva."},{"ch":4,"q":"En specialist behövs endast under projekteringens installationssamordning. Vilket bemanningsval är mest rimligt?","opts":["Koppla in specialistkompetensen under relevant skede","Låta specialisten leda hela projektet oavsett uppdrag","Vänta till slutbesiktning för att undvika samordning","Avstå från specialist eftersom projektledaren finns"],"correct":[0],"why":"Projektorganisationen ska anpassas till uppgifternas art och behovet av kompetens i olika skeden."},{"ch":4,"q":"Vilken skillnad är viktig mellan ansvar och befogenhet?","opts":["Ansvar avser uppgift/resultat medan befogenhet avser rätt att besluta eller agera","Ansvar gäller bara beställaren och befogenhet bara entreprenören","Befogenhet ersätter alltid skyldigheten att rapportera","Begreppen har alltid samma innebörd i en projektorganisation"],"correct":[0],"why":"En person kan ha ansvar utan tillräckligt mandat; därför måste de två begreppen samordnas."},{"ch":4,"q":"Vilka omständigheter talar för att ett projekt behöver särskilda samordningsrutiner? Markera alla rätta.","opts":["Flera teknikdiscipliner är beroende av varandras handlingar","Projektet har många organisatoriska gränssnitt","Beslut i ett delprojekt påverkar andra delprojekt","Samtliga aktörer använder samma möteslokal"],"correct":[0,1,2],"why":"Samordningsbehovet styrs av beroenden och gränssnitt, inte av om deltagarna sitter i samma lokal."},{"ch":4,"q":"En beställare vill kunna följa projektets utveckling utan att detaljstyra varje aktivitet. Vilken ordning fungerar bäst?","opts":["Fastställda rapportvägar och tydliga beslutspunkter","Att varje projektör rapporterar endast när problem uppstår","Att avskaffa projektmöten och enbart använda slutrapport","Att projektledaren undviker att dokumentera avvikelser"],"correct":[0],"why":"Regelbunden uppföljning och tydliga beslutspunkter ger styrning utan onödig detaljstyrning."},{"ch":4,"q":"Vilka delar hör till ett användbart underlag för att bedöma projektets osäkerheter? Markera alla rätta.","opts":["Identifierade riskhändelser","Bedömd sannolikhet och konsekvens","Planerade åtgärder och ansvariga","Enbart det lägsta inkomna anbudspriset"],"correct":[0,1,2],"why":"Riskbedömning behöver både identifiering, värdering och hantering; ett pris räcker inte."},{"ch":4,"q":"Två intressenter har motsatta önskemål om trafiklösningen kring en byggarbetsplats. Vad bör projektledningen göra först?","opts":["Kartlägga deras intressen, påverkan och krav","Utgå från att den som hörs mest alltid har företräde","Ta bort båda ur kommunikationsplanen","Vänta tills byggstart för att se om frågan försvinner"],"correct":[0],"why":"Intressentanalysen ger underlag för hur krav, påverkan och kommunikation ska hanteras."},{"ch":4,"q":"Vilka frågor är relevanta i en intressentanalys? Markera alla rätta.","opts":["Vilka påverkas av projektet?","Vilka kan påverka projektets genomförande?","Vilka förväntningar och krav finns?","Vilken aktör har flest anställda oavsett koppling till projektet?"],"correct":[0,1,2],"why":"Analysen handlar om påverkan och förväntningar i förhållande till projektet."},{"ch":4,"q":"Ett projekt får återkommande sena beslut från flera beställarrepresentanter. Vilken förbättring är mest träffsäker?","opts":["Definiera beslutsordning och mandat","Öka antalet parallella beslutsfattare utan samordning","Ta bort tidplanen tills besluten kommer","Låta alla tekniska frågor avgöras vid slutbesiktning"],"correct":[0],"why":"En fastställd beslutsordning minskar osäkerhet om vem som får fatta vilket beslut."},{"ch":4,"q":"Varför kan en renodlad projektorganisation vara lämplig för ett stort, avgränsat projekt?","opts":["Projektet får en tydlig ledning och resurser som fokuserar på uppdraget","Alla specialistfunktioner blir överflödiga","Den ordinarie organisationen får automatiskt fullt projektansvar","Projektets avtal behöver inte längre följas upp"],"correct":[0],"why":"Ren projektorganisation kan ge fokus och tydliga befogenheter men behöver fortfarande kompetens och avtal."},{"ch":4,"q":"Vilka åtgärder stärker fungerande samverkan mellan beställare och projektörer? Markera alla rätta.","opts":["Gemensam hantering av gränssnitt","Dokumenterade beslut och ändringar","Tydlig kommunikation om krav och tidpunkter","Att undvika informationsutbyte tills alla handlingar är färdiga"],"correct":[0,1,2],"why":"Samverkan bygger på tidig samordning, dokumentation och informationsutbyte."},{"ch":4,"q":"En risk har liten sannolikhet men mycket stor konsekvens. Vilken slutsats är mest rimlig?","opts":["Den behöver bedömas utifrån båda dimensionerna innan åtgärd beslutas","Den kan alltid ignoreras eftersom sannolikheten är liten","Den måste alltid elimineras oavsett kostnad","Den ska automatiskt överföras till den yngsta projektmedarbetaren"],"correct":[0],"why":"Riskprioritering bygger på en samlad bedömning av sannolikhet och konsekvens."},{"ch":4,"q":"Vilka uppgifter kan rapporteringsrutinerna fylla i projektorganisationen? Markera alla rätta.","opts":["Ge beslutsfattare information om projektets läge","Synliggöra avvikelser och behov av åtgärder","Stödja dokumentation av fattade beslut","Ge alla deltagare samma mandat oavsett roll"],"correct":[0,1,2],"why":"Rapportering ska ge underlag för styrning, uppföljning och beslut, inte utjämna beslutsmandat."},{"ch":13,"q":"Beställaren vill att entreprenörer ska kunna prissätta samma arbete på jämförbara grunder. Vad är viktigast?","opts":["Ett tydligt och likvärdigt förfrågningsunderlag","Att lämna olika ritningsversioner till olika anbudsgivare","Att avstå från administrativa föreskrifter","Att låta anbudsgivarna själva definiera omfattningen utan ramar"],"correct":[0],"why":"Jämförbara anbud förutsätter att samma krav och omfattning kommuniceras."},{"ch":13,"q":"Vilka uppgifter kan behöva framgå av ett förfrågningsunderlag? Markera alla rätta.","opts":["Uppdragets omfattning och tekniska krav","Administrativa villkor för anbud och genomförande","Hur anbud ska lämnas och prövas","Beställarens interna personliga löneuppgifter"],"correct":[0,1,2],"why":"Tekniska och administrativa förutsättningar behövs för anbud; personliga löneuppgifter är inte ett normalt anbudsunderlag."},{"ch":13,"q":"Vad är den huvudsakliga funktionen hos administrativa föreskrifter vid entreprenadupphandling?","opts":["Att precisera administrativa och avtalsrelaterade villkor","Att ersätta alla ritningar med muntliga instruktioner","Att beskriva endast materialens kemiska sammansättning","Att utgöra entreprenörens färdiga tidrapport"],"correct":[0],"why":"Administrativa föreskrifter kompletterar tekniska handlingar med regler för anbud och entreprenad."},{"ch":13,"q":"Vilket påstående beskriver AMA AF bäst?","opts":["Ett referensverk för att strukturera administrativa föreskrifter","En obligatorisk ritningsstandard för samtliga konstruktioner","En lag som automatiskt ersätter alla avtal","Ett register över samtliga godkända anbudsgivare"],"correct":[0],"why":"AMA AF ger struktur och formuleringar för administrativa föreskrifter; den ersätter inte avtalet."},{"ch":13,"q":"Vilka kontroller är relevanta innan anbud rangordnas? Markera alla rätta.","opts":["Att anbuden uppfyller ställda krav","Att eventuella reservationer identifieras","Att anbuden jämförs på avsedda grunder","Att den kortaste anbudstexten alltid väljs"],"correct":[0,1,2],"why":"Anbud måste granskas mot krav och villkor innan en rättvis jämförelse görs."},{"ch":13,"q":"Två anbud har olika pris, men det billigare innehåller en reservation mot ett centralt krav. Vad bör beställaren göra?","opts":["Bedöma reservationens betydelse innan anbuden jämförs","Utse det billigare anbudet utan ytterligare kontroll","Bortse från kravet eftersom priset är lägre","Be entreprenören stryka reservationen efter kontrakt utan dokumentation"],"correct":[0],"why":"Reservationer kan påverka både kravuppfyllelse och jämförbarhet."},{"ch":13,"q":"Vad skiljer främst utförandeentreprenad från totalentreprenad?","opts":["Hur ansvaret för projekteringen fördelas","Om entreprenaden över huvud taget får en tidplan","Om beställaren behöver ange sina behov","Om entreprenören får använda underentreprenörer"],"correct":[0],"why":"Vid utförandeentreprenad svarar beställaren typiskt för projektering; vid totalentreprenad har entreprenören normalt större projekteringsansvar."},{"ch":13,"q":"Vilka aspekter behöver beaktas vid val av entreprenadform? Markera alla rätta.","opts":["Önskad fördelning av projekteringsansvar","Beställarens möjlighet att precisera krav","Hur risker och samordning ska hanteras","Att entreprenadformen automatiskt tar bort alla ändringsarbeten"],"correct":[0,1,2],"why":"Entreprenadform påverkar ansvar och styrning men eliminerar inte förändringar."},{"ch":13,"q":"Vad är tilldelningsbeslutets roll i en upphandling?","opts":["Att redovisa vilket anbud som valts enligt upphandlingens ordning","Att ersätta kontraktets tekniska innehåll","Att automatiskt godkänna alla framtida ÄTA-arbeten","Att fastställa entreprenörens slutliga faktura"],"correct":[0],"why":"Tilldelningsbeslutet avser valet av leverantör, inte framtida arbeten eller slutbetalning."},{"ch":13,"q":"Vilka delar bör tydligt regleras när en konsult upphandlas? Markera alla rätta.","opts":["Uppdragets omfattning och leveranser","Ansvar och samordningsgränser","Tid och ersättningsform","Att konsulten själv får ändra projektmålen utan beställarbeslut"],"correct":[0,1,2],"why":"Tydlig uppdragsbeskrivning minskar tvister om vad konsulten ska leverera."},{"ch":13,"q":"Vad används ABK 09 huvudsakligen för?","opts":["Allmänna bestämmelser för konsultuppdrag inom arkitekt- och ingenjörsverksamhet","Standardvillkor för hyresavtal med bostadshyresgäster","Detaljregler för myndigheters bygglovsprövning","Teknisk produktstandard för betongkonstruktioner"],"correct":[0],"why":"ABK 09 är standardvillkor för konsultuppdrag, inte entreprenad- eller myndighetsregler."},{"ch":13,"q":"En konsult får muntligt önskemål om en omfattande extra utredning. Vad är mest lämpligt?","opts":["Klargöra och dokumentera ändrat uppdrag, tid och ersättning","Utföra arbetet och utgå från att allt ingår i ursprungsarvodet","Ändra leveransen utan att underrätta beställaren","Vänta med att diskutera omfattningen tills slutbesiktningen"],"correct":[0],"why":"Ändringar behöver hanteras så att omfattning, ansvar och ekonomiska följder är tydliga."},{"ch":13,"q":"Vilka uppgifter hjälper till att göra konsultanbud jämförbara? Markera alla rätta.","opts":["Samma beskrivning av uppdraget","Gemensamma krav på redovisning av kompetens och pris","Tydliga utvärderingskriterier","Olika omfattning för varje anbudsgivare utan förklaring"],"correct":[0,1,2],"why":"Jämförbarhet kräver likvärdiga förutsättningar och tydliga kriterier."},{"ch":13,"q":"Vad är ett entreprenadkontrakts centrala funktion?","opts":["Att dokumentera parternas överenskomna rättigheter och skyldigheter","Att automatiskt ersätta samtliga myndighetsbeslut","Att garantera att inga fel kan uppstå i produktionen","Att ge varje underentreprenör direkt avtal med beställaren"],"correct":[0],"why":"Kontraktet anger avtalsförhållandet och hänvisar till relevanta kontraktshandlingar."}];const C=[["Projektorganisation","Tillfällig organisation som samlar ansvar och resurser kring projektets mål."],["Linjeorganisation","Verksamhetens ordinarie organisation."],["Matrisorganisation","Organisation där resurser och ansvar kan delas mellan linje och projekt."],["Projektledare","Samordnar projektets styrning, genomförande och uppföljning."],["Befogenhet","Rätt att fatta beslut inom ett definierat område."],["Ansvarsfördelning","Klargör vem som gör vad och vem som fattar beslut."],["Samverkan","Samordnat arbete och informationsutbyte mellan aktörer."],["Offentlig upphandling","Anskaffning hos offentlig beställare som omfattas av upphandlingsregler."],["Riskhantering","Identifiera, bedöma och hantera osäkerheter."],["Intressentanalys","Kartläggning av berörda aktörer, deras intressen och inflytande."],["Uppföljning","Jämförelse mellan planerat och faktiskt utfall."],["Entreprenadupphandling","Process för att välja entreprenör och avtala om utförande."],["Förfrågningsunderlag","Handlingar som beskriver vad anbud ska avse."],["Administrativa föreskrifter","Villkor och anvisningar för uppdragets administration och avtal."],["AMA AF","Referensverk för administrativa föreskrifter."],["Anbudsprövning","Kontroll och utvärdering av inkomna anbud."],["Tilldelningsbeslut","Meddelande om vald leverantör efter anbudsutvärdering."],["Entreprenadkontrakt","Avtal om parternas åtaganden och villkor."],["Utförandeentreprenad","Entreprenadform där beställaren normalt svarar för projekteringen."],["Totalentreprenad","Entreprenadform där entreprenören normalt svarar för projektering och utförande."],["Konsultupphandling","Anskaffning av konsulttjänster för ett definierat uppdrag."],["ABK 09","Allmänna bestämmelser för konsultuppdrag inom arkitekt- och ingenjörsverksamhet."],["Uppdragsbeskrivning","Beskriver konsultens arbetsuppgifter och leveranser."],["Ändringshantering","Dokumentation och hantering av förändringar i ett uppdrag."]];let idx=0,selected=new Set(),answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}
function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><p>Flervalsfrågor ger poäng endast om samtliga rätta alternativ har valts och inga felaktiga.</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Kapitel '+q.ch;$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';let multi=q.correct.length>1;let hint=document.createElement('p');hint.className='muted small';hint.textContent=multi?'Flera alternativ är rätt. Markera alla rätta och klicka sedan på Kontrollera svar.':'Välj det bästa svaret.';$('options').appendChild(hint);q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});let check=document.createElement('button');check.id='checkanswer';check.className='primary';check.textContent='Kontrollera svar';check.style.display=multi?'inline-block':'none';check.disabled=true;check.onclick=checkAnswer;$('options').appendChild(check);$('feedback').classList.add('hide');$('next').disabled=true;selected=new Set();answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}
function choose(i){if(answered)return;let q=Q[order[idx]];let multi=q.correct.length>1;if(!multi){selected=new Set([i]);checkAnswer();return}if(selected.has(i))selected.delete(i);else selected.add(i);[...$('options').querySelectorAll('button.option')].forEach((b,j)=>b.classList.toggle('selected',selected.has(j)));$('checkanswer').disabled=selected.size===0}
function checkAnswer(){if(answered||selected.size===0)return;answered=true;let q=Q[order[idx]];let ok=selected.size===q.correct.length&&q.correct.every(i=>selected.has(i));if(ok)score++;[...$('options').querySelectorAll('button.option')].forEach((b,j)=>{b.disabled=true;if(q.correct.includes(j))b.classList.add('correct');else if(selected.has(j))b.classList.add('wrong')});$('checkanswer').style.display='none';$('feedback').textContent='';let strong=document.createElement('b');strong.textContent=ok?'Rätt svar!':'Inte riktigt.';let p=document.createElement('p');p.textContent=q.why;let p2=document.createElement('p');p2.textContent='Rätt alternativ: '+q.correct.map(i=>String.fromCharCode(65+i)).join(', ')+'.';$('feedback').append(strong,p,p2);$('feedback').classList.remove('hide');$('next').disabled=false}
function next(){idx++;render()}function restart(){location.reload()}
function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
