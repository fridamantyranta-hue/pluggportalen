<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggledning projektering - frågor till boken</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20352e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(115deg,#183d34,#396e59);color:white;padding:42px 20px}main,.inner{max-width:920px;margin:auto}h1{font-size:clamp(1.9rem,4vw,3rem);margin:7px 0}header p{color:#dcebe2}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #b7c9be;background:white;color:#234b3b;border-radius:12px;padding:11px 17px}button:hover{border-color:#315d4a}button.active,.primary{background:#285b47;color:white;border-color:#285b47}.panel{background:white;border:1px solid #e2e7de;border-radius:20px;padding:clamp(18px,4vw,35px);box-shadow:0 10px 35px #1c3b2910;margin-bottom:20px}.muted{color:#61766c}.progress{height:9px;background:#e8eee9;border-radius:9px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#5e9974;transition:width .2s}.options{display:grid;gap:10px;margin:24px 0}.option{text-align:left;width:100%;padding:15px;border:1px solid #cbd8ce}.option.selected{background:#e4f0e8;border-color:#447d5c}.option.correct{background:#d9f2df;border-color:#32804b}.option.wrong{background:#fce6e4;border-color:#b54b43}.feedback{border-left:4px solid #568d6b;padding:14px;background:#f1f7f2;border-radius:8px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.small{font-size:.9rem}.flash{min-height:240px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#f4f8f3;border:1px dashed #8eac98;border-radius:18px;padding:25px;margin:20px 0}.flash strong{font-size:1.6rem}.hide{display:none}.pill{display:inline-block;background:#e4ede4;color:#335e46;border-radius:99px;padding:5px 11px;font-size:.85rem}footer{text-align:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Byggledning projektering - frågor till boken</h1><p>Utmanande quiz med varierande antal rätta svar och närliggande alternativ från kurslitteraturen · Kapitel 4 och 13.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 24 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Studiematerial · Bygg- och anläggningsprojektering P0009B</footer><script>const Q=[{"ch":4,"q":"En projektmedarbetare får motstridiga instruktioner från sin linjechef och projektledaren. Vilken organisationsform är särskilt förknippad med denna risk?","opts":["Nätverksorganisation med samordnade uppdrag","Projektorganisation med särskilt delegerade befogenheter","Funktionsorganisation med tillfällig samordnare","Matrisorganisation"],"correct":[3],"why":"Matrisorganisationen innebär delat ansvar mellan projekt och linje, vilket kräver tydliga prioriteringar och mandat.","multi":false},{"ch":4,"q":"Vilka förhållanden bör klargöras när en projektorganisation etableras?","opts":["Vem som får fatta olika beslut","Hur ansvar och rapportering fördelas","Hur konflikter mellan projektets och linjens prioriteringar ska avgöras","Vilka resurser projektet får disponera"],"correct":[0,1,2,3],"why":"Beslutsmandat, ansvar och resursfördelning behöver vara tydliga; avtalsvillkor kan inte väljas fritt av varje deltagare. Även det fjärde alternativet är relevant i den aktuella avgränsningen.","multi":true},{"ch":4,"q":"Beställaren vill fatta investeringsbeslut men saknar tekniskt underlag. Vilken insats är mest ändamålsenlig från projektledningen?","opts":["Invänta fullständiga bygghandlingar innan alternativen jämförs","Ta fram beslutsunderlag med alternativ och konsekvenser","Ta fram en preliminär kalkyl utan att pröva teknisk genomförbarhet","Överlåta alternativvärderingen till tekniska konsulter utan beställarens prioriteringar"],"correct":[1],"why":"Projektledningen ska ge beställaren ett tillräckligt underlag; själva investeringsbeslutet ligger hos behörig beslutsfattare.","multi":false},{"ch":4,"q":"Vilka risker kan uppstå om projektgruppens roller är otydliga?","opts":["Arbetsuppgifter kan falla mellan ansvarsområden","Arbetsuppgifter kan bli svårare att följa upp även när de är korrekt utförda","Gränssnitt kan behöva beskrivas i flera dokument trots tydlig ansvarsfördelning","Beslut kan fördröjas i väntan på ansvarig"],"correct":[0,3],"why":"Oklara roller ger luckor, dubbelarbete och försenade beslut; gränssnitt försvinner inte av sig själva. Det bortvalda alternativet är för kategoriskt eller hör till ett annat moment.","multi":true},{"ch":4,"q":"En specialist behövs endast under projekteringens installationssamordning. Vilket bemanningsval är mest rimligt?","opts":["Koppla in specialistkompetensen under relevant skede","Låta projekteringsledaren ensam verifiera samtliga installationstekniska lösningar","Tilldela en fast specialistroll utan att först analysera resursbehovet","Knyta specialistens uppdrag till hela projekteringstiden trots avgränsad insats"],"correct":[0],"why":"Projektorganisationen ska anpassas till uppgifternas art och behovet av kompetens i olika skeden.","multi":false},{"ch":4,"q":"Vilken skillnad är viktig mellan ansvar och befogenhet?","opts":["Ansvar och befogenhet kan alltid fastställas oberoende av varandra","Befogenhet följer automatiskt av att en person har sakkunskap","Ansvar avser uppgift/resultat medan befogenhet avser rätt att besluta eller agera","Ansvar avser rätten att besluta medan befogenhet avser skyldigheten att leverera"],"correct":[2],"why":"En person kan ha ansvar utan tillräckligt mandat; därför måste de två begreppen samordnas.","multi":false},{"ch":4,"q":"Vilka omständigheter talar för att ett projekt behöver särskilda samordningsrutiner?","opts":["Samordningsrutiner är alltid nödvändiga oavsett projektets gränssnitt","När alla projektörer tillhör samma konsultföretag","Flera teknikdiscipliner är beroende av varandras handlingar","Ett gemensamt projekteringsmöte eliminerar behovet av beslut om gränssnitt"],"correct":[2],"why":"Här är bara ett av de fyra påståendena tillräckligt välgrundat för att väljas. Samordningsbehovet styrs av beroenden och gränssnitt, inte av om deltagarna sitter i samma lokal.","multi":true},{"ch":4,"q":"En beställare vill kunna följa projektets utveckling utan att detaljstyra varje aktivitet. Vilken ordning fungerar bäst?","opts":["En gemensam tidplan utan överenskomna rapporteringsvägar","Månadsrapportering utan beslutslogg eller tydliga avvikelsegränser","Informella avstämningar med enbart huvudprojektören","Fastställda rapportvägar och tydliga beslutspunkter"],"correct":[3],"why":"Regelbunden uppföljning och tydliga beslutspunkter ger styrning utan onödig detaljstyrning.","multi":false},{"ch":4,"q":"Vilka delar hör till ett användbart underlag för att bedöma projektets osäkerheter?","opts":["Att riskerna värderas enbart utifrån hur tidigt de upptäcktes","Riskåtgärder behöver vara slutligt beslutade innan sannolikheten får bedömas","Bedömd sannolikhet och konsekvens","Identifierade riskhändelser"],"correct":[2,3],"why":"Riskbedömning behöver både identifiering, värdering och hantering; ett pris räcker inte. Det bortvalda alternativet är för kategoriskt eller hör till ett annat moment.","multi":true},{"ch":4,"q":"Två intressenter har motsatta önskemål om trafiklösningen kring en byggarbetsplats. Vad bör projektledningen göra först?","opts":["Kartlägga deras intressen, påverkan och krav","Avgöra konflikten utifrån vilken part som har flest deltagare på mötet","Välja det billigaste trafikförslaget innan konsekvenserna kartlagts","Be båda parter lämna slutligt godkännande utan gemensam kravanalys"],"correct":[0],"why":"Intressentanalysen ger underlag för hur krav, påverkan och kommunikation ska hanteras.","multi":false},{"ch":4,"q":"Vilka frågor är relevanta i en intressentanalys?","opts":["Vilka kan påverka projektets genomförande?","Vilka påverkas av projektet?","Hur många möten varje intressent redan har deltagit i","Vilka förväntningar och krav finns?"],"correct":[0,1,3],"why":"Analysen handlar om påverkan och förväntningar i förhållande till projektet.","multi":true},{"ch":4,"q":"Ett projekt får återkommande sena beslut från flera beställarrepresentanter. Vilken förbättring är mest träffsäker?","opts":["Låta projektledaren fatta samtliga beställarbeslut utan delegering","Införa tätare möten utan att förändra vem som får fatta beslut","Flytta beslutspunkter till senare skeden för att minska administrationen","Definiera beslutsordning och mandat"],"correct":[3],"why":"En fastställd beslutsordning minskar osäkerhet om vem som får fatta vilket beslut.","multi":false},{"ch":4,"q":"Varför kan en renodlad projektorganisation vara lämplig för ett stort, avgränsat projekt?","opts":["Det blir enklare att använda samma resurser i flera projekt samtidigt","Projektet får en tydlig ledning och resurser som fokuserar på uppdraget","Projektet får automatiskt större tillgång till alla linjeorganisationens specialister","Behovet av gränssnitt och intern kommunikation försvinner"],"correct":[1],"why":"Ren projektorganisation kan ge fokus och tydliga befogenheter men behöver fortfarande kompetens och avtal.","multi":false},{"ch":4,"q":"Vilka åtgärder stärker fungerande samverkan mellan beställare och projektörer?","opts":["Beslut kan ersättas med muntliga överenskommelser när deltagarna är erfarna","Tydlig kommunikation om krav och tidpunkter","Att varje disciplin dokumenterar ändringar enbart i sina interna filer","Gemensam hantering av gränssnitt"],"correct":[1,3],"why":"Samverkan bygger på tidig samordning, dokumentation och informationsutbyte. Det bortvalda alternativet är för kategoriskt eller hör till ett annat moment.","multi":true},{"ch":4,"q":"En risk har liten sannolikhet men mycket stor konsekvens. Vilken slutsats är mest rimlig?","opts":["En hög konsekvens innebär att alla andra risker måste prioriteras bort","Riskens konsekvens kan bedömas först efter att händelsen inträffat","Låg sannolikhet innebär att risken alltid bör accepteras","Den behöver bedömas utifrån båda dimensionerna innan åtgärd beslutas"],"correct":[3],"why":"Riskprioritering bygger på en samlad bedömning av sannolikhet och konsekvens.","multi":false},{"ch":4,"q":"Vilka uppgifter kan rapporteringsrutinerna fylla i projektorganisationen?","opts":["Synliggöra avvikelser och behov av åtgärder","Att rapportering ersätter projektets beslutade ändringsprocess","Ge beslutsfattare information om projektets läge","Stödja dokumentation av fattade beslut"],"correct":[0,2,3],"why":"Rapportering ska ge underlag för styrning, uppföljning och beslut, inte utjämna beslutsmandat.","multi":true},{"ch":13,"q":"Beställaren vill att entreprenörer ska kunna prissätta samma arbete på jämförbara grunder. Vad är viktigast?","opts":["Ett underlag med fullständig mängdförteckning men oklara tekniska krav","Ett tydligt och likvärdigt förfrågningsunderlag","Ett underlag som endast anger budgettak och sluttid","Ett underlag som ger stort utrymme för varje anbudsgivare att välja olika omfattning"],"correct":[1],"why":"Jämförbara anbud förutsätter att samma krav och omfattning kommuniceras.","multi":false},{"ch":13,"q":"Vilka uppgifter kan behöva framgå av ett förfrågningsunderlag?","opts":["Vilka förutsättningar som gäller för entreprenörens prissättning","Uppdragets omfattning och tekniska krav","Hur anbud ska lämnas och prövas","Administrativa villkor för anbud och genomförande"],"correct":[0,1,2,3],"why":"Tekniska och administrativa förutsättningar behövs för anbud; personliga löneuppgifter är inte ett normalt anbudsunderlag. Även det fjärde alternativet är relevant i den aktuella avgränsningen.","multi":true},{"ch":13,"q":"Vad är den huvudsakliga funktionen hos administrativa föreskrifter vid entreprenadupphandling?","opts":["Att fastställa projekteringens tekniska lösningar utan stöd av andra handlingar","Att precisera administrativa och avtalsrelaterade villkor","Att redovisa anbudsgivarens slutliga produktionskalkyl","Att ersätta kontraktets samtliga standardvillkor"],"correct":[1],"why":"Administrativa föreskrifter kompletterar tekniska handlingar med regler för anbud och entreprenad.","multi":false},{"ch":13,"q":"Vilket påstående beskriver AMA AF bäst?","opts":["Ett referensverk för att strukturera administrativa föreskrifter","Ett tekniskt referensverk som ensamt fastställer byggnadens funktion","En sammanställning av entreprenörens egna arbetsberedningar","Ett alternativ till standardavtal där inga projektspecifika föreskrifter behövs"],"correct":[0],"why":"AMA AF ger struktur och formuleringar för administrativa föreskrifter; den ersätter inte avtalet.","multi":false},{"ch":13,"q":"Vilka kontroller är relevanta innan anbud rangordnas?","opts":["Att anbuden uppfyller ställda krav","Att prioritera anbuden utifrån hur tidigt de lämnades","Att reservationer alltid godtas om de har prissatts separat","Att anbuden jämförs på avsedda grunder"],"correct":[0,3],"why":"Anbud måste granskas mot krav och villkor innan en rättvis jämförelse görs. Det bortvalda alternativet är för kategoriskt eller hör till ett annat moment.","multi":true},{"ch":13,"q":"Två anbud har olika pris, men det billigare innehåller en reservation mot ett centralt krav. Vad bör beställaren göra?","opts":["Behandla reservationen som ett rent prisavdrag utan kravprövning","Bortse från reservationen om anbudet ligger under budget","Bedöma reservationens betydelse innan anbuden jämförs","Värdera reservationen enbart som ett möjligt tillägg i efterhand"],"correct":[2],"why":"Reservationer kan påverka både kravuppfyllelse och jämförbarhet.","multi":false},{"ch":13,"q":"Vad skiljer främst utförandeentreprenad från totalentreprenad?","opts":["Hur slutbesiktningens protokoll ska numreras","Vilken part som alltid ansvarar för materialleveranser","Hur ansvaret för projekteringen fördelas","Vem som normalt ansvarar för bygglovsbeslutet"],"correct":[2],"why":"Vid utförandeentreprenad svarar beställaren typiskt för projektering; vid totalentreprenad har entreprenören normalt större projekteringsansvar.","multi":false},{"ch":13,"q":"Vilka aspekter behöver beaktas vid val av entreprenadform?","opts":["Hur risker och samordning ska hanteras","Att alla projekteringsrisker försvinner när entreprenören får projekteringsansvar","Beställarens möjlighet att precisera krav","Önskad fördelning av projekteringsansvar"],"correct":[0,2,3],"why":"Entreprenadform påverkar ansvar och styrning men eliminerar inte förändringar.","multi":true},{"ch":13,"q":"Vad är tilldelningsbeslutets roll i en upphandling?","opts":["Att slutligt reglera varje ersättningspost i entreprenaden","Att dokumentera att en viss anbudsgivare lämnat lägsta pris oavsett kriterier","Att ersätta kontrollen av att anbuden uppfyller krav","Att redovisa vilket anbud som valts enligt upphandlingens ordning"],"correct":[3],"why":"Tilldelningsbeslutet avser valet av leverantör, inte framtida arbeten eller slutbetalning.","multi":false},{"ch":13,"q":"Vilka delar bör tydligt regleras när en konsult upphandlas?","opts":["Tid och ersättningsform","Ansvar och samordningsgränser","Uppdragets omfattning och leveranser","Hur ändringar av konsultuppdraget ska beställas och hanteras"],"correct":[0,1,2,3],"why":"Tydlig uppdragsbeskrivning minskar tvister om vad konsulten ska leverera. Även det fjärde alternativet är relevant i den aktuella avgränsningen.","multi":true},{"ch":13,"q":"Vad används ABK 09 huvudsakligen för?","opts":["Administrativa föreskrifter som ersätter konsultavtalets uppdragsbeskrivning","Allmänna bestämmelser för totalentreprenader med projekteringsansvar","Allmänna bestämmelser för konsultuppdrag inom arkitekt- och ingenjörsverksamhet","Allmänna bestämmelser för utförandeentreprenader"],"correct":[2],"why":"ABK 09 är standardvillkor för konsultuppdrag, inte entreprenad- eller myndighetsregler.","multi":false},{"ch":13,"q":"En konsult får muntligt önskemål om en omfattande extra utredning. Vad är mest lämpligt?","opts":["Börja arbetet och fastställa omfattningen vid nästa ordinarie ekonomimöte","Klargöra och dokumentera ändrat uppdrag, tid och ersättning","Bedöma ändringen som en del av grunduppdraget tills konsultens faktura kommer","Föra in tillägget i projektets risklista utan att ändra uppdraget"],"correct":[1],"why":"Ändringar behöver hanteras så att omfattning, ansvar och ekonomiska följder är tydliga.","multi":false},{"ch":13,"q":"Vilka uppgifter hjälper till att göra konsultanbud jämförbara?","opts":["Tydliga utvärderingskriterier","Gemensamma krav på redovisning av kompetens och pris","Samma beskrivning av uppdraget","Att varje konsult fritt får avgränsa bort delar av uppdraget utan att ange det"],"correct":[0,1,2],"why":"Jämförbarhet kräver likvärdiga förutsättningar och tydliga kriterier.","multi":true},{"ch":13,"q":"Vad är ett entreprenadkontrakts centrala funktion?","opts":["Att ersätta alla tekniska beskrivningar med en övergripande tidplan","Att dokumentera parternas överenskomna rättigheter och skyldigheter","Att samtliga underentreprenörer automatiskt blir avtalsparter med beställaren","Att ensam avgöra hur myndighetskrav ska tolkas i projektet"],"correct":[1],"why":"Kontraktet anger avtalsförhållandet och hänvisar till relevanta kontraktshandlingar.","multi":false}];const C=[["Projektorganisation","Tillfällig organisation som samlar ansvar och resurser kring projektets mål."],["Linjeorganisation","Verksamhetens ordinarie organisation."],["Matrisorganisation","Organisation där resurser och ansvar kan delas mellan linje och projekt."],["Projektledare","Samordnar projektets styrning, genomförande och uppföljning."],["Befogenhet","Rätt att fatta beslut inom ett definierat område."],["Ansvarsfördelning","Klargör vem som gör vad och vem som fattar beslut."],["Samverkan","Samordnat arbete och informationsutbyte mellan aktörer."],["Offentlig upphandling","Anskaffning hos offentlig beställare som omfattas av upphandlingsregler."],["Riskhantering","Identifiera, bedöma och hantera osäkerheter."],["Intressentanalys","Kartläggning av berörda aktörer, deras intressen och inflytande."],["Uppföljning","Jämförelse mellan planerat och faktiskt utfall."],["Entreprenadupphandling","Process för att välja entreprenör och avtala om utförande."],["Förfrågningsunderlag","Handlingar som beskriver vad anbud ska avse."],["Administrativa föreskrifter","Villkor och anvisningar för uppdragets administration och avtal."],["AMA AF","Referensverk för administrativa föreskrifter."],["Anbudsprövning","Kontroll och utvärdering av inkomna anbud."],["Tilldelningsbeslut","Meddelande om vald leverantör efter anbudsutvärdering."],["Entreprenadkontrakt","Avtal om parternas åtaganden och villkor."],["Utförandeentreprenad","Entreprenadform där beställaren normalt svarar för projekteringen."],["Totalentreprenad","Entreprenadform där entreprenören normalt svarar för projektering och utförande."],["Konsultupphandling","Anskaffning av konsulttjänster för ett definierat uppdrag."],["ABK 09","Allmänna bestämmelser för konsultuppdrag inom arkitekt- och ingenjörsverksamhet."],["Uppdragsbeskrivning","Beskriver konsultens arbetsuppgifter och leveranser."],["Ändringshantering","Dokumentation och hantering av förändringar i ett uppdrag."]];let idx=0,selected=new Set(),answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}
function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><p>Frågor med kryssrutor ger poäng endast om exakt alla rätta alternativ har markerats – oavsett hur många det är.</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Kapitel '+q.ch;$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';let multi=q.multi===true;let hint=document.createElement('p');hint.className='muted small';hint.textContent=multi?'Flera svar kan vara rätt. Markera alla alternativ du bedömer som korrekta och klicka på Kontrollera svar.':'Välj det bästa svaret.';$('options').appendChild(hint);q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});let check=document.createElement('button');check.id='checkanswer';check.className='primary';check.textContent='Kontrollera svar';check.style.display=multi?'inline-block':'none';check.disabled=true;check.onclick=checkAnswer;$('options').appendChild(check);$('feedback').classList.add('hide');$('next').disabled=true;selected=new Set();answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}
function choose(i){if(answered)return;let q=Q[order[idx]];let multi=q.multi===true;if(!multi){selected=new Set([i]);checkAnswer();return}if(selected.has(i))selected.delete(i);else selected.add(i);[...$('options').querySelectorAll('button.option')].forEach((b,j)=>b.classList.toggle('selected',selected.has(j)));$('checkanswer').disabled=selected.size===0}
function checkAnswer(){if(answered||selected.size===0)return;answered=true;let q=Q[order[idx]];let ok=selected.size===q.correct.length&&q.correct.every(i=>selected.has(i));if(ok)score++;[...$('options').querySelectorAll('button.option')].forEach((b,j)=>{b.disabled=true;if(q.correct.includes(j))b.classList.add('correct');else if(selected.has(j))b.classList.add('wrong')});$('checkanswer').style.display='none';$('feedback').textContent='';let strong=document.createElement('b');strong.textContent=ok?'Rätt svar!':'Inte riktigt.';let p=document.createElement('p');p.textContent=q.why;let p2=document.createElement('p');p2.textContent='Rätt alternativ: '+q.correct.map(i=>String.fromCharCode(65+i)).join(', ')+'.';$('feedback').append(strong,p,p2);$('feedback').classList.remove('hide');$('next').disabled=false}
function next(){idx++;render()}function restart(){location.reload()}
function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
