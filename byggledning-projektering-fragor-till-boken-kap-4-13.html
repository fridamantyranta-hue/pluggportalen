<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kapitel 4 och 13</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20352e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(115deg,#183d34,#396e59);color:white;padding:42px 20px}main,.inner{max-width:920px;margin:auto}h1{font-size:clamp(1.9rem,4vw,3rem);margin:7px 0}header p{color:#dcebe2}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #b7c9be;background:white;color:#234b3b;border-radius:12px;padding:11px 17px}button:hover{border-color:#315d4a}button.active,.primary{background:#285b47;color:white;border-color:#285b47}.panel{background:white;border:1px solid #e2e7de;border-radius:20px;padding:clamp(18px,4vw,35px);box-shadow:0 10px 35px #1c3b2910;margin-bottom:20px}.muted{color:#61766c}.progress{height:9px;background:#e8eee9;border-radius:9px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#5e9974;transition:width .2s}.options{display:grid;gap:10px;margin:24px 0}.option{text-align:left;width:100%;padding:15px;border:1px solid #cbd8ce}.option.selected{background:#e4f0e8;border-color:#447d5c}.option.correct{background:#d9f2df;border-color:#32804b}.option.wrong{background:#fce6e4;border-color:#b54b43}.feedback{border-left:4px solid #568d6b;padding:14px;background:#f1f7f2;border-radius:8px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.small{font-size:.9rem}.flash{min-height:240px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#f4f8f3;border:1px dashed #8eac98;border-radius:18px;padding:25px;margin:20px 0}.flash strong{font-size:1.6rem}.hide{display:none}.pill{display:inline-block;background:#e4ede4;color:#335e46;border-radius:99px;padding:5px 11px;font-size:.85rem}footer{text-align:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Kapitel 4 och 13</h1><p>Interaktivt quiz och flashcards från kurslitteraturen. Kapitel 4 och 13.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 24 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Studiematerial · Bygg- och anläggningsprojektering P0009B</footer><script>const Q=[["Vad är ett viktigt syfte med en projektorganisation?",["Att tydliggöra ansvar, befogenheter och samverkan","Att avskaffa behovet av projektplanering","Att låta alla fatta samtliga beslut","Att ersätta beställarens mål"],0,"Organisationen ska göra roller, ansvar och beslutsvägar tydliga.","4.3"],["Vad skiljer en projektorganisation från den ordinarie linjeorganisationen?",["Den ansvarar alltid för företagets löpande personaladministration","Den saknar behov av ledning","Den får inte innehålla externa deltagare","Den formas för ett avgränsat projekt och dess mål"],3,"Projektorganisationen sätts samman för projektets särskilda uppgifter.","4.3"],["Vad är en central uppgift för beställarens projektledare?",["Att ensam besluta om alla myndighetstillstånd","Att ersätta samtliga projektörer","Att samordna projektet mot beställarens mål","Att personligen utföra allt byggarbete"],2,"Projektledaren håller samman styrning, samordning och uppföljning.","4.3"],["Vad kännetecknar en matrisorganisation i projekt?",["Varje yrkesgrupp arbetar utan samordning","Medarbetare kan vara knutna både till linje och projekt","Alla arbetar enbart i projektet utan linjechef","Projektet saknar ansvarsfördelning"],1,"Matrisen kombinerar projektets och linjens ansvar och resurser.","4.3"],["Vad är en möjlig utmaning i en matrisorganisation?",["Otydlighet om prioriteringar mellan projekt och linje","Att projektet automatiskt saknar tidsplan","Att externa leverantörer förbjuds","Att ingen behöver kommunicera"],0,"Delade rapporteringsvägar kräver tydlig ansvarsfördelning.","4.3"],["Vilket är ett huvudsyfte med en projektgrupp?",["Att ersätta alla avtal med muntliga löften","Att endast granska löner","Att undvika kontakter mellan discipliner","Att samla kompetenser som behövs för projektets genomförande"],3,"Projektgruppen bemannas utifrån uppgifter och kompetensbehov.","4.4"],["Varför behövs tydliga befogenheter i projektorganisationen?",["För att tidsplanen ska kunna utgå","För att varje konsult ska fatta beställarens beslut","För att rätt person ska kunna fatta rätt beslut","För att inga beslut ska behöva dokumenteras"],2,"Befogenheter behöver motsvara ansvar och beslutsnivå.","4.4"],["Vad bör en ansvarsfördelning mellan projektets aktörer klargöra?",["Att alla ansvarar för allt utan avgränsning","Vem som ansvarar för uppgifter, beslut och uppföljning","Enbart vilken färg ritningarna ska ha","Endast kontorets öppettider"],1,"Ansvarsfördelning minskar risken för luckor och dubbelarbete.","4.4"],["Vilken aspekt är viktig vid bemanning av projektorganisationen?",["Kompetens och tillgänglighet i förhållande till projektets behov","Att alla deltagare har samma utbildning","Att roller fördelas helt utan hänsyn till uppgifter","Att ingen ersättare kan utses"],0,"Rätt resurser behöver finnas vid rätt tidpunkt.","4.4"],["Vad är en fördel med fungerande samverkan i ett byggprojekt?",["Att kontrakt och ansvar blir onödiga","Att alla ändringar automatiskt blir kostnadsfria","Att uppföljning kan upphöra","Bättre informationsutbyte och färre gränssnittsproblem"],3,"Samverkan underlättar samordning mellan projektets många parter.","4.6"],["Vad innebär offentlig upphandling i detta sammanhang?",["Att uppdrag alltid tilldelas utan konkurrens","Att bara privata företag får lämna anbud","Att en offentlig beställare anskaffar varor eller tjänster enligt tillämpliga regler","Att varje entreprenör själv väljer beställare"],2,"Offentliga beställare måste beakta upphandlingsregler och principer.","4.6"],["Varför är dokumentation viktig vid upphandling?",["För att hindra kommunikation inom projektet","För att beslut och bedömningar ska kunna följas upp","För att ersätta behovet av kravspecifikation","För att göra alla anbud identiska"],1,"Spårbarhet och tydlighet är centrala i en ordnad upphandlingsprocess.","4.6"],["Vad är ett centralt syfte med risk- och osäkerhetshantering?",["Att identifiera och hantera sådant som kan påverka projektets mål","Att garantera att inga förändringar någonsin sker","Att endast kontrollera slutkostnaden","Att ersätta ekonomisk uppföljning"],0,"Risker behöver identifieras, bedömas och följas upp under projektet.","4.8"],["Varför görs en intressentanalys i ett byggprojekt?",["För att fastställa byggnadens exakta grundläggningsdjup","För att ersätta projektets budget","För att endast lista anställdas namn","För att förstå vilka som påverkar eller påverkas av projektet"],3,"Intressenter har olika krav, inflytande och informationsbehov.","4.9"],["Vad bör man särskilt undersöka i en intressentanalys?",["Bara byggnadens area","Endast entreprenörens maskinpark","Intressenternas intressen, påverkan och behov av dialog","Enbart hur många som arbetar på byggplatsen"],2,"Analysen stödjer prioriterad kommunikation och hantering av förväntningar.","4.9"],["Vad är ett viktigt mål med planering och uppföljning i projektorganisationen?",["Att ersätta all samordning med ekonomiska tabeller","Att kunna jämföra utfall med mål och vidta åtgärder","Att slippa rapportera avvikelser","Att göra tidsplaner omöjliga att ändra"],1,"Uppföljning gör det möjligt att upptäcka avvikelser och styra projektet.","4.8"],["Vad är syftet med entreprenadupphandling?",["Att välja entreprenör och avtala om genomförandet","Att enbart välja färg på byggnaden","Att ersätta projektering med besiktning","Att fastställa hyresgästers framtida avgifter"],0,"Upphandlingen leder fram till val av entreprenör och kontrakt.","13.1"],["Vilket underlag behöver en anbudsgivare för att kunna lämna ett relevant anbud?",["Enbart beställarens organisationsschema","Endast en preliminär faktura","Bara kontaktuppgifter till andra anbudsgivare","Tydliga krav och förfrågningsunderlag"],3,"Förfrågningsunderlaget beskriver uppdragets förutsättningar och krav.","13.2"],["Vad är en viktig funktion hos administrativa föreskrifter?",["Att ersätta alla tekniska ritningar","Att bestämma alla framtida hyresnivåer","Att ange administrativa och avtalsmässiga villkor för uppdraget","Att enbart redovisa markens bärighet"],2,"Administrativa föreskrifter kompletterar tekniska handlingar och kontraktsvillkor.","13.2"],["Vad används AMA AF främst till?",["För att beräkna byggnadens energiförbrukning","Som stöd för att strukturera administrativa föreskrifter","För att mäta geotekniska sonderingsvärden","För att rita 3D-modeller"],1,"AMA AF är ett referensverk för administrativa föreskrifter.","13.2"],["Vad innebär anbudsprövning?",["Att granska inkomna anbud mot upphandlingens krav","Att automatiskt anta det först inkomna anbudet","Att påbörja slutbesiktning","Att överlåta beställarens samtliga beslut till anbudsgivaren"],0,"Anbud granskas och utvärderas enligt upphandlingens förutsättningar.","13.3"],["Vad bör kontrolleras innan anbud jämförs i sak?",["Att anbuden har identisk grafisk form","Att samtliga anbudsgivare använder samma dator","Att alla anbud innehåller samma pris","Att anbuden uppfyller ställda krav och villkor"],3,"Kravuppfyllelse är en viktig del av prövningen före utvärdering.","13.3"],["Vad avses med tilldelningsbeslut vid upphandling?",["Beslut att alla anbud måste ha samma pris","Beslut att projektet inte behöver något kontrakt","Besked om vilken leverantör som valts enligt utvärderingen","Beslut att byggnaden tas i drift"],2,"Tilldelningen meddelar resultatet av anbudsutvärderingen.","13.3"],["Vilken roll har ett entreprenadkontrakt?",["Att vara en ritning över installationerna","Att dokumentera parternas överenskomna åtaganden och villkor","Att ersätta myndigheternas tillstånd","Att endast visa projektets organisationsschema"],1,"Kontraktet tydliggör avtalade prestationer och villkor.","13.3"],["Vad är en viktig skillnad mellan utförandeentreprenad och totalentreprenad?",["Ansvarsfördelningen för projekteringen skiljer sig","En totalentreprenad saknar alltid tidsplan","Utförandeentreprenad får aldrig upphandlas offentligt","Totalentreprenad innebär alltid flera beställare"],0,"Entreprenadformen påverkar bland annat vem som ansvarar för projekteringen.","13.1"],["Vad är en viktig del i upphandling av konsulter?",["Att bara ange konsultens kontorsadress","Att låta uppdraget vara helt odefinierat","Att ersätta uppdragsbeskrivningen med en slutbesiktning","Att beskriva konsultuppdragets omfattning och förväntade leveranser"],3,"Tydliga uppdragsbeskrivningar underlättar anbud och uppföljning.","13.4"],["Vad reglerar ABK 09 i första hand?",["Regler för enbart materialleveranser","Tekniska krav för en specifik betongsort","Allmänna bestämmelser för konsultuppdrag inom arkitekt- och ingenjörsverksamhet","Byggnadsarbetares kollektivavtal"],2,"ABK 09 används som standardvillkor vid tekniska konsultuppdrag.","13.4"],["Varför behöver konsultens uppdrag avgränsas tydligt?",["För att slippa avtala om tid","För att klargöra ansvar, leveranser och ersättning","För att undvika att någon följer upp uppdraget","För att alla ändringar ska bli gratis"],1,"Avgränsningen minskar risken för missförstånd om vad som ingår.","13.4"],["Vad är ett viktigt moment när konsulter upphandlas?",["Att bedöma relevant kompetens och förmåga att utföra uppdraget","Att enbart välja efter företagets logotyp","Att alltid bortse från uppdragets komplexitet","Att kräva att alla konsulter har samma specialitet"],0,"Konsultvalet behöver relateras till uppdragets krav.","13.4"],["Vad är en viktig anledning att dokumentera ändringar i ett konsultuppdrag?",["För att göra ursprungligt avtal ogiltigt automatiskt","För att förhindra all kommunikation med beställaren","För att ersätta projektets slutrapport","För att klargöra konsekvenser för omfattning, tid och ersättning"],3,"Ändringar kan påverka uppdragets omfattning och villkor.","13.4"]],C=[["Projektorganisation","Tillfällig organisation som samlar ansvar och resurser kring projektets mål."],["Linjeorganisation","Verksamhetens ordinarie organisation."],["Matrisorganisation","Organisation där resurser och ansvar kan delas mellan linje och projekt."],["Projektledare","Samordnar projektets styrning, genomförande och uppföljning."],["Befogenhet","Rätt att fatta beslut inom ett definierat område."],["Ansvarsfördelning","Klargör vem som gör vad och vem som fattar beslut."],["Samverkan","Samordnat arbete och informationsutbyte mellan aktörer."],["Offentlig upphandling","Anskaffning hos offentlig beställare som omfattas av upphandlingsregler."],["Riskhantering","Identifiera, bedöma och hantera osäkerheter."],["Intressentanalys","Kartläggning av berörda aktörer, deras intressen och inflytande."],["Uppföljning","Jämförelse mellan planerat och faktiskt utfall."],["Entreprenadupphandling","Process för att välja entreprenör och avtala om utförande."],["Förfrågningsunderlag","Handlingar som beskriver vad anbud ska avse."],["Administrativa föreskrifter","Villkor och anvisningar för uppdragets administration och avtal."],["AMA AF","Referensverk för administrativa föreskrifter."],["Anbudsprövning","Kontroll och utvärdering av inkomna anbud."],["Tilldelningsbeslut","Meddelande om vald leverantör efter anbudsutvärdering."],["Entreprenadkontrakt","Avtal om parternas åtaganden och villkor."],["Utförandeentreprenad","Entreprenadform där beställaren normalt svarar för projekteringen."],["Totalentreprenad","Entreprenadform där entreprenören normalt svarar för projektering och utförande."],["Konsultupphandling","Anskaffning av konsulttjänster för ett definierat uppdrag."],["ABK 09","Allmänna bestämmelser för konsultuppdrag inom arkitekt- och ingenjörsverksamhet."],["Uppdragsbeskrivning","Beskriver konsultens arbetsuppgifter och leveranser."],["Ändringshantering","Dokumentation och hantering av förändringar i ett uppdrag."]];let idx=0,selected=null,answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Avsnitt '+q[4];$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q[0];$('options').innerHTML='';q[1].forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});$('feedback').classList.add('hide');$('next').disabled=true;selected=null;answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}function choose(i){if(answered)return;answered=true;selected=i;let q=Q[order[idx]];if(i===q[2])score++;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').innerHTML='<b>'+(i===q[2]?'Rätt svar!':'Inte riktigt.')+'</b><p>'+q[3]+'</p>';$('feedback').classList.remove('hide');$('next').disabled=false}function next(){idx++;render()}function restart(){location.reload()}function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
