<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggledning projektering - frågor till boken</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20352e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(115deg,#183d34,#396e59);color:white;padding:42px 20px}main,.inner{max-width:920px;margin:auto}h1{font-size:clamp(1.9rem,4vw,3rem);margin:7px 0}header p{color:#dcebe2}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #b7c9be;background:white;color:#234b3b;border-radius:12px;padding:11px 17px}button:hover{border-color:#315d4a}button.active,.primary{background:#285b47;color:white;border-color:#285b47}.panel{background:white;border:1px solid #e2e7de;border-radius:20px;padding:clamp(18px,4vw,35px);box-shadow:0 10px 35px #1c3b2910;margin-bottom:20px}.muted{color:#61766c}.progress{height:9px;background:#e8eee9;border-radius:9px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#5e9974;transition:width .2s}.options{display:grid;gap:10px;margin:24px 0}.option{text-align:left;width:100%;padding:15px;border:1px solid #cbd8ce}.option.selected{background:#e4f0e8;border-color:#447d5c}.option.correct{background:#d9f2df;border-color:#32804b}.option.wrong{background:#fce6e4;border-color:#b54b43}.feedback{border-left:4px solid #568d6b;padding:14px;background:#f1f7f2;border-radius:8px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.small{font-size:.9rem}.flash{min-height:240px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#f4f8f3;border:1px dashed #8eac98;border-radius:18px;padding:25px;margin:20px 0}.flash strong{font-size:1.6rem}.hide{display:none}.pill{display:inline-block;background:#e4ede4;color:#335e46;border-radius:99px;padding:5px 11px;font-size:.85rem}footer{text-align:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Byggledning projektering - frågor till boken</h1><p>Interaktivt quiz och flashcards från kurslitteraturen. Kapitel 1–3, tillgängliga avsnitt.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 24 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Studiematerial · Bygg- och anläggningsprojektering P0009B</footer><script>const Q=[["Vad är huvudsyftet med en övergripande processbeskrivning?",["Att visa hur bygg- och förvaltningsprocessens delar hänger ihop","Att ersätta alla entreprenadavtal","Att ange varje arbetares lön","Att enbart beskriva rivning"],0,"Kapitel 1 beskriver hur olika processer och aktörer hänger samman.","1.1"],["Vad är projektering i byggprocessen?",["Att planera och utforma det som ska byggas","Att enbart sköta fastighetsdriften","Att riva en byggnad","Att endast sälja byggmaterial"],0,"Projekteringsprocessen tar fram utformning och underlag inför byggandet.","1.2"],["Vilken aktivitet hör till produktionsprocessen?",["Att utföra själva byggnadsarbetet","Att enbart sköta fastighetens framtida hyresavisering","Att endast utvärdera gamla projekt","Att bara fastställa verksamhetens vision"],0,"Produktionsprocessen handlar om att genomföra byggandet.","1.3"],["Vad är en viktig uppgift i förvaltningsprocessen?",["Att driva och underhålla den färdiga byggnaden","Att alltid riva byggnaden omedelbart","Att enbart ta fram bygghandlingar","Att avstå från underhåll"],0,"Förvaltning omfattar drift och underhåll under byggnadens användning.","1.4"],["Varför behövs ledningsprocesser i projektering och byggande?",["För att samordna och styra arbetet mellan olika delar","För att göra planering onödig","För att undvika all kommunikation","För att ersätta byggnadsarbetet"],0,"Ledning behövs för samordning och styrning av projektering och produktion.","1.5"],["Vad är syftet med erfarenhetsåterföring?",["Att föra kunskap från genomförda projekt vidare till kommande arbete","Att undvika dokumentation","Att dölja avvikelser","Att avsluta all utveckling"],0,"Erfarenheter och lärdomar används för att förbättra framtida processer.","1.6"],["Vilken del av byggnadens livscykel anges ofta ha störst resursinsats över tid?",["Rivning","Byggnadsidé","Förvaltning och drift","Projektering"],2,"Boken illustrerar hur drift och förvaltning över livscykeln kan överstiga byggkostnaden kraftigt.","1.7"],["Vad menas med att byggandet är en cyklisk process?",["Varje byggnad uppförs två gånger","Byggnader går genom idé, projektering, byggande, förvaltning, ombyggnad och rivning","Alla projekt återgår till budgetering","Projekt saknar slut"],1,"Figur 1.7 visar byggnadens livscykel och återkommande förändringar.","1.7"],["Vad visar exemplet med sen ändring av golvmaterial?",["Att sena ändringar alltid är gratis","Att sena produktval kan skapa omprojektering, nivåskillnader och merkostnader","Att golvmaterial saknar betydelse","Att projektering kan hoppas över"],1,"Ett ändrat golvval efter utfört underarbete gav flera följdkonsekvenser.","1.8"],["Vad illustrerar exemplet med avbeställd entrétrappa?",["Att ändringar i pågående tillverkning kan medföra kostnader","Att leverantörer alltid kan avboka gratis","Att muntliga önskemål är viktigare än avtal","Att produktionen saknar betydelse"],0,"Kostnader hade redan uppstått i processen, trots att leveransen inte var färdig.","1.8"],["Vad kännetecknar ett projekt enligt kursboken?",["En permanent återkommande verksamhet","En tidsavgränsad arbetsuppgift för ett unikt resultat","Enbart uppförandet av en byggnad","Ett arbete utan fastställda mål"],1,"Projekt är tidsmässigt avgränsade och syftar till en unik produkt, tjänst eller ett unikt resultat.","2.1"],["Vilka tre dimensioner ingår i projektmålet?",["Tid, ekonomi och omfattning","Miljö, personal och mark","Tid, kommunikation och avtal","Ekonomi, lagstiftning och kvalitet"],0,"Projekttriangeln består av tid, ekonomi och omfattning, inklusive kvantitet och kvalitet.","2.2"],["Varför bör både investeringskostnad och årskostnad beaktas?",["De är alltid lika stora","Låg investeringskostnad kan ge höga framtida kostnader","Årskostnad är irrelevant efter överlämning","Projektledaren ansvarar bara för hyran"],1,"Ett val som är billigt att bygga kan bli dyrare att driva och underhålla.","2.2.1"],["Vad är ett processmål?",["Mål för hur projektet ska genomföras","Mål för fastighetens marknadsvärde","Ett annat ord för budget","Enbart slutbesiktning"],0,"Processmål kan avse exempelvis säkerhet och hur beställaren ska kunna påverka genomförandet.","2.2.2"],["Vad är skillnaden mellan projektmål och effektmål?",["Det finns ingen skillnad","Projektmål avser projektets leverans, effektmål dess långsiktiga nytta","Effektmål avser enbart tid","Projektmål avser endast miljö"],1,"Ett projekt kan missa sina genomförandemål men ändå ge stor långsiktig nytta.","2.3"],["Vem ”äger” projektet och ansvarar övergripande för nyttan?",["Byggledaren","Beställaren","Underentreprenören","Materialleverantören"],1,"Beställaren ska säkra att behovet tillgodoses och att effektmålet följs upp.","2.4"],["Vilken är projektledarens centrala uppgift?",["Att ensam utföra allt arbete","Att styra mot målen och balansera omfattning, tid och kostnad","Att bara välja tapeter","Att alltid undvika förändringar"],1,"Projektledaren leder, samordnar, följer upp och rapporterar.","2.5.1"],["Hur skiljs byggprojektledare och byggledare ofta åt i kursboken?",["Byggledaren ansvarar alltid för projektering","Byggprojektledaren under projektering och byggledaren under produktion","Båda arbetar enbart med drift","Ingen av dem arbetar för beställaren"],1,"Begreppen kan användas olika, men denna uppdelning anges i texten.","2.5.2"],["Vad är en beslutspunkt?",["Ett informellt samtal","En definierad punkt där projektets fortsättning prövas och beslut fattas","Enbart en färdig ritning","En arbetsdag utan möten"],1,"Beslutspunkter används för att styra projektet utifrån underlag och mål.","2.5.5"],["Vilken ordning stämmer med de generella projektprocesserna?",["Planering, avslutning, initiering","Initiering, planering, genomförande, uppföljning, avslutning","Uppföljning, initiering, avslutning","Genomförande, avslutning, planering"],1,"Uppföljning sker även parallellt och ger återkoppling till planering och genomförande.","2.6"],["Vilken grupp är en aktör i byggprocessen enligt kapitel 3?",["Entreprenörer","Enbart studenter","Endast politiska partier","Enbart turister"],0,"Entreprenörer behandlas som en egen aktörsgrupp i kapitel 3.","3.6"],["Vilken roll har beställaren i byggprojektets organisation?",["Initierar och beställer projektet","Utför alltid allt byggarbete själv","Ersätter alla konsulter","Utfärdar alla tillstånd"],0,"Beställaren beskrivs som den som initierar och beställer byggprojektet.","3.4"],["Vilka aktörer behandlas i avsnitt 3.5?",["Konsulter och konsultmarknaden","Enbart materialproducenter","Enbart myndigheter","Enbart banker"],0,"Kapitel 3 har ett eget avsnitt om konsulter och konsultmarknaden.","3.5"],["Vilka aktörer kan stå för finansiering av byggprojekt?",["Finansiärer","Endast besiktningsmän","Enbart materialleverantörer","Endast byggnadsarbetare"],0,"Kapitel 3 behandlar finansiärer och finansiering som ett särskilt område.","3.7"],["Vilken roll har byggmaterialleverantörer?",["Tillhandahålla byggmaterial och produkter","Besluta om alla bygglov","Fastställa kommunens detaljplan","Alltid äga byggnaden"],0,"Byggmaterialleverantörer behandlas som en egen grupp i byggprocessen.","3.8"],["Vilken grupp behandlas i avsnitt 3.9?",["Myndigheter","Finansiärer","Konsulter","Entreprenörer"],0,"Avsnitt 3.9 har rubriken Myndigheter.","3.9"],["Vad innebär begreppet brukare i byggprocessen?",["Den som använder byggnaden eller anläggningen","Alltid byggprojektets långivare","Alltid upphandlande myndighet","Alltid totalentreprenören"],0,"Brukaren är den som nyttjar det färdiga resultatet.","3.4"],["Vilken aktör anlitas normalt för sakkunnig projektering och rådgivning?",["Konsult","Brukare","Turist","Slutkund utan uppdrag"],0,"Konsulter bidrar med specialistkompetens och projekteringsinsatser.","3.5"],["Vad är en central skillnad mellan beställare och entreprenör?",["Beställaren beställer projektet medan entreprenören utför avtalade arbeten","Entreprenören beslutar alltid ensam om projektets behov","Beställaren levererar alltid allt byggmaterial","De har alltid exakt samma uppgift"],0,"Beställare och entreprenör har olika roller i byggprocessen.","3.4–3.6"],["Varför är det viktigt att skilja mellan brukare och beställare?",["Den som använder resultatet behöver inte vara samma som den som beställer","Brukare får aldrig påverkas av byggprojekt","Beställaren använder alltid byggnaden själv","Begreppen betyder alltid samma sak"],0,"Brukarnas behov och beställarens beslut kan företrädas av olika aktörer.","3.4"]],C=[["Projekt","Tidsavgränsad uppgift som ska skapa ett unikt resultat."],["Projekttriangeln","Tid, ekonomi och omfattning."],["Omfattning","Tekniskt resultat och krav på kvantitet och kvalitet."],["Processmål","Mål för hur arbetet ska genomföras, exempelvis säkerhet."],["Effektmål","Den långsiktiga nytta eller verkan som projektet ska åstadkomma."],["Projektmål","Mål för projektets leverans och genomförande."],["Beställare","Projektägare med övergripande ansvar för behov och nytta."],["Projektledare","Leder projektet mot målen och balanserar tid, kostnad och omfattning."],["Byggprojektledare","Företräder ofta beställaren genom projektering och andra skeden."],["Byggledare","Leder ofta arbetet under produktionsskedet."],["Beslutspunkt","Definierat vägval där fortsättning, omarbetning, väntan eller avslut beslutas."],["Milstolpe","Kontrollpunkt för ett viktigt delresultat."],["Planering","Processen där projektplan och aktiviteter tas fram."],["Genomförande","Processen där planerade aktiviteter utförs."],["Uppföljning","Kontroll och återkoppling för styrning av projektet."],["Avslutning","Avsluta projektet och dokumentera resultat och erfarenheter."],["Projektintegration","Samordning och styrning av interna och externa kontaktytor."],["Livscykelkostnad","Kostnader för investering, drift, underhåll och andra skeden över livslängden."],["Byggprojektledarens rådgivning","Byggtekniska och ekonomiska frågor för byggherren."],["Riskhantering","Identifiera och hantera osäkerheter i projektet."],["Projektplan","Beskriver hur projektet ska genomföras, aktiviteter och tider."],["Entreprenör","Aktör som genomför avtalade bygg- eller anläggningsarbeten."],["Konsult","Sakkunnig aktör som anlitas för särskilda uppgifter i projektet."],["Byggmaterialleverantör","Levererar byggmaterial och produkter till byggprojekt."]];let idx=0,selected=null,answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Avsnitt '+q[4];$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q[0];$('options').innerHTML='';q[1].forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});$('feedback').classList.add('hide');$('next').disabled=true;selected=null;answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}function choose(i){if(answered)return;answered=true;selected=i;let q=Q[order[idx]];if(i===q[2])score++;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').innerHTML='<b>'+(i===q[2]?'Rätt svar!':'Inte riktigt.')+'</b><p>'+q[3]+'</p>';$('feedback').classList.remove('hide');$('next').disabled=false}function next(){idx++;render()}function restart(){location.reload()}function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
