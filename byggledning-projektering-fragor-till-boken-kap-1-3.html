<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggledning projektering - frågor till boken</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20352e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(115deg,#183d34,#396e59);color:white;padding:42px 20px}main,.inner{max-width:920px;margin:auto}h1{font-size:clamp(1.9rem,4vw,3rem);margin:7px 0}header p{color:#dcebe2}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #b7c9be;background:white;color:#234b3b;border-radius:12px;padding:11px 17px}button:hover{border-color:#315d4a}button.active,.primary{background:#285b47;color:white;border-color:#285b47}.panel{background:white;border:1px solid #e2e7de;border-radius:20px;padding:clamp(18px,4vw,35px);box-shadow:0 10px 35px #1c3b2910;margin-bottom:20px}.muted{color:#61766c}.progress{height:9px;background:#e8eee9;border-radius:9px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#5e9974;transition:width .2s}.options{display:grid;gap:10px;margin:24px 0}.option{text-align:left;width:100%;padding:15px;border:1px solid #cbd8ce}.option.selected{background:#e4f0e8;border-color:#447d5c}.option.correct{background:#d9f2df;border-color:#32804b}.option.wrong{background:#fce6e4;border-color:#b54b43}.feedback{border-left:4px solid #568d6b;padding:14px;background:#f1f7f2;border-radius:8px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.small{font-size:.9rem}.flash{min-height:240px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#f4f8f3;border:1px dashed #8eac98;border-radius:18px;padding:25px;margin:20px 0}.flash strong{font-size:1.6rem}.hide{display:none}.pill{display:inline-block;background:#e4ede4;color:#335e46;border-radius:99px;padding:5px 11px;font-size:.85rem}footer{text-align:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Byggledning projektering - frågor till boken</h1><p>Fördjupande quiz med resonemang och flervalsfrågor från kurslitteraturen · Kapitel 1–3.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 24 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Studiematerial · Bygg- och anläggningsprojektering P0009B</footer><script>const Q=[{"ch":1,"q":"En byggherre vill bedöma hur ett nytt hus fungerar även efter inflyttning. Vilket synsätt är mest relevant?","opts":["Att endast följa projekteringsprocessen","Att studera bygg- och förvaltningsprocessen som en helhet","Att avgränsa analysen till entreprenadtiden","Att utgå från produktionsprocessens sista aktivitet"],"correct":[1],"why":"Bokens övergripande processbeskrivning visar sambandet mellan byggande och den efterföljande förvaltningen."},{"ch":1,"q":"Vilka av följande är processer som boken skiljer mellan? Markera alla rätta.","opts":["Projektledningsprocessen","Produktionsprocessen","Förvaltningsprocessen","Upphandlingsprocessen som ensam överordnad huvudprocess"],"correct":[0,1,2],"why":"Boken beskriver bland annat projektledning, produktion och förvaltning; upphandling är en aktivitet inom större sammanhang."},{"ch":1,"q":"Ett projekt har gått från utredning till att ta fram lösningar och handlingar inför genomförandet. Vilket skede beskriver det bäst?","opts":["Förstudie","Projektering","Förvaltning","Avveckling"],"correct":[1],"why":"Projekteringen konkretiserar den valda lösningen i underlag för genomförande."},{"ch":1,"q":"Vilka aktiviteter hör i bokens processperspektiv naturligt till ett byggprojekts tidiga skeden? Markera alla rätta.","opts":["Pröva behov och förutsättningar","Analysera genomförbarhet och alternativ","Fastställa detaljerad driftjournal för en färdig byggnad","Utveckla beslutsunderlag för fortsatt projekt"],"correct":[0,1,3],"why":"Tidiga skeden handlar om behov, förutsättningar, alternativ och beslut om fortsatt inriktning."},{"ch":1,"q":"En byggnad är färdigställd och överlämnad. Vilken slutsats följer bäst av bokens processmodeller?","opts":["Projektets resultat börjar då ingå i en förvaltningsprocess","Alla processer upphör samtidigt vid överlämnandet","Projekteringsprocessen återupptas alltid som huvudprocess","Byggprojektets produkt blir först definierad vid rivning"],"correct":[0],"why":"Byggprojektet lämnar efter sig en produkt som används, drivs och underhålls inom förvaltningen."},{"ch":1,"q":"Vilket påstående beskriver bäst relationen mellan projekteringsprocess och produktionsprocess?","opts":["De är identiska men har olika namn","Projektering tar fram underlag som produktionen omsätter i utförande","Produktion är enbart en del av den färdiga byggnadens drift","Projektering börjar först när produktionen avslutats"],"correct":[1],"why":"Projektering och produktion har olika uppgifter men behöver samordnas och kan delvis överlappa."},{"ch":1,"q":"Vilka aspekter behöver beaktas för att förstå ett byggprojekt som process snarare än enbart som en fysisk produkt? Markera alla rätta.","opts":["Aktiviteter och deras inbördes samband","Beslut och övergångar mellan skeden","Aktörer och ansvar i genomförandet","Enbart byggnadens slutliga utseende"],"correct":[0,1,2],"why":"Processperspektivet omfattar aktiviteter, beslut, aktörer och samband över tid."},{"ch":1,"q":"Varför är en övergripande processbeskrivning användbar för projektledning?","opts":["Den ersätter behovet av projektanpassad planering","Den gör det möjligt att förstå beroenden och överlämningar mellan processer","Den anger exakt samma tidsplan för varje byggprojekt","Den gör samordning mellan aktörer överflödig"],"correct":[1],"why":"Översikten hjälper projektledaren att se hur olika processer hänger ihop utan att ersätta den konkreta projektplaneringen."},{"ch":2,"q":"En beställare vill korta projekttiden men har oförändrad budget och kvalitetsnivå. Vad visar bokens måltriangel?","opts":["Tidsmålet kan alltid ändras oberoende av övriga mål","En förändring av tiden kan påverka kostnad och kvalitet","Kvaliteten påverkar enbart förvaltningskostnader","Måltriangeln gäller bara entreprenadskedet"],"correct":[1],"why":"Tid, ekonomi och kvalitet behöver vägas mot varandra; ett ändrat mål kan påverka de andra."},{"ch":2,"q":"Vilka av följande hör till projektets mål- och styrfrågor enligt kapitlet? Markera alla rätta.","opts":["Ekonomiska ramar","Tidsramar","Kvalitetskrav","Att helt undvika prioriteringar mellan mål"],"correct":[0,1,2],"why":"Projektmål omfattar bland annat tid, kostnad och kvalitet, som ofta kräver prioriteringar."},{"ch":2,"q":"Vad är den viktigaste funktionen hos en projektbeställning i inledningen av ett projekt?","opts":["Att ersätta alla framtida projekteringshandlingar","Att tydliggöra uppdragets utgångspunkter och ramar","Att fastställa entreprenörens slutliga egenkontroller","Att redovisa den färdiga byggnadens driftkostnader"],"correct":[1],"why":"Projektbeställningen ger en grund för att organisera och genomföra uppdraget."},{"ch":2,"q":"Projektets effektmål och projektmål riskerar att blandas ihop. Vilken formulering är ett effektmål?","opts":["Projekteringshandlingarna ska levereras i oktober","Byggnaden ska bidra till lägre energianvändning i verksamheten","Entreprenaden ska slutbesiktigas ett visst datum","Projektbudgeten får inte överskridas"],"correct":[1],"why":"Effektmål beskriver nyttan eller effekten av projektresultatet; övriga exempel avser genomförandet."},{"ch":2,"q":"Vilka uppgifter kan ingå i en projektledares ansvar enligt kapitlets beskrivning? Markera alla rätta.","opts":["Samordna projektets aktörer","Följa upp tid, ekonomi och kvalitet","Säkerställa informationsflöden och beslutsunderlag","Ensam fatta alla beslut som tillhör beställaren"],"correct":[0,1,2],"why":"Projektledaren leder och samordnar arbetet men övertar inte automatiskt beställarens beslutsmandat."},{"ch":2,"q":"En projektledare tar fram en WBS. Vilket problem försöker man främst lösa?","opts":["Att fördela projektet i hanterbara delar och arbetspaket","Att rangordna samtliga anbud enbart efter pris","Att ersätta projektorganisationens ansvarsfördelning","Att definiera enbart entreprenadens juridiska villkor"],"correct":[0],"why":"WBS är en struktur för att bryta ned projektets arbete i mindre delar som kan planeras och följas upp."},{"ch":2,"q":"Vilka påståenden om WBS stämmer? Markera alla rätta.","opts":["Den kan delas upp hierarkiskt","Den kan stödja planering och uppföljning","Den är samma sak som en kronologisk tidplan","Den kan hjälpa till att tydliggöra arbetets omfattning"],"correct":[0,1,3],"why":"WBS beskriver arbetets struktur; en tidplan beskriver när aktiviteter ska ske."},{"ch":2,"q":"Ett projekt har en tydlig WBS men ingen tidplan. Vilken viktig information saknas då fortfarande?","opts":["Hur arbetspaketen kan ordnas i tid och beroenden","Vilka delar projektets arbete omfattar","Att projektet behöver ha en beställare","Att arbetet kan brytas ned i mindre delar"],"correct":[0],"why":"Nedbrytningen visar vad som ska göras, medan tidsplanering visar ordning, varaktighet och beroenden."},{"ch":2,"q":"Vilka områden kan en projektledare behöva hantera genom planering och uppföljning? Markera alla rätta.","opts":["Resurser och bemanning","Kommunikation och information","Risker och avvikelser","Endast den färdiga byggnadens marknadsvärde"],"correct":[0,1,2],"why":"Kapitlet behandlar projektledning som en kombination av resurs-, kommunikations-, risk- och målstyrning."},{"ch":2,"q":"Projektet får nya krav mitt under genomförandet. Vad är mest förenligt med god projektstyrning?","opts":["Genomföra ändringen utan att pröva följderna","Bedöma konsekvenser för mål, resurser och tid före beslut","Automatiskt avbryta projektet vid varje ändringsförslag","Låta varje projektmedlem själv bestämma vilka krav som gäller"],"correct":[1],"why":"Ändringar bör analyseras och beslutas med hänsyn till projektets samlade förutsättningar."},{"ch":2,"q":"Vilka av följande beskriver riskhantering i ett projekt? Markera alla rätta.","opts":["Identifiera osäkra händelser","Bedöma sannolikhet och konsekvens","Planera åtgärder och uppföljning","Behandla alla risker som redan inträffade avvikelser"],"correct":[0,1,2],"why":"Risker gäller osäkerheter som kan inträffa; de behöver identifieras, värderas och hanteras."},{"ch":2,"q":"Vad skiljer en projektorganisation från en WBS?","opts":["Organisationen visar ansvar och roller; WBS visar arbetets uppdelning","Organisationen visar aktiviteter i tidsordning; WBS visar bara kostnader","Organisationen används bara i drift; WBS bara i projektering","Det finns ingen principiell skillnad mellan dem"],"correct":[0],"why":"Organisationen beskriver vem som gör och beslutar vad, medan WBS strukturerar vad som ska utföras."},{"ch":3,"q":"En byggherre anlitar en projektledare. Vilken ansvarsfördelning är mest rimlig enligt kapitlet?","opts":["Projektledaren övertar automatiskt hela byggherrens juridiska ansvar","Byggherren har övergripande ansvar medan projektledaren kan få uppdrag att leda och samordna","Entreprenören blir alltid beställare när projektledare utses","Konsulterna ansvarar gemensamt för samtliga byggherrebeslut"],"correct":[1],"why":"Byggherren är en central aktör med ansvar; projektledarens mandat beror på uppdrag och delegation."},{"ch":3,"q":"Vilka av följande aktörer behandlas i kapitlets genomgång av byggsektorn? Markera alla rätta.","opts":["Byggherrar och beställare","Projektörer och konsulter","Entreprenörer och materialleverantörer","Endast kommunala myndigheter"],"correct":[0,1,2],"why":"Kapitlet beskriver flera aktörsgrupper, bland annat byggherrar, konsulter, entreprenörer och leverantörer."},{"ch":3,"q":"Ett projekt behöver arkitekt- och konstruktionsunderlag. Vilken aktörsgrupp är mest direkt kopplad till den uppgiften?","opts":["Projektörer och tekniska konsulter","Byggmaterialleverantörer","Fastighetsförvaltare som enda aktör","Entreprenörer som enbart utför färdig projektering"],"correct":[0],"why":"Projektörer och konsulter tar fram tekniska lösningar och handlingar inom sina kompetensområden."},{"ch":3,"q":"Vilka av följande är relevanta arbetsuppgifter för en byggherre i ett projekt? Markera alla rätta.","opts":["Formulera behov och krav","Ordna projektets finansiering","Ta ställning till viktiga beslut","Personligen utföra alla entreprenadarbeten"],"correct":[0,1,2],"why":"Byggherren initierar och styr projektet, medan praktiskt utförande kan upphandlas av andra aktörer."},{"ch":3,"q":"En entreprenör och en byggmaterialleverantör har olika roller. Vilken skillnad är mest träffande?","opts":["Entreprenören utför avtalat arbete; leverantören tillhandahåller material eller produkter","Entreprenören bestämmer alltid byggnadens användning; leverantören ansvarar för alla tillstånd","Entreprenören svarar enbart för projektering; leverantören enbart för myndighetsbeslut","Entreprenören förvaltar alltid byggnaden; leverantören leder projektorganisationen"],"correct":[0],"why":"Entreprenören ansvarar för avtalade utförandearbeten medan leverantören levererar produkter eller material."},{"ch":3,"q":"Vilka av följande kan påverka en byggherres förutsättningar att genomföra ett projekt? Markera alla rätta.","opts":["Finansiering och ekonomiska ramar","Organisation och tillgänglig kompetens","Myndighetskrav och tillstånd","Enbart valet av fasadkulör"],"correct":[0,1,2],"why":"Byggherrens förutsättningar formas av bland annat ekonomi, kompetens och krav från omgivningen."},{"ch":3,"q":"Vilken aktör har typiskt sett uppgiften att omsätta projekterade handlingar i fysiskt byggarbete?","opts":["Beställaren i rollen som beslutsfattare","Entreprenören inom sitt avtalade åtagande","Myndigheten som handlägger tillstånd","Konsulten enbart genom sin granskningsroll"],"correct":[1],"why":"Entreprenören utför de bygg- eller anläggningsarbeten som omfattas av entreprenadavtalet."},{"ch":3,"q":"En kommun uppträder i ett projekt både som beställare och som myndighet. Vilken slutsats är viktig?","opts":["De två rollerna måste hållas isär eftersom uppgifter och befogenheter skiljer sig","Kommunen får aldrig vara byggherre när tillstånd krävs","Myndighetsrollen innebär att kommunen automatiskt bygger i egen regi","Beställarrollen upphäver behovet av myndighetsprövning"],"correct":[0],"why":"Beställarens projektintresse och myndighetens prövning är olika funktioner även om samma kommun berörs."},{"ch":3,"q":"Vilka uppgifter kan en konsult bidra med i ett byggprojekt? Markera alla rätta.","opts":["Specialistutredningar och projektering","Tekniska bedömningar och beslutsunderlag","Rådgivning inom sitt kompetensområde","Automatiskt överta beställarens samtliga beslut"],"correct":[0,1,2],"why":"Konsulter bidrar med sakkunskap men får inte automatiskt beställarens beslutsmandat."},{"ch":3,"q":"Varför behöver en projektledare förstå byggsektorns olika aktörsroller?","opts":["För att kunna samordna gränssnitt, ansvar och informationsflöden","För att göra alla aktörers uppgifter utbytbara","För att slippa dokumentera beslut och överlämningar","För att ersätta entreprenadavtal med muntliga överenskommelser"],"correct":[0],"why":"Kunskap om aktörernas olika ansvar behövs för fungerande samordning och tydliga överlämningar."}];const C=[["Projekt","Tidsavgränsad uppgift som ska skapa ett unikt resultat."],["Projekttriangeln","Tid, ekonomi och omfattning."],["Omfattning","Tekniskt resultat och krav på kvantitet och kvalitet."],["Processmål","Mål för hur arbetet ska genomföras, exempelvis säkerhet."],["Effektmål","Den långsiktiga nytta eller verkan som projektet ska åstadkomma."],["Projektmål","Mål för projektets leverans och genomförande."],["Beställare","Projektägare med övergripande ansvar för behov och nytta."],["Projektledare","Leder projektet mot målen och balanserar tid, kostnad och omfattning."],["Byggprojektledare","Företräder ofta beställaren genom projektering och andra skeden."],["Byggledare","Leder ofta arbetet under produktionsskedet."],["Beslutspunkt","Definierat vägval där fortsättning, omarbetning, väntan eller avslut beslutas."],["Milstolpe","Kontrollpunkt för ett viktigt delresultat."],["Planering","Processen där projektplan och aktiviteter tas fram."],["Genomförande","Processen där planerade aktiviteter utförs."],["Uppföljning","Kontroll och återkoppling för styrning av projektet."],["Avslutning","Avsluta projektet och dokumentera resultat och erfarenheter."],["Projektintegration","Samordning och styrning av interna och externa kontaktytor."],["Livscykelkostnad","Kostnader för investering, drift, underhåll och andra skeden över livslängden."],["Byggprojektledarens rådgivning","Byggtekniska och ekonomiska frågor för byggherren."],["Riskhantering","Identifiera och hantera osäkerheter i projektet."],["Projektplan","Beskriver hur projektet ska genomföras, aktiviteter och tider."],["Entreprenör","Aktör som genomför avtalade bygg- eller anläggningsarbeten."],["Konsult","Sakkunnig aktör som anlitas för särskilda uppgifter i projektet."],["Byggmaterialleverantör","Levererar byggmaterial och produkter till byggprojekt."]];let idx=0,selected=new Set(),answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}
function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><p>Flervalsfrågor ger poäng endast om samtliga rätta alternativ har valts och inga felaktiga.</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Kapitel '+q.ch;$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';let multi=q.correct.length>1;let hint=document.createElement('p');hint.className='muted small';hint.textContent=multi?'Flera alternativ är rätt. Markera alla rätta och klicka sedan på Kontrollera svar.':'Välj det bästa svaret.';$('options').appendChild(hint);q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});let check=document.createElement('button');check.id='checkanswer';check.className='primary';check.textContent='Kontrollera svar';check.style.display=multi?'inline-block':'none';check.disabled=true;check.onclick=checkAnswer;$('options').appendChild(check);$('feedback').classList.add('hide');$('next').disabled=true;selected=new Set();answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}
function choose(i){if(answered)return;let q=Q[order[idx]];let multi=q.correct.length>1;if(!multi){selected=new Set([i]);checkAnswer();return}if(selected.has(i))selected.delete(i);else selected.add(i);[...$('options').querySelectorAll('button.option')].forEach((b,j)=>b.classList.toggle('selected',selected.has(j)));$('checkanswer').disabled=selected.size===0}
function checkAnswer(){if(answered||selected.size===0)return;answered=true;let q=Q[order[idx]];let ok=selected.size===q.correct.length&&q.correct.every(i=>selected.has(i));if(ok)score++;[...$('options').querySelectorAll('button.option')].forEach((b,j)=>{b.disabled=true;if(q.correct.includes(j))b.classList.add('correct');else if(selected.has(j))b.classList.add('wrong')});$('checkanswer').style.display='none';$('feedback').textContent='';let strong=document.createElement('b');strong.textContent=ok?'Rätt svar!':'Inte riktigt.';let p=document.createElement('p');p.textContent=q.why;let p2=document.createElement('p');p2.textContent='Rätt alternativ: '+q.correct.map(i=>String.fromCharCode(65+i)).join(', ')+'.';$('feedback').append(strong,p,p2);$('feedback').classList.remove('hide');$('next').disabled=false}
function next(){idx++;render()}function restart(){location.reload()}
function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
