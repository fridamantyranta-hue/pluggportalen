ze:.85rem}footer{text-align:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Byggledning projektering - frågor till boken</h1><p>Utmanande quiz med varierande antal rätta svar och närliggande alternativ från kurslitteraturen · Kapitel 1–3.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 24 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Samhällsbyggnad · Studiematerial 2026–2028 <span aria-hidden="true">·</span> <a href="om-pluggportalen.html" style="color:inherit;text-underline-offset:3px">Om Pluggportalen</a> <span aria-hidden="true">·</span> © 2026 Frida Mäntyranta</footer><script>const Q=[{"ch":1,"q":"Vilken analys fångar bäst en byggnads nytta efter färdigställandet?","opts":["Att jämföra enbart slutkostnad med den första kostnadskalkylen","Att bedöma produktionstiden och bortse från byggnadens användning","Att kombinera investeringsutgift med drift, underhåll och verksamhetsnytta","Att utgå från entreprenadens färdigställande som enda effektmått"],"correct":[2],"why":"Bokens processperspektiv kopplar byggandet till förvaltning och användning över tid.","multi":false},{"ch":1,"q":"Vilka påståenden beskriver en direkt relation mellan projektering, produktion och förvaltning?","opts":["Projektledningsprocessen kan pågå parallellt med projektering och produktion","Projekteringsprocessen tar fram underlag som används vid produktionen","Produktionsprocessen avser i första hand framtagning av förvaltningsbudget","Förvaltningsprocessen omfattar verksamhet efter byggnadens färdigställande"],"correct":[1,3],"why":"Projektering tar fram underlag för produktion, medan förvaltning avser användningen efter färdigställandet. Projektledningsprocessens samtidighet är möjlig men beskriver inte den efterfrågade direkta relationen.","multi":true},{"ch":1,"q":"En beställare har jämfört alternativ och väljer nu tekniska huvudlösningar. Vilket steg är mest träffande?","opts":["Förstudie, eftersom alternativen fortfarande prövas utan val","Förvaltning, eftersom tekniska lösningar används och underhålls","Projektering, eftersom valda lösningar utvecklas till handlingar","Programarbete, eftersom verksamhetsbehoven först formuleras"],"correct":[2],"why":"När lösningar bearbetas till tekniskt underlag har projektet gått in i projekteringen.","multi":false},{"ch":1,"q":"Vilka aktiviteter kan vara motiverade innan ett byggprojekt går vidare till detaljerad projektering?","opts":["Bedöma om projektidén är tekniskt och ekonomiskt genomförbar","Fastställa verksamhetens behov och övergripande krav","Låsa samtliga produktionsdetaljer innan alternativ har jämförts","Värdera alternativa lägen eller utformningar"],"correct":[0,1,3],"why":"Tidiga skeden klargör behov, förutsättningar och alternativ; detaljer låses successivt.","multi":true},{"ch":1,"q":"Vad är den viktigaste innebörden av att byggprojektet avslutas men byggnadens livscykel fortsätter?","opts":["Projektresultatet övergår till användning och förvaltning med nya uppgifter","Projektets ekonomiska uppföljning upphör och alla kostnader är kända","Projektorganisationen blir automatiskt förvaltningsorganisation","Projekteringen måste alltid fortsätta som en separat huvudprocess"],"correct":[0],"why":"Projektet är tidsavgränsat, men dess resultat används och förvaltas under lång tid.","multi":false},{"ch":1,"q":"Vilka relationer mellan projektering och produktion är förenliga med bokens processmodell?","opts":["Produktion kan ge återkoppling som föranleder projekteringsändringar","Projektering ger underlag för hur byggnaden ska utföras","All projektering måste vara helt avslutad innan någon produktion får starta","Projektering och produktion kan ha överlappande aktiviteter"],"correct":[0,1,3],"why":"Processerna har ett beroende och kan i praktiken överlappa; ändringar behöver samordnas.","multi":true},{"ch":1,"q":"Vilka aspekter behöver vägas in när byggandet betraktas som en process?","opts":["Att varje aktivitet alltid måste ske strikt efter föregående utan överlapp","Hur information förs mellan aktörer och skeden","Hur olika delprocesser påverkar varandra","Samband mellan beslut, aktiviteter och resultat"],"correct":[1,2,3],"why":"Processynsättet betonar aktiviteter, informationsflöden och beroenden snarare än bara slutprodukten.","multi":true},{"ch":1,"q":"Varför är processmodeller användbara även om verkliga projekt inte följer dem exakt?","opts":["De gör projektspecifika riskbedömningar överflödiga","De visar principiella samband och beslutspunkter som kan anpassas","De garanterar att varje projekt följer identisk ordning","De ersätter behovet av ansvarsfördelning mellan aktörer"],"correct":[1],"why":"Modeller hjälper till att förstå helheten men måste anpassas till verkliga projekt.","multi":false},{"ch":2,"q":"Vilken slutsats är mest välgrundad om projekttiden ska kortas utan att kraven ändras?","opts":["Projektet bör analysera effekter på resurser, kostnad och genomföranderisk","Omfattningen blir automatiskt mindre när tidsplanen kortas","Kvaliteten kan förutsättas vara oförändrad utan nya kontroller","Tidsmålet kan ändras utan konsekvenser om budgeten är beslutad"],"correct":[0],"why":"Projekttriangelns dimensioner påverkar varandra; kortare tid kan kräva resurser och ändra riskbilden.","multi":false},{"ch":2,"q":"Vilka formuleringar är exempel på resultat- eller effektmål snarare än processmål?","opts":["Att leverera en anläggning med bestämd kapacitet och funktion","Att verksamheten får kortare transporter efter driftsättning","Att alla arbetsmoment har samma start- och sluttid","Att arbetet genomförs utan allvarliga arbetsmiljöincidenter"],"correct":[0,1],"why":"Leveransen är ett projektresultat och förändrade transporter en avsedd effekt; arbetsmiljöincidenter gäller hur processen genomförs.","multi":true},{"ch":2,"q":"Vad är den mest centrala funktionen hos en projektbeställning?","opts":["Att ersätta en successivt utvecklad projektplan","Att fastställa projektets slutliga relationshandlingar","Att ange uppdrag, ramar och förväntade resultat inför genomförandet","Att dokumentera endast vilka fakturor som ska betalas"],"correct":[2],"why":"Projektbeställningen är en utgångspunkt för mandat, inriktning och projektstyrning.","multi":false},{"ch":2,"q":"Vilken formulering är tydligast ett effektmål snarare än ett leveransmål?","opts":["En ny gång- och cykelbro är färdigställd till november","Bron har projekterats för angiven lastklass","Slutbesiktningen ska vara genomförd före överlämning","Andelen korta bilresor i området ska minska efter öppnandet"],"correct":[3],"why":"Effektmålet avser den förändring eller nytta som resultatet ska bidra till efter leverans.","multi":false},{"ch":2,"q":"Vilka uppgifter kan ligga inom projektledarens uppdrag?","opts":["Följa upp tid, ekonomi och omfattning","Självständigt ändra beställarens effektmål utan mandat","Bereda beslut och rapportera avvikelser till beställaren","Samordna berörda aktörer och informationsflöden"],"correct":[0,2,3],"why":"Projektledaren styr och samordnar inom sitt mandat; beställarens övergripande mål kan inte ändras fritt.","multi":true},{"ch":2,"q":"Vad ger en WBS framför allt stöd för?","opts":["Att beräkna projektets kassaflöde utan ytterligare uppgifter","Att fastställa vem som har juridiskt ansvar enligt varje avtal","Att beskriva vilka delar och arbetspaket som ingår i projektet","Att visa den exakta kronologiska ordningen mellan alla aktiviteter"],"correct":[2],"why":"WBS bryter ned projektets omfattning; ordning, ansvar och ekonomi kräver kompletterande planering.","multi":false},{"ch":2,"q":"Vilka påståenden om WBS är rimliga?","opts":["Den kan ligga till grund för planering av resurser och kostnader","Den visar automatiskt alla beroenden mellan aktiviteter","Den kan användas som grund för uppföljning av leveranser","Den delar upp projektets innehåll i hanterbara delar"],"correct":[0,2,3],"why":"WBS beskriver arbetets innehåll och stödjer planering och uppföljning, men är inte en fullständig nätplan.","multi":true},{"ch":2,"q":"Vilken information behöver främst komplettera en WBS för att ge en genomförbar tidplan?","opts":["Aktiviteters beroenden, varaktighet och tidsmässiga ordning","En lista över projektets samtliga intressenter utan tidsangivelser","Enbart totalbudgeten för hela projektet","Endast en mer detaljerad uppdelning av samma leveranser"],"correct":[0],"why":"Tidplanering kräver att arbetspaket omsätts till tidsatta aktiviteter med beroenden.","multi":false},{"ch":2,"q":"Vilka områden bör projektledningen kunna följa upp under genomförandet?","opts":["Endast nedlagd arbetstid, eftersom den ensam visar projektets resultat","Färdigställandegrad jämfört med tidplan","Om leveranserna uppfyller överenskomna krav","Prognos för slutkostnad jämfört med budget"],"correct":[1,2,3],"why":"Ekonomi, tid och omfattning/kvalitet måste följas tillsammans.","multi":true},{"ch":2,"q":"Beställaren vill lägga till en funktion som påverkar både kostnad och tid. Vilken hantering är bäst?","opts":["Införa ändringen direkt och justera kalkylen vid slutredovisningen","Avvisa alla ändringar efter att projektplanen har fastställts","Analysera konsekvenserna och få ändringen beslutad enligt mandat","Ändra tidplanen men lämna projektets krav och kostnadsprognos oförändrade"],"correct":[2],"why":"Ändringsstyrning innebär att påverkan på mål och ramar utreds innan beslut.","multi":false},{"ch":2,"q":"Vilka moment hör till analysdelen av ett strukturerat riskarbete, snarare än till beslut om åtgärder och senare uppföljning?","opts":["Bedöma sannolikhet och konsekvens","Identifiera osäkerheter som kan påverka måluppfyllelsen","Välja åtgärder och följa upp kvarstående risker","Avsluta riskarbetet när projektplanen har godkänts"],"correct":[0,1],"why":"Riskanalysen identifierar och värderar osäkerheter; val av åtgärder och uppföljning är efterföljande hantering.","multi":true},{"ch":2,"q":"Vilket påstående skiljer bäst en WBS från en projektorganisation?","opts":["WBS och organisationsschema är två namn för samma uppdelning","WBS visar hur arbetet är uppdelat; organisationen visar roller och ansvar","WBS visar vem som beslutar; organisationen visar endast vilka material som köps","WBS visar enbart projektets ekonomi; organisationen visar dess tidplan"],"correct":[1],"why":"WBS är en arbetsnedbrytning medan organisationen beskriver människor, roller och mandat.","multi":false},{"ch":3,"q":"Vilken ansvarsfördelning beskriver bäst förhållandet mellan byggherre och anlitad projektledare?","opts":["Projektledaren har alltid samma befogenheter som byggnadsnämnden","Byggherren har ett övergripande ansvar medan projektledaren arbetar inom sitt mandat","Byggherren får inte delta i projektets beslut efter att projektledaren anlitats","Projektledaren övertar automatiskt alla byggherreskyldigheter genom uppdraget"],"correct":[1],"why":"Projektledaren företräder eller bistår byggherren inom överenskomna ramar.","multi":false},{"ch":3,"q":"Vilka aktörskategorier kan ha skilda roller i ett byggprojekt?","opts":["Projektörer och andra konsulter","Kommunal byggnadsnämnd och dess myndighetsfunktion","Entreprenörer och materialleverantörer","Byggherre och beställare"],"correct":[0,1,2,3],"why":"Alla fyra kategorier förekommer i byggsektorn, men med skilda uppgifter och ansvar.","multi":true},{"ch":3,"q":"En byggherre behöver underlag för byggnadens gestaltning och bärande konstruktion. Vilken lösning är mest relevant?","opts":["Beställa utförandet utan tekniskt underlag och lösa frågorna i produktion","Låta materialleverantören ensam fastställa samtliga funktionskrav","Överlåta både gestaltning och konstruktion till byggnadsnämnden","Anlita arkitekt och konstruktör med samordnade uppdrag"],"correct":[3],"why":"Arkitekt och konstruktör svarar för olika delar av projekteringen som måste samordnas.","multi":false},{"ch":3,"q":"Vilka alternativ beskriver det övergripande projektansvar som byggherren måste säkerställa även när projekteringen läggs ut?","opts":["Att själv leverera samtliga byggmaterial","Att själv producera varje konstruktionsritning","Att projektets mål och krav formuleras","Att personligen utföra varje teknisk kontroll"],"correct":[2],"why":"Byggherren behöver säkerställa projektets mål och krav. Finansieringsarbete och myndighetsprocesser kan hanteras med stöd av andra aktörer, men byggherren har fortfarande ansvar inom relevanta regelverk.","multi":true},{"ch":3,"q":"Vilken skillnad mellan entreprenör och byggmaterialleverantör är mest träffande?","opts":["Entreprenören utför avtalade arbeten; leverantören tillhandahåller produkter eller material","Entreprenören beslutar alltid om bygglov; leverantören ansvarar för detaljplanen","Rollerna skiljer sig enbart genom vilken typ av faktura de använder","Leverantören ansvarar alltid för hela byggplatsens arbetsmiljö; entreprenören endast för inköp"],"correct":[0],"why":"Rollerna utgår från arbete respektive leverans, även om företag ibland kan ha flera funktioner.","multi":false},{"ch":3,"q":"Vilka faktorer kan påverka byggherrens förutsättningar?","opts":["Ekonomiska ramar och finansiering","Tillgång till kompetens och genomföranderesurser","Plan- och byggrelaterade myndighetskrav","Om projektet bedrivs i offentlig eller privat regi"],"correct":[0,1,2,3],"why":"Samtliga fyra faktorer kan påverka ett projekts förutsättningar och beslutsvägar.","multi":true},{"ch":3,"q":"Vilken aktör är normalt mest direkt knuten till det fysiska utförandet av byggarbetena?","opts":["Projekteringskonsulten i sin granskningsroll","Byggnadsnämnden genom sin tillsyn","Entreprenören enligt entreprenadavtalet","Byggherrens finansiär genom lånevillkoren"],"correct":[2],"why":"Entreprenören genomför normalt de byggarbeten som avtalats.","multi":false},{"ch":3,"q":"Kommunen är både byggherre och tillståndsmyndighet i samma projekt. Vad är viktigast att skilja på?","opts":["Beställarens projektbeslut och myndighetens formella prövning","Projektledarens tidplan och byggherrens finansiering, eftersom dessa ersätter myndighetsprövningen","Kommunens budget och dess val av entreprenör, eftersom båda alltid är myndighetsbeslut","Bygglovsbeslut och projekteringsmöten, eftersom båda fattas av samma person"],"correct":[0],"why":"Beställarrollen och myndighetsrollen har olika uppgifter och beslutsgrunder.","multi":false},{"ch":3,"q":"Vilka insatser kan en konsult bidra med inom ramen för sitt uppdrag?","opts":["Beslutsunderlag och rådgivning","Specialistutredningar","Beslut på byggherrens vägnar när uttryckligt mandat finns","Teknisk projektering och granskning"],"correct":[0,1,2,3],"why":"En konsult kan bidra med alla dessa uppgifter, men beslut på byggherrens vägnar kräver mandat.","multi":true},{"ch":3,"q":"Vad är den viktigaste nyttan av att projektledaren känner till byggsektorns aktörsroller?","opts":["Att projektet kan styras enbart med muntliga överenskommelser","Att alla uppdrag kan ges samma ansvarsfördelning oberoende av avtal","Att kunna samordna ansvar, gränssnitt och beslut mellan berörda parter","Att projekteringsansvar och myndighetsansvar kan behandlas som utbytbara"],"correct":[2],"why":"Olika roller har olika ansvar och befogenheter; kunskap om dem stödjer samordning.","multi":false}];const C=[["Projekt","Tidsavgränsad uppgift som ska skapa ett unikt resultat."],["Projekttriangeln","Tid, ekonomi och omfattning."],["Omfattning","Tekniskt resultat och krav på kvantitet och kvalitet."],["Processmål","Mål för hur arbetet ska genomföras, exempelvis säkerhet."],["Effektmål","Den långsiktiga nytta eller verkan som projektet ska åstadkomma."],["Projektmål","Mål för projektets leverans och genomförande."],["Beställare","Projektägare med övergripande ansvar för behov och nytta."],["Projektledare","Leder projektet mot målen och balanserar tid, kostnad och omfattning."],["Byggprojektledare","Företräder ofta beställaren genom projektering och andra skeden."],["Byggledare","Leder ofta arbetet under produktionsskedet."],["Beslutspunkt","Definierat vägval där fortsättning, omarbetning, väntan eller avslut beslutas."],["Milstolpe","Kontrollpunkt för ett viktigt delresultat."],["Planering","Processen där projektplan och aktiviteter tas fram."],["Genomförande","Processen där planerade aktiviteter utförs."],["Uppföljning","Kontroll och återkoppling för styrning av projektet."],["Avslutning","Avsluta projektet och dokumentera resultat och erfarenheter."],["Projektintegration","Samordning och styrning av interna och externa kontaktytor."],["Livscykelkostnad","Kostnader för investering, drift, underhåll och andra skeden över livslängden."],["Byggprojektledarens rådgivning","Byggtekniska och ekonomiska frågor för byggherren."],["Riskhantering","Identifiera och hantera osäkerheter i projektet."],["Projektplan","Beskriver hur projektet ska genomföras, aktiviteter och tider."],["Entreprenör","Aktör som genomför avtalade bygg- eller anläggningsarbeten."],["Konsult","Sakkunnig aktör som anlitas för särskilda uppgifter i projektet."],["Byggmaterialleverantör","Levererar byggmaterial och produkter till byggprojekt."]];let idx=0,selected=new Set(),answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}
function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><p>Frågor med kryssrutor ger poäng endast om exakt alla rätta alternativ har markerats – oavsett hur många det är.</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Kapitel '+q.ch;$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';let multi=q.multi===true;let hint=document.createElement('p');hint.className='muted small';hint.textContent=multi?'Flera svar kan vara rätt. Markera alla alternativ du bedömer som korrekta och klicka på Kontrollera svar.':'Välj det bästa svaret.';$('options').appendChild(hint);q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});let check=document.createElement('button');check.id='checkanswer';check.className='primary';check.textContent='Kontrollera svar';check.style.display=multi?'inline-block':'none';check.disabled=true;check.onclick=checkAnswer;$('options').appendChild(check);$('feedback').classList.add('hide');$('next').disabled=true;selected=new Set();answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}
function choose(i){if(answered)return;let q=Q[order[idx]];let multi=q.multi===true;if(!multi){selected=new Set([i]);checkAnswer();return}if(selected.has(i))selected.delete(i);else selected.add(i);[...$('options').querySelectorAll('button.option')].forEach((b,j)=>b.classList.toggle('selected',selected.has(j)));$('checkanswer').disabled=selected.size===0}
function checkAnswer(){if(answered||selected.size===0)return;answered=true;let q=Q[order[idx]];let ok=selected.size===q.correct.length&&q.correct.every(i=>selected.has(i));if(ok)score++;[...$('options').querySelectorAll('button.option')].forEach((b,j)=>{b.disabled=true;if(q.correct.includes(j))b.classList.add('correct');else if(selected.has(j))b.classList.add('wrong')});$('checkanswer').style.display='none';$('feedback').textContent='';let strong=document.createElement('b');strong.textContent=ok?'Rätt svar!':'Inte riktigt.';let p=document.createElement('p');p.textContent=q.why;let p2=document.createElement('p');p2.textContent='Rätt alternativ: '+q.correct.map(i=>String.fromCharCode(65+i)).join(', ')+'.';$('feedback').append(strong,p,p2);$('feedback').classList.remove('hide');$('next').disabled=false}

function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
