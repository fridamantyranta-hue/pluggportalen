<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcards – Byggherrens roll</title><style>:root{font-family:system-ui,Segoe UI,sans-serif;color:#18312d;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:30px auto;padding:20px}.hero{background:linear-gradient(120deg,#123f39,#267765);color:white;border-radius:22px;padding:30px}.hero p{opacity:.88}.panel{background:white;border:1px solid #dbe6e1;border-radius:20px;padding:26px;margin-top:18px;box-shadow:0 10px 30px #173e3210}h1{font-size:clamp(25px,4vw,39px);margin:0 0 10px}h2{font-size:23px}button,.btn{cursor:pointer;background:#176a57;color:white;border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:15px}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#e7f1ec;color:#174e40}.opt{display:flex;gap:12px;align-items:center;border:2px solid #e0e8e3;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;line-height:1.45}.opt input{width:19px;height:19px;accent-color:#19705b}.opt.good{background:#e3f5e9;border-color:#22834d}.opt.bad{background:#fde9e9;border-color:#c54444}.star{color:#aa6300;font-size:22px;font-weight:900}.muted{color:#63756e}.tag{display:inline-block;border-radius:99px;background:#e7f1ec;color:#145947;padding:7px 11px;font-weight:700;font-size:13px}.bar{height:8px;background:#dce9e2;border-radius:20px;overflow:hidden;margin:20px 0}.bar>div{height:100%;background:#3eac82}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.explain{background:#f2f7f3;border-left:4px solid #398b70;padding:16px;border-radius:8px;margin-top:18px}.legend{font-size:14px;margin-top:14px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin:12px 0}.pair select{padding:12px;width:100%;border:2px solid #dce6e0;border-radius:10px;background:white;font-size:14px}.pair.good select{border-color:#22834d;background:#e3f5e9}.pair.bad select{border-color:#c54444;background:#fde9e9}a{color:#145947}@media(max-width:600px){main{padding:10px;margin:10px auto}.panel,.hero{padding:19px}.pair{grid-template-columns:1fr;gap:4px}}</style><style>#face{font-size:clamp(21px,3vw,30px);font-weight:700;min-height:170px;display:grid;place-items:center;text-align:center;padding:22px;background:#edf5f0;border-radius:16px;line-height:1.4}</style></head><body><main><header class="hero"><div style="font-size:13px;letter-spacing:.1em">BYGG- OCH ANLÄGGNINGSPROJEKTERING · P0009B</div><h1>Flashcards – Byggherrens roll</h1><p>15 kort som matchar quizets viktigaste kunskapsområden. Försök svara innan du vänder kortet.</p></header><div class="panel" id="card"><div class="muted" id="count"></div><p class="tag" id="side"></p><div id="face"></div><div class="actions"><button id="flip">Visa svar</button><button id="again" class="ghost" hidden>Behöver öva igen</button><button id="yes" hidden>Kunde det ✓</button></div><p class="muted">Kunde: <b id="known">0</b> · Behöver öva: <b id="hard">0</b></p></div><div class="panel" id="done" hidden><h2>Omgången klar!</h2><p id="summary"></p><div class="actions"><button id="retry">Repetera svåra kort</button><button class="ghost" id="all">Börja om med alla kort</button></div></div><p><a href="quiz-byggherrens-roll.html">← Till quizet</a></p></main><script>const cards=[["Vem är byggherre enligt PBL?", "Den som för egen räkning utför eller låter utföra bygg-, rivnings-, mark- eller projekteringsarbeten."], ["Försvinner byggherreansvaret när entreprenör anlitas?", "Nej. Byggherren ansvarar fortfarande för att tillämpliga krav enligt PBL uppfylls."], ["Vad skiljer förvaltningsbyggherren från försäljningsbyggherren?", "Långsiktigt ägande och förvaltning respektive byggande för försäljning."], ["Vad är en brukarbyggherre?", "En aktör som bygger för eget bruk men har annan kärnverksamhet än fastigheter eller anläggningar."], ["Vad analyseras i en förstudie?", "Bland annat projektförutsättningar, ekonomi, risker och möjliga alternativ."], ["Varför behövs geotekniska undersökningar?", "För att bedöma markens stabilitet, bärförmåga och byggbarhet."], ["Vad påverkar valet av entreprenadform?", "Ansvarsfördelning, risknivå och behovet av byggherrens egna resurser."], ["Vad avgörs i upphandlingsstrategin?", "Bland annat konkurrensform, ramavtal, dialog och viktning av pris och kvalitet."], ["Kan upphandling ske före avslutad projektering?", "Ja. Föreläsningen visar att upphandling kan ske i flera skeden."], ["Vilka krav kan ingå i ett upphandlingsunderlag?", "Teknik, ekonomi, kvalitet, arbetsmiljö, miljö, kompetens och riskfördelning."], ["Varför är tidiga projektbeslut viktiga?", "Påverkansmöjligheten är större tidigt; sena ändringar blir ofta dyrare."], ["Vilka värden ska byggherren balansera?", "Ekonomiska, sociala och miljömässiga värden samt funktion över tid."], ["Vad mäter BKI jämfört med KPI?", "BKI: produktionskostnader i bostadsbyggande. KPI: konsumentprisernas utveckling."], ["Vilka branschutmaningar lyfts?", "Bland annat arbetsmiljö, kvalitet, klimat, digitalisering och kompetens."], ["Vilken skillnad finns mellan lag och allmänna råd?", "Lag är bindande; allmänna råd är inte bindande i sig."]];let deck=[...cards.keys()].sort(()=>Math.random()-.5),i=0,flipped=false,known=new Set(),hard=new Set();const $=s=>document.querySelector(s);function show(){let n=deck[i];$('#count').textContent=`Kort ${i+1} av ${deck.length}`;$('#face').textContent=flipped?cards[n][1]:cards[n][0];$('#side').textContent=flipped?'SVAR':'FRÅGA';$('#known').textContent=known.size;$('#hard').textContent=hard.size;$('#again').hidden=!flipped;$('#yes').hidden=!flipped;$('#flip').textContent=flipped?'Vänd tillbaka':'Visa svar';$('#done').hidden=true;$('#card').hidden=false}function next(){if(i<deck.length-1){i++;flipped=false;show()}else{$('#card').hidden=true;$('#done').hidden=false;$('#summary').textContent=`${known.size} kunde du · ${hard.size} behöver övas igen.`}}$('#flip').onclick=()=>{flipped=!flipped;show()};$('#again').onclick=()=>{hard.add(deck[i]);known.delete(deck[i]);next()};$('#yes').onclick=()=>{known.add(deck[i]);hard.delete(deck[i]);next()};$('#retry').onclick=()=>{deck=[...hard].sort(()=>Math.random()-.5);if(!deck.length)return;hard.clear();i=0;flipped=false;show()};$('#all').onclick=()=>location.reload();show();</script></body></html>
