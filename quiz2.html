<!doctype html><html lang="sv"><head>
  <link rel="icon" type="image/x-icon" href="favicon.ico"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz 2 – Projekteringsledaren</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#20352b;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 60px}header{padding:25px 0}h1{font-size:clamp(25px,5vw,38px);margin:5px 0}h2{font-size:23px;line-height:1.35}p{line-height:1.5}.muted{color:#607269}.card{background:white;border:1px solid #dbe5de;border-radius:18px;padding:24px;box-shadow:0 6px 22px #1b3e2710}.opt{display:flex;align-items:center;gap:12px;padding:15px;margin:10px 0;border:2px solid #dce6df;border-radius:12px;cursor:pointer;line-height:1.4}.opt:has(input:checked){border-color:#2f7755;background:#e9f5ec}input{width:20px;height:20px;accent-color:#26784c;flex-shrink:0}button,.link{background:#246a48;color:white;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e6eee8;color:#1c5136}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.progress{height:9px;border-radius:12px;background:#dce7de;overflow:hidden;margin:20px 0}.bar{height:100%;background:#348457;transition:width .2s}.match{display:block;margin:15px 0}.match select{width:100%;padding:12px;margin-top:7px;border-radius:9px;border:1px solid #a7b8ab;font-size:16px;background:white}.review{padding:16px;border-left:5px solid #bb7251;background:#faf7f1;border-radius:8px;margin:12px 0}.review.good{border-color:#348457;background:#eef8f0}.score{font-size:45px;font-weight:800}nav{display:flex;flex-wrap:wrap;gap:10px}nav a{color:#246a48}small{font-size:13px}</style></head><body><main class="wrap"><header><nav><a href="index.html">Alla quiz</a></nav><h1>Quiz 2 – Projekteringsledaren</h1><p class="muted">10 frågor · Facit visas när du avslutar quizet</p></header><div id="app"></div></main><script>const Q=[{"title": "Fråga 1", "question": "Vilken är projekteringsledarens huvudsakliga uppgift?", "type": "choice", "options": ["Utföra byggproduktionen", "Samordna projekteringen mellan olika aktörer", "Upphandla entreprenörer", "Ansvara för bygglovshandläggning"], "correct": ["B"]}, {"title": "Fråga 2", "question": "I vilket skede tas vanligtvis systemhandlingar fram?", "type": "choice", "options": ["Förvaltningsskedet", "Byggskedet", "Projekteringsskedet", "Garantiskedet"], "correct": ["C"]}, {"title": "Fråga 3", "question": "Vad är syftet med samordningsmöten under projekteringen?", "type": "choice", "options": ["Att besluta entreprenadform", "Att samordna olika discipliners handlingar och lösningar", "Att genomföra slutbesiktning", "Att fastställa hyror"], "correct": ["B"]}, {"title": "Fråga 4", "question": "Vilka två påståenden om BIM är korrekta?", "type": "choice", "options": ["BIM är endast 3D-visualisering", "BIM underlättar samordning mellan discipliner", "BIM kan användas för informationshantering genom hela livscykeln", "BIM ersätter behovet av granskning"], "correct": ["B", "C"]}, {"title": "Fråga 5", "question": "Vad står VDC för?", "type": "choice", "options": ["Visual Design Control", "Virtual Design & Construction", "Verified Digital Construction", "Virtual Development Concept"], "correct": ["B"]}, {"title": "Fråga 6", "question": "Vilken funktion har BAS-P i ett projekt?", "type": "choice", "options": ["Produktionsekonomi", "Arbetsmiljösamordning under planering och projektering", "Besiktningsansvarig", "Kvalitetsansvarig för entreprenaden"], "correct": ["B"]}, {"title": "Fråga 7", "question": "Vilka två aktiviteter är viktiga för kvalitetssäkring i projekteringen?", "type": "choice", "options": ["Granskning av handlingar", "Samordning mellan konsulter", "Försäljning av projektet", "Slutbetalning till entreprenör"], "correct": ["A", "B"]}, {"title": "Fråga 8", "question": "Vilken ordning är korrekt i projekteringstrappan?", "type": "choice", "options": ["Bygghandling → Programhandling → Systemhandling", "Förstudie → Programhandling → Systemhandling → Bygghandling", "Programhandling → Bygghandling → Förstudie", "Bygghandling → Förstudie → Relationshandling"], "correct": ["B"]}, {"title": "Fråga 9", "question": "Vad är en viktig fördel med partnering?", "type": "choice", "options": ["Mindre kommunikation mellan parterna", "Gemensamma mål och ökad samverkan", "Lägre krav på dokumentation", "Färre intressenter"], "correct": ["B"]}, {"title": "Fråga 10", "question": "Varför är tidiga beslut i projekteringen särskilt viktiga?", "type": "choice", "options": ["De påverkar endast projekteringskostnaden", "De påverkar stora delar av projektets framtida kostnader och funktion", "De påverkar bara bygglovet", "De påverkar endast tidplanen"], "correct": ["B"]}];const KEY='quiz-progress-'+"2";let idx=0,answers={};try{const saved=JSON.parse(sessionStorage.getItem(KEY)||'{}');idx=saved.idx||0;answers=saved.answers||{}}catch(e){}const root=document.getElementById('app');function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){sessionStorage.setItem(KEY,JSON.stringify({idx,answers}))}function correct(q,a){if(q.type==='match')return q.pairs.every((p,i)=>a&&a[i]===p[1]);return q.correct.length===(a||[]).length&&q.correct.every(x=>(a||[]).includes(x))}function render(){const q=Q[idx],a=answers[idx]|| (q.type==='match'?{}:[]);let inner='';if(q.type==='match'){const choices=q.pairs.map(p=>p[1]);inner='<p class="muted">Välj rätt skede eller beskrivning för varje rad.</p>'+q.pairs.map((p,i)=>'<label class="match"><strong>'+esc(p[0])+'</strong><select data-match="'+i+'"><option value="">Välj svar</option>'+choices.map(v=>'<option '+(a[i]===v?'selected':'')+' value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select></label>').join('')}else{inner='<p class="muted">'+(q.correct.length>1?'Välj alla rätta alternativ ('+q.correct.length+' st).':'Välj ett alternativ.')+'</p>'+q.options.map((o,i)=>{let id=String.fromCharCode(65+i);return '<label class="opt"><input type="'+(q.correct.length>1?'checkbox':'radio')+'" name="answer" value="'+id+'" '+(a.includes(id)?'checked':'')+'><span><b>'+id+'.</b> '+esc(o)+'</span></label>'}).join('')}root.innerHTML='<div class="muted">Fråga '+(idx+1)+' av '+Q.length+' · '+esc(q.title)+'</div><div class="progress"><div class="bar" style="width:'+((idx+1)/Q.length*100)+'%"></div></div><section class="card"><h2>'+esc(q.question)+'</h2>'+inner+'<div class="controls"><button class="secondary" id="prev" '+(idx===0?'disabled':'')+'>Föregående</button><button id="next">'+(idx===Q.length-1?'Avsluta och rätta':'Nästa fråga')+'</button></div></section>';document.querySelectorAll('input').forEach(el=>el.onchange=()=>{answers[idx]=q.correct.length>1?[...document.querySelectorAll('input:checked')].map(x=>x.value):[el.value];save()});document.querySelectorAll('select').forEach(el=>el.onchange=()=>{answers[idx]??={};answers[idx][el.dataset.match]=el.value;save()});document.getElementById('prev').onclick=()=>{idx--;save();render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{if(idx<Q.length-1){idx++;save();render();window.scrollTo(0,0)}else finish()}}function finish(){let points=Q.reduce((s,q,i)=>s+(correct(q,answers[i])?1:0),0);let review=Q.map((q,i)=>{let a=answers[i],ok=correct(q,a);let expected=q.type==='match'?q.pairs.map(p=>esc(p[0])+' → '+esc(p[1])).join('<br>'):q.correct.map(c=>esc(c+'. '+q.options[c.charCodeAt(0)-65])).join('<br>');let given=q.type==='match'?q.pairs.map((p,j)=>esc(p[0])+' → '+esc((a||{})[j]||'Ej besvarad')).join('<br>'):(a||[]).map(c=>esc(c+'. '+q.options[c.charCodeAt(0)-65])).join('<br>')||'Ej besvarad';return '<div class="review '+(ok?'good':'')+'"><b>'+(i+1)+'. '+esc(q.question)+'</b><p>'+(ok?'✓ Rätt':'✕ Fel')+'</p><small><b>Ditt svar:</b><br>'+given+'<br><b>Facit:</b><br>'+expected+'</small></div>'}).join('');root.innerHTML='<section class="card"><p class="muted">Ditt resultat</p><div class="score">'+points+' / '+Q.length+'</div><h2>'+Math.round(points/Q.length*100)+' % rätt</h2><p>Här ser du alla dina svar och facit från dokumentet.</p><button id="restart">Gör om quizet</button></section><h2>Genomgång av svaren</h2>'+review;document.getElementById('restart').onclick=()=>{idx=0;answers={};save();render();window.scrollTo(0,0)};window.scrollTo(0,0)}render();</script></body></html>
