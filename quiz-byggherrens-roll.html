<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Quiz 04 – Byggherrens roll</title><link href="/pluggportalen/favicon.ico" rel="icon"/><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#20352b;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 60px}header{padding:25px 0}h1{font-size:clamp(25px,5vw,38px);margin:5px 0}h2{font-size:23px;line-height:1.35}p{line-height:1.5}.muted{color:#607269}.card{background:white;border:1px solid #dbe5de;border-radius:18px;padding:24px;box-shadow:0 6px 22px #1b3e2710}.opt{display:flex;align-items:center;gap:12px;padding:15px;margin:10px 0;border:2px solid #dce6df;border-radius:12px;cursor:pointer;line-height:1.4}.opt:has(input:checked){border-color:#2f7755;background:#e9f5ec}input{width:20px;height:20px;accent-color:#26784c;flex-shrink:0}button,.link{background:#246a48;color:white;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e6eee8;color:#1c5136}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.progress{height:9px;border-radius:12px;background:#dce7de;overflow:hidden;margin:20px 0}.bar{height:100%;background:#348457;transition:width .2s}.match{display:block;margin:15px 0}.match select{width:100%;padding:12px;margin-top:7px;border-radius:9px;border:1px solid #a7b8ab;font-size:16px;background:white}.review{padding:16px;border-left:5px solid #bb7251;background:#faf7f1;border-radius:8px;margin:12px 0}.review.good{border-color:#348457;background:#eef8f0}.score{font-size:45px;font-weight:800}nav{display:flex;flex-wrap:wrap;gap:10px}nav a{color:#246a48}small{font-size:13px}
.opt.correct{border-color:#348457;background:#e4f5e9}.opt.incorrect{border-color:#b94848;background:#fdeaea}.opt.chosen .star{color:#a46a08;font-weight:900}.star{min-width:20px}.legend{font-size:14px;padding:12px 14px;background:#f4f6f1;border-radius:10px;margin-top:15px}.legend span{margin-right:15px}.explanation{margin-top:15px;padding:14px;border-left:4px solid #348457;background:#f2f8f1;border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.actions a{background:#e6eee8;color:#1c5136}.feedback{font-weight:800;margin-top:16px}.feedback.ok{color:#216a41}.feedback.no{color:#a13d3d}.match-result{padding:12px;border:2px solid #dce6df;border-radius:10px;margin:10px 0}.match-result.correct{border-color:#348457;background:#e4f5e9}.match-result.incorrect{border-color:#b94848;background:#fdeaea}footer{text-align:center;margin:35px 0;color:#607269;font-size:13px}.match select:disabled{color:#20352b;opacity:1}
#fullReview{scroll-margin-top:16px}#fullReview .card h2{font-size:20px}#fullReview .opt{margin:7px 0;padding:11px}#fullReview .match-result p{margin:7px 0}#fullReview .controls{flex-wrap:wrap}
</style></head><body><main class="wrap"><header><nav><a href="start-bygg-och-anlaggningsprojektering.html">← Till kursens översikt</a><a href="flashcards-byggherren.html">Flashcards →</a></nav><h1>Quiz 04 – Byggherrens roll</h1><p class="muted">15 frågor från föreläsningen · Facit direkt efter varje fråga · Repetera felaktiga svar</p></header><div id="app"></div><footer>Samhällsbyggnad · Studiematerial 2026–2028 · © 2026 Frida Mäntyranta</footer></main><script>const Q=[{"type":"mc","q":"En kommun anlitar en totalentreprenör för att bygga en skola. Vilket påstående beskriver byggherreansvaret korrekt?","opts":["Kommunen är byggherre även om totalentreprenören utför både projektering och produktion.","Kommunen är byggherre enbart om den själv anställer personal som utför byggarbetet.","Totalentreprenören ansvarar för sina avtalade prestationer, men kommunen har kvar byggherreansvaret enligt PBL.","Byggherreansvaret enligt PBL flyttas till entreprenören om entreprenadavtalet uttryckligen anger det.","Kommunen kan anlita projektledare för att fullgöra uppgifter utan att därmed upphöra att vara byggherre."],"correct":[0,2,4],"why":"PBL:s definition utgår från för vems räkning arbetet utförs. Anlitande av entreprenörer eller konsulter undanröjer inte byggherrens ansvar enligt PBL.","page":6},{"type":"mc","q":"Vilka beskrivningar av byggherrekategorierna stämmer med föreläsningen?","opts":["Ett fastighetsbolag som uppför lokaler för långsiktig uthyrning kan vara förvaltningsbyggherre.","Ett industriföretag som bygger en fabrik för sin egen produktion är normalt försäljningsbyggherre eftersom byggnaden har ett marknadsvärde.","Ett företag som bygger bostäder i syfte att avyttra dem kan vara försäljningsbyggherre även om det äger dem under byggtiden.","En kommun som bygger en skola för sin egen utbildningsverksamhet kan vara brukarbyggherre.","En region som uppför en vårdbyggnad för sin egen vårdverksamhet kan vara brukarbyggherre."],"correct":[0,2,3,4],"why":"Föreläsningens kategorier utgår från byggandets syfte: förvaltning, försäljning eller egen användning. Fastighetsbolaget kan vara förvaltningsbyggherre, bostadsutvecklaren försäljningsbyggherre och kommunen eller regionen brukarbyggherre. En industrifabrik för egen produktion är inte automatiskt ett försäljningsprojekt.","page":8},{"type":"mc","q":"Ett projekt är fortfarande i förstudien. Vilken aktivitet hör tydligast till detta tidiga skede?","opts":["Att jämföra alternativa projektupplägg och deras ekonomiska och praktiska förutsättningar innan investeringsbeslut.","Att fastställa vilka avvikelser entreprenören ska avhjälpa efter slutbesiktningen.","Att fastställa slutlig mängdreglering efter utförd entreprenad.","Att dokumentera hur den färdigställda byggnaden faktiskt utfördes i relationshandlingar.","Att överföra driftinstruktioner från entreprenör till förvaltare vid överlämning."],"correct":[0],"why":"Förstudien och affärsprospektet behandlar bland annat ekonomi, risker, marknad, projektförutsättningar och alternativa lösningar.","page":17},{"type":"mc","q":"Vilka frågor är relevanta när byggherren bedömer bygg- och markförutsättningar?","opts":["Att bedöma om markens bärförmåga och stabilitet begränsar möjliga grundläggningslösningar.","Att klarlägga om befintliga ledningar och anslutningsmöjligheter påverkar genomförandet.","Att utreda planmässiga förutsättningar och om tänkt användning ryms inom gällande planering.","Att analysera trafikanslutning och tillgänglighet utifrån den planerade användningen.","Att fastställa den slutliga ersättningen för samtliga ÄTA-arbeten innan projekteringen påbörjats."],"correct":[0,1,2,3],"why":"Tidiga mark- och byggförutsättningar omfattar tekniska, planmässiga och tillgänglighetsrelaterade frågor.","page":18},{"type":"mc","q":"Vad påverkas när byggherren väljer entreprenadform?","opts":["Hur ansvar för projektering och utförande kan fördelas mellan byggherre och entreprenör.","Vilken omfattning av egen beställar- och samordningskompetens byggherren kan behöva.","Hur projektrelaterade risker kan fördelas avtalsmässigt mellan parterna.","Vilken myndighet som enligt PBL är byggnadsnämnd för fastigheten.","Om byggherrens offentligrättsliga skyldigheter enligt PBL upphör att gälla."],"correct":[0,1,2],"why":"Föreläsningen betonar att entreprenadformen påverkar ansvar, risk och behov av interna resurser.","page":21},{"type":"mc","q":"Vilka överväganden hör till en upphandlingsstrategi enligt föreläsningen?","opts":["Att bedöma om ett ramavtal är en lämplig väg jämfört med en separat konkurrensutsättning.","Att bestämma hur pris och kvalitet ska vägas i anbudsutvärderingen.","Att undersöka om dialog eller förhandling är möjlig och ändamålsenlig inom tillämpliga regler.","Att välja upphandlingsförfarande utan att beakta om förfarandet är tillåtet enligt tillämpliga upphandlingsregler.","Att välja att helt avstå från jämförbara utvärderingsgrunder för att behålla maximal frihet vid tilldelning."],"correct":[0,1,2],"why":"Strategin omfattar konkurrensform, eventuella ramavtal, dialog/förhandling och avvägningen mellan pris och kvalitet.","page":21},{"type":"mc","q":"Vilket påstående om byggprocessens skeden är mest korrekt?","opts":["Upphandling kan ske i olika skeden beroende på bland annat entreprenad- och upphandlingsupplägg.","All upphandling måste ske först när fullständiga bygghandlingar har färdigställts, oavsett entreprenadform.","Byggherrens kravställning börjar först när produktionsarbetet inleds.","Projektering och upphandling kan aldrig överlappa varandra i ett byggprojekt.","Överlämningen innebär att byggherrens behov av uppföljning alltid upphör, även vid fortsatt förvaltning."],"correct":[0],"why":"Översikten visar att upphandling kan ske i flera skeden och att byggherren följer projektet genom hela processen.","page":13},{"type":"mc","q":"Vilka kravområden kan enligt föreläsningen behöva behandlas i ett upphandlingsunderlag?","opts":["Att precisera tekniska krav med lämpliga beskrivningar och handlingar.","Att ange relevanta krav på arbetsmiljö och hur de ska hanteras.","Att formulera krav på miljö- och klimatprestanda där dessa är relevanta för projektet.","Att ställa ändamålsenliga krav på leverantörens kompetens och referenser.","Att föreskriva att alla risker utan undantag ska bäras av entreprenören, oberoende av vad parterna faktiskt kan påverka."],"correct":[0,1,2,3],"why":"Underlaget kan innehålla bland annat teknik, ekonomi, kvalitet, arbetsmiljö, miljö, kompetens och riskfördelning.","page":21},{"type":"mc","q":"Varför har beslut i projektets tidiga skeden stor betydelse?","opts":["Tidiga beslut kan låsa viktiga förutsättningar, samtidigt som möjligheten att påverka vanligen minskar längre fram i processen.","Tidiga beslut är främst viktiga därför att de alltid kan ändras kostnadsfritt fram till slutbesiktningen.","Tidiga beslut får liten betydelse om entreprenören senare tar ett helhetsansvar för utförandet.","Kostnaden för ändringar tenderar att minska när fler tekniska lösningar har byggts in och beroenden har uppstått.","Möjligheten att påverka projektets grundläggande utformning är normalt störst efter att byggnaden tagits i bruk."],"correct":[0],"why":"Föreläsningens diagram visar högre påverkansmöjlighet i tidiga skeden och ökande kostnader för förändringar senare.","page":32},{"type":"mc","q":"Vilka perspektiv behöver byggherren väga samman för att skapa långsiktigt värde?","opts":["Att bedöma kostnader över byggnadens användningstid och inte bara investeringsutgiften.","Att beakta hur byggnaden fungerar för brukare och vilka sociala värden den skapar.","Att väga in klimat- och miljöpåverkan i projektets lösningar.","Att beakta drift, underhåll och förvaltning i den långsiktiga nyttan.","Att alltid välja lägsta anbudspris även när skillnader i kvalitet och framtida driftkostnader är kända."],"correct":[0,1,2,3],"why":"Byggherrerollen handlar om att förena ekonomi, sociala behov, miljö, funktion och långsiktigt värde.","page":47},{"type":"mc","q":"Vad är den mest träffsäkra skillnaden mellan byggkostnadsindex (BKI) och konsumentprisindex (KPI)?","opts":["BKI följer kostnadsutvecklingen för produktionsfaktorer i bostadsbyggande, medan KPI följer prisutvecklingen för privat inhemsk konsumtion.","BKI visar vad nyproducerade bostäder säljs för, medan KPI visar entreprenörernas inköpspriser.","BKI avser endast arbetslöner i byggsektorn, medan KPI avser alla kostnader i ett byggprojekt.","BKI mäter förändringar i hyresnivåer, medan KPI mäter förändringar i bostadsrättspriser.","BKI och KPI avser samma varukorg, men använder olika basår och publiceringsintervall."],"correct":[0],"why":"BKI beskriver kostnadsförändringar för exempelvis material, utrustning, löner och transporter i bostadsbyggande. KPI avser konsumentpriser.","page":28},{"type":"mc","q":"Vilka utmaningar för samhällsbyggnadssektorn lyfts uttryckligen i föreläsningen?","opts":["Att minska fel, skador och brister som påverkar kvalitet och produktivitet.","Att hantera arbetsmiljörisker i en olycksdrabbad sektor.","Att utveckla kompetens och nyttja digitalisering och AI för bättre arbetssätt.","Att minska klimatpåverkan och energianvändning utan att förlora funktion och kvalitet.","Att avskaffa alla plan- och tillståndsprocesser för att helt eliminera ledtider."],"correct":[0,1,2,3],"why":"Föreläsningen pekar bland annat på kvalitet, arbetsmiljö, digitalisering, kompetens, klimat och sunda affärer.","page":26},{"type":"match","q":"Para ihop aktörerna med deras huvudsakliga funktion i projektöversikten.","pairs":[["Byggherre","Anger mål och krav, organiserar projektet och följer upp resultatet"],["Projektledare","Styr tid, ekonomi, kvalitet och samordning"],["Arkitekt och tekniska projektörer","Utformar, beräknar och tar fram handlingar"],["Entreprenör och installatör","Genomför och egenkontrollerar arbeten"]],"why":"Rollerna samverkar men har skilda huvudsakliga uppgifter.","page":13},{"type":"mc","q":"Para ihop handlingen eller undersökningen med vad den främst belyser.","opts":["En geoteknisk undersökning belyser markens bärförmåga och stabilitet inför val av grundläggning.","En bullerutredning används i första hand för att beräkna dagvattnets avrinningsflöden.","En dagvattenutredning kan belysa behov av fördröjning och hantering av avrinning.","En sol- och skuggstudie används främst för att bedöma markens geotekniska hållfasthet.","En bullerutredning kan belysa hur trafikbuller påverkar planerad bebyggelse."],"correct":[0,2,4],"why":"Underlagen belyser olika frågor: geoteknik gäller markförhållanden, dagvatten gäller avrinning och bullerutredningar gäller ljudpåverkan. Sol- och skuggstudier avser ljusförhållanden.","page":19},{"type":"match","q":"Para ihop regel- eller avtalsbegreppet med rätt beskrivning.","pairs":[["Lag","Beslutas av riksdagen och är bindande"],["Förordning","Beslutas av regeringen och är bindande"],["Föreskrift","Beslutas av myndighet med bemyndigande och är bindande"],["Allmänna råd","Myndighetsråd som inte i sig är bindande"]],"why":"Föreläsningens regelöversikt skiljer bindande regler från rådgivande allmänna råd.","page":37}];
// Kontrollerar att facit och det angivna antalet rätta alternativ alltid överensstämmer.
Q.forEach((q,i)=>{if(q.type==='mc'){if(q.opts.length!==5||!Array.isArray(q.correct)||q.correct.length<1||q.correct.length>4||new Set(q.correct).size!==q.correct.length||q.correct.some(n=>!Number.isInteger(n)||n<0||n>=q.opts.length))throw Error('Ogiltigt facit för fråga '+(i+1));}else if(q.type==='match'){if(!q.pairs?.length||new Set(q.pairs.map(p=>p[1])).size!==q.pairs.length)throw Error('Ogiltig matchningsfråga '+(i+1));}});

let order=Q.map((_,i)=>i),pos=0,answers={},checked={},isRetry=false,view='quiz';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let permutations=Q.map(q=>q.type==='mc'?shuffle(q.opts.map((_,i)=>i)):shuffle(q.pairs.map(p=>p[1])));
function right(q,a){if(q.type==='mc')return Array.isArray(a)&&a.length===q.correct.length&&q.correct.every(v=>a.includes(v));return !!a&&q.pairs.every((p,i)=>a[i]===p[1])}
function render(){view='quiz';const id=order[pos],q=Q[id],a=answers[id]??(q.type==='mc'?[]:{}),done=!!checked[id],ok=right(q,a);let content='';
if(q.type==='mc'){
 content='<p class="muted">Välj '+q.correct.length+' rätt '+(q.correct.length===1?'svar':'svar')+'.</p>'+permutations[id].map((orig,k)=>{const chosen=a.includes(orig),correct=q.correct.includes(orig);const cls=done?(correct?' correct':chosen?' incorrect':''):'',mark=done&&chosen?'★':'';return `<label class="opt${cls}${chosen?' chosen':''}"><input type="${q.correct.length===1?'radio':'checkbox'}" name="answer" data-choice="${orig}" ${chosen?'checked':''} ${done?'disabled':''}><span class="star">${mark}</span><span><b>${String.fromCharCode(65+k)}.</b> ${esc(q.opts[orig])}</span></label>`}).join('')
}else{
 content='<p class="muted">Para ihop varje uttryck med rätt beskrivning.</p>'+q.pairs.map((p,i)=>{const val=a[i]||'',correct=val===p[1],cls=done?(correct?'correct':'incorrect'):'';return `<div class="match-result ${cls}"><label class="match"><strong>${done&&val?'★ ':''}${esc(p[0])}</strong><select data-pair="${i}" ${done?'disabled':''}><option value="">Välj beskrivning</option>${permutations[id].map(v=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(v)}</option>`).join('')}</select></label>${done?`<small><b>Rätt svar:</b> ${esc(p[1])}</small>`:''}</div>`}).join('')
}
const review=done?`<p class="feedback ${ok?'ok':'no'}">${ok?'✓ Helt rätt!':'✕ Inte helt rätt.'}</p><div class="legend"><span><b style="color:#348457">Grönt</b> = rätt svar</span><span><b style="color:#b94848">Rött</b> = felaktigt val</span><span><b>★</b> = ditt val</span></div><div class="explanation"><b>Förklaring</b><p>${esc(q.why||'Se de rätta paren ovan.')}</p>${q.page?`<small>Föreläsningen: bild/sida ${q.page}</small>`:''}</div>`:'';
app.innerHTML=`<div class="muted">${isRetry?'Repetition · ':''}Fråga ${pos+1} av ${order.length}</div><div class="progress"><div class="bar" style="width:${(pos+1)/order.length*100}%"></div></div><section class="card"><h2>${esc(q.q)}</h2>${content}${review}<div class="controls"><button class="secondary" id="prev" ${pos===0?'disabled':''}>Föregående</button>${done?`<button id="next">${pos===order.length-1?'Visa resultat':'Nästa fråga →'}</button>`:`<button id="check">Rätta frågan</button>`}</div></section>`;
app.querySelectorAll('[data-choice]').forEach(el=>el.onchange=()=>{let n=+el.dataset.choice;let a=answers[id]||[];answers[id]=q.correct.length===1?[n]:el.checked?[...a,n]:a.filter(x=>x!==n);render()});
app.querySelectorAll('[data-pair]').forEach(el=>el.onchange=()=>{answers[id]??={};answers[id][+el.dataset.pair]=el.value;render()});
app.querySelector('#prev').onclick=()=>{pos--;render();window.scrollTo(0,0)};
if(done)app.querySelector('#next').onclick=()=>{if(pos===order.length-1)finish();else{pos++;render();window.scrollTo(0,0)}};
else app.querySelector('#check').onclick=()=>{if(q.type==='mc'&&(!answers[id]||answers[id].length!==q.correct.length)){alert('Välj exakt '+q.correct.length+' alternativ innan du rättar.');return}if(q.type==='match'&&q.pairs.some((_,i)=>!answers[id]?.[i])){alert('Para ihop alla uttryck innan du rättar.');return}checked[id]=true;render()};
}
function finish(){view='results';const wrong=order.filter(i=>!right(Q[i],answers[i])),good=order.length-wrong.length;
app.innerHTML=`<section class="card"><p class="muted">${isRetry?'Resultat av repetitionen':'Ditt resultat'}</p><div class="score">${good} / ${order.length}</div><h2>${Math.round(100*good/order.length)} % rätt</h2><p>${wrong.length?'Du kan träna på de frågor du svarade fel på.':'Alla frågor rätt!'}</p><div class="actions"><button id="review">Se alla frågor och mina svar ↓</button>${wrong.length?`<button id="retry">Träna på felaktiga frågor (${wrong.length})</button>`:''}<button class="secondary" id="restart">Gör om alla 15 frågor</button><a class="link" href="flashcards-byggherren.html">Träna med flashcards →</a><a class="link" href="start-bygg-och-anlaggningsprojektering.html">Kursöversikt</a></div></section><div id="fullReview"></div>`;
app.querySelector('#review').onclick=()=>{showReview();document.getElementById('fullReview').scrollIntoView({behavior:'smooth',block:'start'})};
app.querySelector('#restart').onclick=()=>{order=Q.map((_,i)=>i);pos=0;answers={};checked={};isRetry=false;permutations=Q.map(q=>q.type==='mc'?shuffle(q.opts.map((_,i)=>i)):shuffle(q.pairs.map(p=>p[1])));render()};
if(wrong.length)app.querySelector('#retry').onclick=()=>{order=wrong;pos=0;isRetry=true;for(const i of wrong){delete answers[i];delete checked[i]}render()};window.scrollTo(0,0)}
function showReview(){const target=app.querySelector('#fullReview');target.innerHTML='<h2>Alla frågor och dina svar</h2><p class="muted">★ markerar ditt svar. Grönt visar rätt svar och rött visar ett felaktigt valt svar. Du kan läsa igenom alla frågor utan att dina svar ändras.</p>'+order.map((id,n)=>{const q=Q[id],a=answers[id]??(q.type==='mc'?[]:{}),ok=right(q,a);let body='';if(q.type==='mc'){body=permutations[id].map((orig,k)=>{const chosen=a.includes(orig),correct=q.correct.includes(orig);return `<div class="opt ${correct?'correct':chosen?'incorrect':''}" style="cursor:default"><span class="star">${chosen?'★':''}</span><span><b>${String.fromCharCode(65+k)}.</b> ${esc(q.opts[orig])}</span></div>`}).join('')}else{body=q.pairs.map((p,i)=>{const val=a[i]||'Ej besvarad';return `<div class="match-result ${val===p[1]?'correct':'incorrect'}"><strong>${esc(p[0])}</strong><p>★ Ditt svar: ${esc(val)}</p><small><b>Rätt svar:</b> ${esc(p[1])}</small></div>`}).join('')};return `<section class="card" id="review-${n}" style="margin-top:16px"><p class="muted">Fråga ${n+1} av ${order.length} · ${ok?'✓ Rätt':'✕ Fel'}</p><h2>${esc(q.q)}</h2>${body}<div class="explanation"><b>Förklaring</b><p>${esc(q.why)}</p><small>Föreläsningen: bild/sida ${q.page}</small></div><div class="controls"><button class="secondary" data-goto="${n}">Visa frågan i quizet</button><button class="secondary" data-top="1">Till resultatet ↑</button></div></section>`}).join('');target.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{pos=+b.dataset.goto;render();window.scrollTo(0,0)});target.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>window.scrollTo({top:0,behavior:'smooth'}))}
render();</script></body></html>
