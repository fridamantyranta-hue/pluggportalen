<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Föreläsning – Byggherrens roll | Quiz</title><style>:root{font-family:system-ui,Segoe UI,sans-serif;color:#18312d;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:30px auto;padding:20px}.hero{background:linear-gradient(120deg,#123f39,#267765);color:white;border-radius:22px;padding:30px}.hero p{opacity:.88}.panel{background:white;border:1px solid #dbe6e1;border-radius:20px;padding:26px;margin-top:18px;box-shadow:0 10px 30px #173e3210}h1{font-size:clamp(25px,4vw,39px);margin:0 0 10px}h2{font-size:23px}button,.btn{cursor:pointer;background:#176a57;color:white;border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:15px}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#e7f1ec;color:#174e40}.opt{display:flex;gap:12px;align-items:center;border:2px solid #e0e8e3;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;line-height:1.45}.opt input{width:19px;height:19px;accent-color:#19705b}.opt.good{background:#e3f5e9;border-color:#22834d}.opt.bad{background:#fde9e9;border-color:#c54444}.star{color:#aa6300;font-size:22px;font-weight:900}.muted{color:#63756e}.tag{display:inline-block;border-radius:99px;background:#e7f1ec;color:#145947;padding:7px 11px;font-weight:700;font-size:13px}.bar{height:8px;background:#dce9e2;border-radius:20px;overflow:hidden;margin:20px 0}.bar>div{height:100%;background:#3eac82}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.explain{background:#f2f7f3;border-left:4px solid #398b70;padding:16px;border-radius:8px;margin-top:18px}.legend{font-size:14px;margin-top:14px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin:12px 0}.pair select{padding:12px;width:100%;border:2px solid #dce6e0;border-radius:10px;background:white;font-size:14px}.pair.good select{border-color:#22834d;background:#e3f5e9}.pair.bad select{border-color:#c54444;background:#fde9e9}a{color:#145947}@media(max-width:600px){main{padding:10px;margin:10px auto}.panel,.hero{padding:19px}.pair{grid-template-columns:1fr;gap:4px}}</style></head><body><main><header class="hero"><div style="font-size:13px;letter-spacing:.1em">BYGG- OCH ANLÄGGNINGSPROJEKTERING · P0009B</div><h1>Föreläsning – Byggherrens roll</h1><p>15 frågor om byggherrens ansvar, processer och värdeskapande. Du får facit direkt efter varje besvarad fråga.</p></header><div id="study" class="panel"><div id="position" class="muted"></div><div class="bar"><div id="progress"></div></div><div id="question"></div><div class="actions"><button id="check">Rätta frågan</button><button id="next" hidden>Nästa fråga →</button></div></div><div id="result" class="panel" hidden></div><p class="muted">Material: Föreläsningen ”Byggherren skapar värden”, LTU 18 november 2026. <a href="flashcards-byggherren.html">Öppna flashcards</a></p></main><script>const Q=[{"type": "mc", "q": "En kommun anlitar en totalentreprenör för att bygga en skola. Vilket påstående beskriver byggherreansvaret korrekt?", "opts": ["Kommunen är byggherre eftersom arbetet utförs för dess räkning.", "Totalentreprenören övertar automatiskt allt ansvar enligt PBL.", "Kommunen ska se till att åtgärderna uppfyller tillämpliga krav enligt PBL.", "Byggherrerollen kan bara innehas av en fysisk person.", "Anlitade konsulter befriar inte kommunen från byggherreansvaret."], "correct": [0, 2, 4], "why": "PBL:s definition utgår från för vems räkning arbetet utförs. Anlitande av entreprenörer eller konsulter undanröjer inte byggherrens ansvar enligt PBL.", "page": 6}, {"type": "mc", "q": "Vilka beskrivningar av byggherrekategorierna stämmer med föreläsningen?", "opts": ["En förvaltningsbyggherre bygger främst för omedelbar försäljning.", "En försäljningsbyggherre bygger för att sälja.", "En brukarbyggherre bygger för eget bruk men har annan kärnverksamhet än fastigheter eller anläggningar.", "En förvaltningsbyggherre bygger för långsiktigt ägande där fastigheten ingår i kärnverksamheten.", "En brukarbyggherre måste vara en privatperson."], "correct": [1, 2, 3], "why": "De tre kategorierna skiljs åt genom syftet med byggandet: långsiktig förvaltning, försäljning respektive eget bruk i annan kärnverksamhet.", "page": 8}, {"type": "mc", "q": "Ett projekt är fortfarande i förstudien. Vilken aktivitet hör tydligast till detta tidiga skede?", "opts": ["Att fastställa slutbesiktningsutlåtandet.", "Att bedöma projektets ekonomiska bärkraft, risker och alternativ.", "Att upprätta relationshandlingar efter färdig produktion.", "Att genomföra garantibesiktning.", "Att avsluta driftorganisationens underhållsplan."], "correct": [1], "why": "Förstudien och affärsprospektet behandlar bland annat ekonomi, risker, marknad, projektförutsättningar och alternativa lösningar.", "page": 17}, {"type": "mc", "q": "Vilka frågor är relevanta när byggherren bedömer bygg- och markförutsättningar?", "opts": ["Geoteknik och markens stabilitet.", "Befintliga ledningar och teknisk infrastruktur.", "Enbart byggnadens framtida marknadsföringskampanj.", "Detaljplan och andra planmässiga förutsättningar.", "Tillgänglighet och trafikförutsättningar.", "Vilken entreprenör som erbjuder snyggast logotyp."], "correct": [0, 1, 3, 4], "why": "Tidiga mark- och byggförutsättningar omfattar tekniska, planmässiga och tillgänglighetsrelaterade frågor.", "page": 18}, {"type": "mc", "q": "Vad påverkas när byggherren väljer entreprenadform?", "opts": ["Ansvarsfördelningen mellan parterna.", "Behovet av interna resurser hos byggherren.", "Vilken kommun som har tillsyn enligt PBL.", "Hur projektrisker fördelas och hanteras.", "Om projektet över huvud taget omfattas av bygglagstiftning."], "correct": [0, 1, 3], "why": "Föreläsningen betonar att entreprenadformen påverkar ansvar, risk och behov av interna resurser.", "page": 21}, {"type": "mc", "q": "Vilka överväganden hör till en upphandlingsstrategi enligt föreläsningen?", "opts": ["Om traditionell konkurrensutsättning eller ramavtal ska användas.", "Om pris och kvalitet ska viktas i utvärderingen.", "Om dialog eller förhandling kan ge bättre villkor.", "Om entreprenören ska slippa alla kvalitetskrav.", "Om byggherren ska avstå från att formulera projektets behov."], "correct": [0, 1, 2], "why": "Strategin omfattar konkurrensform, eventuella ramavtal, dialog/förhandling och avvägningen mellan pris och kvalitet.", "page": 21}, {"type": "mc", "q": "Vilket påstående om byggprocessens skeden är mest korrekt?", "opts": ["Upphandling kan förekomma i flera skeden, inte enbart efter all projektering.", "Överlämning och förvaltning sker alltid före produktionen.", "Byggherren anger mål och krav endast under produktionen.", "Projekteringen börjar först efter att byggnaden tagits i bruk.", "Förstudien genomförs normalt efter slutbesiktningen."], "correct": [0], "why": "Översikten visar att upphandling kan ske i flera skeden och att byggherren följer projektet genom hela processen.", "page": 13}, {"type": "mc", "q": "Vilka kravområden kan enligt föreläsningen behöva behandlas i ett upphandlingsunderlag?", "opts": ["Arbetsmiljökrav.", "Miljö- och klimatkrav.", "Krav på kompetens och referenser.", "Tekniska beskrivningar och ritningar.", "Ett löfte att aldrig följa upp entreprenörens arbete.", "Att byggherren helt avstår från riskfördelning."], "correct": [0, 1, 2, 3], "why": "Underlaget kan innehålla bland annat teknik, ekonomi, kvalitet, arbetsmiljö, miljö, kompetens och riskfördelning.", "page": 21}, {"type": "mc", "q": "Varför har beslut i projektets tidiga skeden stor betydelse?", "opts": ["De avgör alltid exakt hur många fel som uppstår vid slutbesiktningen.", "Möjligheten att påverka är generellt större tidigt medan kostnaden för sena ändringar tenderar att öka.", "De gör uppföljning under produktionen onödig.", "De eliminerar alla osäkerheter i byggprojektet.", "De ersätter behovet av kravställning."], "correct": [1], "why": "Föreläsningens diagram visar högre påverkansmöjlighet i tidiga skeden och ökande kostnader för förändringar senare.", "page": 32}, {"type": "mc", "q": "Vilka perspektiv behöver byggherren väga samman för att skapa långsiktigt värde?", "opts": ["Ekonomiska värden och livscykelkostnader.", "Sociala värden och brukarnas behov.", "Miljö- och klimatpåverkan.", "Enbart lägsta möjliga initiala anbudspris.", "Fastighetens funktion och förvaltning över tid."], "correct": [0, 1, 2, 4], "why": "Byggherrerollen handlar om att förena ekonomi, sociala behov, miljö, funktion och långsiktigt värde.", "page": 47}, {"type": "mc", "q": "Vad är den mest träffsäkra skillnaden mellan byggkostnadsindex (BKI) och konsumentprisindex (KPI)?", "opts": ["BKI följer produktionsfaktorernas kostnader i bostadsbyggande; KPI följer priser för privat konsumtion.", "BKI mäter enbart tomtpriser; KPI mäter enbart räntor.", "BKI och KPI är två namn för exakt samma mått.", "KPI visar bara priset på byggmaterial; BKI visar hushållens konsumtion.", "BKI mäter färdiga bostäders marknadsvärde medan KPI mäter löneutvecklingen."], "correct": [0], "why": "BKI beskriver kostnadsförändringar för exempelvis material, utrustning, löner och transporter i bostadsbyggande. KPI avser konsumentpriser.", "page": 28}, {"type": "mc", "q": "Vilka utmaningar för samhällsbyggnadssektorn lyfts uttryckligen i föreläsningen?", "opts": ["Kvalitetsbrister och produktivitetsproblem.", "Arbetsmiljö och olycksrisker.", "Behov av digitalisering och kompetensutveckling.", "Klimat- och energifrågor.", "Att byggprojekt helt saknar behov av tillstånd.", "Att det inte finns någon risk för oseriösa aktörer."], "correct": [0, 1, 2, 3], "why": "Föreläsningen pekar bland annat på kvalitet, arbetsmiljö, digitalisering, kompetens, klimat och sunda affärer.", "page": 26}, {"type": "match", "q": "Para ihop aktörerna med deras huvudsakliga funktion i projektöversikten.", "pairs": [["Byggherre", "Anger mål och krav, organiserar projektet och följer upp resultatet"], ["Projektledare", "Styr tid, ekonomi, kvalitet och samordning"], ["Arkitekt och tekniska projektörer", "Utformar, beräknar och tar fram handlingar"], ["Entreprenör och installatör", "Genomför och egenkontrollerar arbeten"]], "why": "Rollerna samverkar men har skilda huvudsakliga uppgifter.", "page": 13}, {"type": "match", "q": "Para ihop handlingen eller undersökningen med vad den främst belyser.", "pairs": [["Geoteknisk undersökning", "Markens lämplighet, stabilitet och bärförmåga"], ["Bullerutredning", "Trafik- och andra bullerkällors påverkan"], ["Dagvattenutredning", "Avrinning och fördröjning av dagvatten"], ["Sol- och skuggstudie", "Ljusförhållanden för byggnader och omgivning"]], "why": "Dessa underlag används för att bedöma genomförbarhet och konsekvenser i tidiga skeden.", "page": 19}, {"type": "match", "q": "Para ihop regel- eller avtalsbegreppet med rätt beskrivning.", "pairs": [["Lag", "Beslutas av riksdagen och är bindande"], ["Förordning", "Beslutas av regeringen och är bindande"], ["Föreskrift", "Beslutas av myndighet med bemyndigande och är bindande"], ["Allmänna råd", "Myndighetsråd som inte i sig är bindande"]], "why": "Föreläsningens regelöversikt skiljer bindande regler från rådgivande allmänna råd.", "page": 37}];let order=Q.map((_,i)=>i),idx=0,answers={},checked={},retry=false;const $=s=>document.querySelector(s);function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}const optionOrders=Q.map(q=>q.type==='mc'?shuffle(q.opts.map((_,i)=>i)):shuffle(q.pairs.map((_,i)=>i)));function right(q,a){if(q.type==='mc')return !!a&&a.length===q.correct.length&&q.correct.every(i=>a.includes(i));return !!a&&q.pairs.every((_,i)=>Number(a[i])===i)}function render(){let q=Q[order[idx]],id=order[idx],a=answers[id]|| (q.type==='mc'?[]:{}),done=checked[id];$('#progress').style.width=((idx+1)/order.length*100)+'%';$('#position').textContent=`Fråga ${idx+1} av ${order.length}${retry?' · Repetition':''}`;let h=`<span class="tag">${q.type==='mc'?'Välj '+q.correct.length+' rätta svar':'Para ihop 4 begrepp'}</span><h2>${escapeHTML(q.q)}</h2>`;if(q.type==='mc'){for(let i of optionOrders[id]){let chosen=a.includes(i),cl=done?(q.correct.includes(i)?'good':chosen?'bad':''):'';h+=`<label class="opt ${cl}"><input type="checkbox" data-i="${i}" ${chosen?'checked':''} ${done?'disabled':''}><span>${escapeHTML(q.opts[i])}</span>${done&&chosen?'<span class="star" title="Ditt val">★</span>':''}</label>`}}else{let rightOrder=optionOrders[id];for(let i=0;i<q.pairs.length;i++){let chosen=a[i],ok=done&&Number(chosen)===i;h+=`<div class="pair ${done?(ok?'good':'bad'):''}"><strong>${escapeHTML(q.pairs[i][0])}</strong><select data-p="${i}" ${done?'disabled':''}><option value="">Välj beskrivning</option>${rightOrder.map(j=>`<option value="${j}" ${String(chosen)===String(j)?'selected':''}>${escapeHTML(q.pairs[j][1])}</option>`).join('')}</select>${done?`<small>${ok?'✓ Rätt':'✕ Rätt: '+escapeHTML(q.pairs[i][1])}${chosen!==undefined&&chosen!==''?' ★ Ditt val':''}</small>`:''}</div>`}}if(done){h+=`<div class="legend"><strong>Teckenförklaring:</strong> <span style="color:#22834d">■ Grönt = rätt svar</span> · <span style="color:#c54444">■ Rött = fel svar</span> · <span class="star">★</span> = ditt val</div><div class="explain"><strong>${right(q,a)?'✓ Rätt besvarat!':'✕ Inte helt rätt'}</strong><p>${escapeHTML(q.why)}</p><small>Källa: föreläsningen ”Byggherren skapar värden”, bild ${q.page}.</small></div>`}$('#question').innerHTML=h;$('#check').hidden=!!done;$('#next').hidden=!done;$('#next').textContent=idx===order.length-1?'Visa resultat':'Nästa fråga →';$('#check').disabled=q.type==='mc'?a.length===0:q.pairs.some((_,i)=>a[i]===undefined||a[i]==='');document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('change',()=>{let i=+el.dataset.i,arr=answers[id]||[];answers[id]=el.checked?[...arr,i]:arr.filter(x=>x!==i);render()}));document.querySelectorAll('[data-p]').forEach(el=>el.addEventListener('change',()=>{answers[id]??={};answers[id][el.dataset.p]=el.value;render()}))}$('#check').onclick=()=>{checked[order[idx]]=true;render()};$('#next').onclick=()=>{if(idx<order.length-1){idx++;render()}else finish()};function finish(){let wrong=order.filter(i=>!right(Q[i],answers[i])),good=order.length-wrong.length;$('#study').hidden=true;$('#result').hidden=false;$('#result').innerHTML=`<h2>Resultat: ${good} av ${order.length} rätt</h2><p>Du fick ${Math.round(good/order.length*100)} %. ${wrong.length?'Du kan nu träna om de frågor du inte klarade.':'Alla frågor rätt – bra jobbat!'}</p><div class="actions">${wrong.length?'<button id="retry">Träna på felaktiga frågor ('+wrong.length+')</button>':''}<button class="ghost" id="restart">Gör om alla 15 frågor</button><a class="btn" href="flashcards-byggherren.html">Träna med flashcards →</a></div>`;$('#restart').onclick=()=>location.reload();if(wrong.length)$('#retry').onclick=()=>{order=wrong;idx=0;retry=true;for(let i of wrong){delete checked[i];delete answers[i]}$('#result').hidden=true;$('#study').hidden=false;render()}}render();</script></body></html>
