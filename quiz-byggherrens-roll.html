<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz 04 – Byggherrens roll</title><link rel="icon" href="/pluggportalen/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#20352b;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 60px}header{padding:25px 0}h1{font-size:clamp(25px,5vw,38px);margin:5px 0}h2{font-size:23px;line-height:1.35}p{line-height:1.5}.muted{color:#607269}.card{background:white;border:1px solid #dbe5de;border-radius:18px;padding:24px;box-shadow:0 6px 22px #1b3e2710}.opt{display:flex;align-items:center;gap:12px;padding:15px;margin:10px 0;border:2px solid #dce6df;border-radius:12px;cursor:pointer;line-height:1.4}.opt:has(input:checked){border-color:#2f7755;background:#e9f5ec}input{width:20px;height:20px;accent-color:#26784c;flex-shrink:0}button,.link{background:#246a48;color:white;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e6eee8;color:#1c5136}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.progress{height:9px;border-radius:12px;background:#dce7de;overflow:hidden;margin:20px 0}.bar{height:100%;background:#348457;transition:width .2s}.match{display:block;margin:15px 0}.match select{width:100%;padding:12px;margin-top:7px;border-radius:9px;border:1px solid #a7b8ab;font-size:16px;background:white}.review{padding:16px;border-left:5px solid #bb7251;background:#faf7f1;border-radius:8px;margin:12px 0}.review.good{border-color:#348457;background:#eef8f0}.score{font-size:45px;font-weight:800}nav{display:flex;flex-wrap:wrap;gap:10px}nav a{color:#246a48}small{font-size:13px}
.opt.correct{border-color:#348457;background:#e4f5e9}.opt.incorrect{border-color:#b94848;background:#fdeaea}.opt.chosen .star{color:#a46a08;font-weight:900}.star{min-width:20px}.legend{font-size:14px;padding:12px 14px;background:#f4f6f1;border-radius:10px;margin-top:15px}.legend span{margin-right:15px}.explanation{margin-top:15px;padding:14px;border-left:4px solid #348457;background:#f2f8f1;border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.actions a{background:#e6eee8;color:#1c5136}.feedback{font-weight:800;margin-top:16px}.feedback.ok{color:#216a41}.feedback.no{color:#a13d3d}.match-result{padding:12px;border:2px solid #dce6df;border-radius:10px;margin:10px 0}.match-result.correct{border-color:#348457;background:#e4f5e9}.match-result.incorrect{border-color:#b94848;background:#fdeaea}footer{text-align:center;margin:35px 0;color:#607269;font-size:13px}.match select:disabled{color:#20352b;opacity:1}</style></head><body><main class="wrap"><header><nav><a href="start-bygg-och-anlaggningsprojektering.html">← Till kursens översikt</a><a href="flashcards-byggherren.html">Flashcards →</a></nav><h1>Quiz 04 – Byggherrens roll</h1><p class="muted">15 frågor från föreläsningen · Facit direkt efter varje fråga · Repetera felaktiga svar</p></header><div id="app"></div><footer>Samhällsbyggnad · Studiematerial 2026–2028 · © 2026 Frida Mäntyranta</footer></main><script>const Q=[{"type": "mc", "q": "En kommun anlitar en totalentreprenör för att bygga en skola. Vilket påstående beskriver byggherreansvaret korrekt?", "opts": ["Kommunen är byggherre eftersom arbetet utförs för dess räkning.", "Totalentreprenören övertar automatiskt allt ansvar enligt PBL.", "Kommunen ska se till att åtgärderna uppfyller tillämpliga krav enligt PBL.", "Byggherrerollen kan bara innehas av en fysisk person.", "Anlitade konsulter befriar inte kommunen från byggherreansvaret."], "correct": [0, 2, 4], "why": "PBL:s definition utgår från för vems räkning arbetet utförs. Anlitande av entreprenörer eller konsulter undanröjer inte byggherrens ansvar enligt PBL.", "page": 6}, {"type": "mc", "q": "Vilka beskrivningar av byggherrekategorierna stämmer med föreläsningen?", "opts": ["En förvaltningsbyggherre bygger främst för omedelbar försäljning.", "En försäljningsbyggherre bygger för att sälja.", "En brukarbyggherre bygger för eget bruk men har annan kärnverksamhet än fastigheter eller anläggningar.", "En förvaltningsbyggherre bygger för långsiktigt ägande där fastigheten ingår i kärnverksamheten.", "En brukarbyggherre måste vara en privatperson."], "correct": [1, 2, 3], "why": "De tre kategorierna skiljs åt genom syftet med byggandet: långsiktig förvaltning, försäljning respektive eget bruk i annan kärnverksamhet.", "page": 8}, {"type": "mc", "q": "Ett projekt är fortfarande i förstudien. Vilken aktivitet hör tydligast till detta tidiga skede?", "opts": ["Att fastställa slutbesiktningsutlåtandet.", "Att bedöma projektets ekonomiska bärkraft, risker och alternativ.", "Att upprätta relationshandlingar efter färdig produktion.", "Att genomföra garantibesiktning.", "Att avsluta driftorganisationens underhållsplan."], "correct": [1], "why": "Förstudien och affärsprospektet behandlar bland annat ekonomi, risker, marknad, projektförutsättningar och alternativa lösningar.", "page": 17}, {"type": "mc", "q": "Vilka frågor är relevanta när byggherren bedömer bygg- och markförutsättningar?", "opts": ["Geoteknik och markens stabilitet.", "Befintliga ledningar och teknisk infrastruktur.", "Enbart byggnadens framtida marknadsföringskampanj.", "Detaljplan och andra planmässiga förutsättningar.", "Tillgänglighet och trafikförutsättningar.", "Vilken entreprenör som erbjuder snyggast logotyp."], "correct": [0, 1, 3, 4], "why": "Tidiga mark- och byggförutsättningar omfattar tekniska, planmässiga och tillgänglighetsrelaterade frågor.", "page": 18}, {"type": "mc", "q": "Vad påverkas när byggherren väljer entreprenadform?", "opts": ["Ansvarsfördelningen mellan parterna.", "Behovet av interna resurser hos byggherren.", "Vilken kommun som har tillsyn enligt PBL.", "Hur projektrisker fördelas och hanteras.", "Om projektet över huvud taget omfattas av bygglagstiftning."], "correct": [0, 1, 3], "why": "Föreläsningen betonar att entreprenadformen påverkar ansvar, risk och behov av interna resurser.", "page": 21}, {"type": "mc", "q": "Vilka överväganden hör till en upphandlingsstrategi enligt föreläsningen?", "opts": ["Om traditionell konkurrensutsättning eller ramavtal ska användas.", "Om pris och kvalitet ska viktas i utvärderingen.", "Om dialog eller förhandling kan ge bättre villkor.", "Om entreprenören ska slippa alla kvalitetskrav.", "Om byggherren ska avstå från att formulera projektets behov."], "correct": [0, 1, 2], "why": "Strategin omfattar konkurrensform, eventuella ramavtal, dialog/förhandling och avvägningen mellan pris och kvalitet.", "page": 21}, {"type": "mc", "q": "Vilket påstående om byggprocessens skeden är mest korrekt?", "opts": ["Upphandling kan förekomma i flera skeden, inte enbart efter all projektering.", "Överlämning och förvaltning sker alltid före produktionen.", "Byggherren anger mål och krav endast under produktionen.", "Projekteringen börjar först efter att byggnaden tagits i bruk.", "Förstudien genomförs normalt efter slutbesiktningen."], "correct": [0], "why": "Översikten visar att upphandling kan ske i flera skeden och att byggherren följer projektet genom hela processen.", "page": 13}, {"type": "mc", "q": "Vilka kravområden kan enligt föreläsningen behöva behandlas i ett upphandlingsunderlag?", "opts": ["Arbetsmiljökrav.", "Miljö- och klimatkrav.", "Krav på kompetens och referenser.", "Tekniska beskrivningar och ritningar.", "Ett löfte att aldrig följa upp entreprenörens arbete.", "Att byggherren helt avstår från riskfördelning."], "correct": [0, 1, 2, 3], "why": "Underlaget kan innehålla bland annat teknik, ekonomi, kvalitet, arbetsmiljö, miljö, kompetens och riskfördelning.", "page": 21}, {"type": "mc", "q": "Varför har beslut i projektets tidiga skeden stor betydelse?", "opts": ["De avgör alltid exakt hur många fel som uppstår vid slutbesiktningen.", "Möjligheten att påverka är generellt större tidigt medan kostnaden för sena ändringar tenderar att öka.", "De gör uppföljning under produktionen onödig.", "De eliminerar alla osäkerheter i byggprojektet.", "De ersätter behovet av kravställning."], "correct": [1], "why": "Föreläsningens diagram visar högre påverkansmöjlighet i tidiga skeden och ökande kostnader för förändringar senare.", "page": 32}, {"type": "mc", "q": "Vilka perspektiv behöver byggherren väga samman för att skapa långsiktigt värde?", "opts": ["Ekonomiska värden och livscykelkostnader.", "Sociala värden och brukarnas behov.", "Miljö- och klimatpåverkan.", "Enbart lägsta möjliga initiala anbudspris.", "Fastighetens funktion och förvaltning över tid."], "correct": [0, 1, 2, 4], "why": "Byggherrerollen handlar om att förena ekonomi, sociala behov, miljö, funktion och långsiktigt värde.", "page": 47}, {"type": "mc", "q": "Vad är den mest träffsäkra skillnaden mellan byggkostnadsindex (BKI) och konsumentprisindex (KPI)?", "opts": ["BKI följer produktionsfaktorernas kostnader i bostadsbyggande; KPI följer priser för privat konsumtion.", "BKI mäter enbart tomtpriser; KPI mäter enbart räntor.", "BKI och KPI är två namn för exakt samma mått.", "KPI visar bara priset på byggmaterial; BKI visar hushållens konsumtion.", "BKI mäter färdiga bostäders marknadsvärde medan KPI mäter löneutvecklingen."], "correct": [0], "why": "BKI beskriver kostnadsförändringar för exempelvis material, utrustning, löner och transporter i bostadsbyggande. KPI avser konsumentpriser.", "page": 28}, {"type": "mc", "q": "Vilka utmaningar för samhällsbyggnadssektorn lyfts uttryckligen i föreläsningen?", "opts": ["Kvalitetsbrister och produktivitetsproblem.", "Arbetsmiljö och olycksrisker.", "Behov av digitalisering och kompetensutveckling.", "Klimat- och energifrågor.", "Att byggprojekt helt saknar behov av tillstånd.", "Att det inte finns någon risk för oseriösa aktörer."], "correct": [0, 1, 2, 3], "why": "Föreläsningen pekar bland annat på kvalitet, arbetsmiljö, digitalisering, kompetens, klimat och sunda affärer.", "page": 26}, {"type": "match", "q": "Para ihop aktörerna med deras huvudsakliga funktion i projektöversikten.", "pairs": [["Byggherre", "Anger mål och krav, organiserar projektet och följer upp resultatet"], ["Projektledare", "Styr tid, ekonomi, kvalitet och samordning"], ["Arkitekt och tekniska projektörer", "Utformar, beräknar och tar fram handlingar"], ["Entreprenör och installatör", "Genomför och egenkontrollerar arbeten"]], "why": "Rollerna samverkar men har skilda huvudsakliga uppgifter.", "page": 13}, {"type": "match", "q": "Para ihop handlingen eller undersökningen med vad den främst belyser.", "pairs": [["Geoteknisk undersökning", "Markens lämplighet, stabilitet och bärförmåga"], ["Bullerutredning", "Trafik- och andra bullerkällors påverkan"], ["Dagvattenutredning", "Avrinning och fördröjning av dagvatten"], ["Sol- och skuggstudie", "Ljusförhållanden för byggnader och omgivning"]], "why": "Dessa underlag används för att bedöma genomförbarhet och konsekvenser i tidiga skeden.", "page": 19}, {"type": "match", "q": "Para ihop regel- eller avtalsbegreppet med rätt beskrivning.", "pairs": [["Lag", "Beslutas av riksdagen och är bindande"], ["Förordning", "Beslutas av regeringen och är bindande"], ["Föreskrift", "Beslutas av myndighet med bemyndigande och är bindande"], ["Allmänna råd", "Myndighetsråd som inte i sig är bindande"]], "why": "Föreläsningens regelöversikt skiljer bindande regler från rådgivande allmänna råd.", "page": 37}];let order=Q.map((_,i)=>i),pos=0,answers={},checked={},isRetry=false;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const permutations=Q.map(q=>q.type==='mc'?shuffle(q.opts.map((_,i)=>i)):shuffle(q.pairs.map(p=>p[1])));function right(q,a){if(q.type==='mc')return !!a&&a.length===q.correct.length&&q.correct.every(v=>a.includes(v));return !!a&&q.pairs.every((p,i)=>a[i]===p[1])}function render(){const id=order[pos],q=Q[id],a=answers[id]??(q.type==='mc'?[]:{}),done=!!checked[id],ok=right(q,a);let content='';if(q.type==='mc'){content='<p class="muted">Välj '+q.correct.length+' rätt '+(q.correct.length===1?'svar':'svar')+'.</p>'+permutations[id].map((orig,k)=>{const chosen=a.includes(orig),correct=q.correct.includes(orig);const cls=done?(correct?' correct':chosen?' incorrect':''):'',mark=done&&chosen?'★':'';return `<label class="opt${cls}${chosen?' chosen':''}"><input type="${q.correct.length===1?'radio':'checkbox'}" name="answer" data-choice="${orig}" ${chosen?'checked':''} ${done?'disabled':''}><span class="star">${mark}</span><span><b>${String.fromCharCode(65+k)}.</b> ${esc(q.opts[orig])}</span></label>`}).join('')}else{content='<p class="muted">Para ihop varje uttryck med rätt beskrivning.</p>'+q.pairs.map((p,i)=>{const val=a[i]||'',correct=val===p[1],cls=done?(correct?'correct':'incorrect'):'';return `<div class="match-result ${cls}"><label class="match"><strong>${done&&val?'★ ':''}${esc(p[0])}</strong><select data-pair="${i}" ${done?'disabled':''}><option value="">Välj beskrivning</option>${permutations[id].map(v=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(v)}</option>`).join('')}</select></label>${done?`<small><b>Rätt svar:</b> ${esc(p[1])}</small>`:''}</div>`}).join('')};let review=done?`<p class="feedback ${ok?'ok':'no'}">${ok?'✓ Helt rätt!':'✕ Inte helt rätt.'}</p><div class="legend"><span><b style="color:#348457">Grönt</b> = rätt svar</span><span><b style="color:#b94848">Rött</b> = felaktigt val</span><span><b>★</b> = ditt val</span></div><div class="explanation"><b>Förklaring</b><p>${esc(q.why||'Se de rätta paren ovan.')}</p>${q.page?`<small>Föreläsningen: bild/sida ${q.page}</small>`:''}</div>`:'';app.innerHTML=`<div class="muted">${isRetry?'Repetition · ':''}Fråga ${pos+1} av ${order.length}</div><div class="progress"><div class="bar" style="width:${(pos+1)/order.length*100}%"></div></div><section class="card"><h2>${esc(q.q)}</h2>${content}${review}<div class="controls"><button class="secondary" id="prev" ${pos===0?'disabled':''}>Föregående</button>${done?`<button id="next">${pos===order.length-1?'Visa resultat':'Nästa fråga →'}</button>`:`<button id="check">Rätta frågan</button>`}</div></section>`;document.querySelectorAll('[data-choice]').forEach(el=>el.onchange=()=>{let n=+el.dataset.choice;let a=answers[id]||[];answers[id]=q.correct.length===1?[n]:el.checked?[...a,n]:a.filter(x=>x!==n);render()});document.querySelectorAll('[data-pair]').forEach(el=>el.onchange=()=>{answers[id]??={};answers[id][+el.dataset.pair]=el.value;render()});document.getElementById('prev').onclick=()=>{pos--;render();window.scrollTo(0,0)};if(done)document.getElementById('next').onclick=()=>{if(pos===order.length-1)finish();else{pos++;render();window.scrollTo(0,0)}};else document.getElementById('check').onclick=()=>{if(q.type==='mc'&&(!answers[id]||answers[id].length!==q.correct.length)){alert('Välj exakt '+q.correct.length+' alternativ innan du rättar.');return}if(q.type==='match'&&q.pairs.some((_,i)=>!answers[id]?.[i])){alert('Para ihop alla uttryck innan du rättar.');return}checked[id]=true;render()}}function finish(){const wrong=order.filter(i=>!right(Q[i],answers[i])),good=order.length-wrong.length;app.innerHTML=`<section class="card"><p class="muted">${isRetry?'Resultat av repetitionen':'Ditt resultat'}</p><div class="score">${good} / ${order.length}</div><h2>${Math.round(100*good/order.length)} % rätt</h2><p>${wrong.length?'Du kan träna på de frågor du svarade fel på.':'Alla frågor rätt!'}</p><div class="actions">${wrong.length?`<button id="retry">Träna på felaktiga frågor (${wrong.length})</button>`:''}<button class="secondary" id="restart">Gör om alla 15 frågor</button><a class="link" href="flashcards-byggherren.html">Träna med flashcards →</a><a class="link" href="start-bygg-och-anlaggningsprojektering.html">Kursöversikt</a></div></section>`;document.getElementById('restart').onclick=()=>{order=Q.map((_,i)=>i);pos=0;answers={};checked={};isRetry=false;render()};if(wrong.length)document.getElementById('retry').onclick=()=>{order=wrong;pos=0;isRetry=true;for(const i of wrong){delete answers[i];delete checked[i]}render()};window.scrollTo(0,0)}render();</script></body></html>
