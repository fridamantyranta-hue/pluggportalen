  <link rel="manifest" href="/pluggportalen/site.webmanifest"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz 1 – Workshopparna</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#20352b;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 60px}header{padding:25px 0}h1{font-size:clamp(25px,5vw,38px);margin:5px 0}h2{font-size:23px;line-height:1.35}p{line-height:1.5}.muted{color:#607269}.card{background:white;border:1px solid #dbe5de;border-radius:18px;padding:24px;box-shadow:0 6px 22px #1b3e2710}.opt{display:flex;align-items:center;gap:12px;padding:15px;margin:10px 0;border:2px solid #dce6df;border-radius:12px;cursor:pointer;line-height:1.4}.opt:has(input:checked){border-color:#2f7755;background:#e9f5ec}input{width:20px;height:20px;accent-color:#26784c;flex-shrink:0}button,.link{background:#246a48;color:white;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e6eee8;color:#1c5136}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.progress{height:9px;border-radius:12px;background:#dce7de;overflow:hidden;margin:20px 0}.bar{height:100%;background:#348457;transition:width .2s}.match{display:block;margin:15px 0}.match select{width:100%;padding:12px;margin-top:7px;border-radius:9px;border:1px solid #a7b8ab;font-size:16px;background:white}.review{padding:16px;border-left:5px solid #bb7251;background:#faf7f1;border-radius:8px;margin:12px 0}.review.good{border-color:#348457;background:#eef8f0}.score{font-size:45px;font-weight:800}nav{display:flex;flex-wrap:wrap;gap:10px}nav a{color:#246a48}small{font-size:13px}</style></head><body><main class="wrap"><header><nav><a href="index.html">Alla quiz</a></nav><h1>Quiz 1 – Workshopparna</h1><p class="muted">27 frågor · Facit visas när du avslutar quizet</p></header><div id="app"></div></main><script>const Q=[{"title": "Produktionsprocessen", "question": "Vilka av följande delprocesser ingår i produktionsprocessen?", "type": "choice", "options": ["Övertagande", "Produktionsanpassning", "Ombyggnad", "Byggdrift"], "correct": ["B", "D"]}, {"title": "Byggprocessens aktörer", "question": "Vilket alternativ beskriver bäst entreprenörens uppgift?", "type": "choice", "options": ["Att beställa arbetet och ställa krav", "Att utföra byggarbetet utifrån ritningar och beskrivningar", "Att ta fram ritningar som projektör", "Att låna ut pengar till projektet"], "correct": ["B"]}, {"title": "Projektledning", "question": "Vilken av följande är en vanlig arbetsuppgift för en projektledare?", "type": "choice", "options": ["Ansvarar för löner", "Städar fikarummet", "Utför arbete i produktion", "Fördelar arbetsuppgifter till organisationsmedlemmar"], "correct": ["D"]}, {"title": "Agil projektledning", "question": "Välj två punkter som kännetecknar agil projektledning.", "type": "choice", "options": ["Kommunikation", "Färdig plan", "Flexibilitet", "Förutsägbara kostnader"], "correct": ["A", "C"]}, {"title": "Byggsektorn och byggmarknaden", "question": "Varför var det problematiskt att använda byggsektorn som konjunkturpolitiskt instrument 1950-1989?", "type": "choice", "options": ["Byggsektorn sysselsatte för få personer", "Byggprojekten tog för lång tid att starta så effekten kom för sent", "Byggföretagen saknade kapacitet", "Bygginvesteringarna var för små"], "correct": ["B"]}, {"title": "Projekteringsprocessen", "question": "Vilka delprocesser ingår i initiala skedet av projekteringsprocessen?", "type": "choice", "options": ["Behovsutredning", "Bygglovsprocessen", "Gestaltning", "Förfrågningsunderlag"], "correct": ["A", "C"]}, {"title": "Projektmål och effektmål", "question": "Vilka är ett projekts tredimensionella mål?", "type": "choice", "options": ["Ekonomiska mål", "Effektmål", "Tidsmässiga mål", "Omfattning"], "correct": ["A", "C", "D"]}, {"title": "Projektgenomförande", "question": "Hur definieras Work Breakdown Structure (WBS)?", "type": "choice", "options": ["En metod för att räkna ut budget", "Allt arbete som krävs för att genomföra projektet framgångsrikt", "Säkerställa externa kontaktytor", "Samla all dokumentation"], "correct": ["B"]}, {"title": "Byggprocessens aktörer", "question": "Vilken är konsultens och projektörens huvudsakliga uppgift?", "type": "choice", "options": ["Utföra byggarbetet", "Hjälpa beställaren med ritningar, beräkningar och tekniska lösningar", "Finansiera projektet", "Leverera byggmaterial"], "correct": ["B"]}, {"title": "ABT06", "question": "Vad står ABT för?", "type": "choice", "options": ["Allmänna bestämmelser för utförandeentreprenader", "Allmänna bestämmelser för tvistemål", "Allmänna bestämmelser för totalentreprenader", "Alla bestämmelser för totalentreprenader"], "correct": ["C"]}, {"title": "Entreprenader i samverkan", "question": "Vilket alternativ kännetecknar bäst partnering?", "type": "choice", "options": ["Entreprenören arbetar utan samarbete med beställaren", "Gemensamma mål, öppen kommunikation och gemensam problemlösning", "Beställaren samordnar alla entreprenörer själv", "Upphandling sker alltid till lägsta pris"], "correct": ["B"]}, {"title": "Utförandeentreprenaden", "question": "Vilka är de tre utförandeentreprenadformerna?", "type": "choice", "options": ["Mycket delad entreprenad", "Delad entreprenad", "Generalentreprenad", "Minimidelad entreprenad"], "correct": ["A", "B", "C"]}, {"title": "Totalentreprenad", "question": "Vilket alternativ beskriver en fördel och en nackdel med totalentreprenad?", "type": "choice", "options": ["Kortare projekttid men mindre kontroll över detaljutformningen", "Större kontroll och kortare projekttid", "Tydligt helhetsansvar men svårare att jämföra anbud", "Beställaren ansvarar för projekteringen men byggstarten går snabbare"], "correct": ["A", "C"]}, {"title": "Intressentanalys", "question": "Vad behöver en intressentanalys innehålla?", "type": "choice", "options": ["Företagets ekonomiska inställning", "Detaljerad tidsplan", "Intressenternas inställning till projektet", "Sammanställning av byggnormer"], "correct": ["C"]}, {"title": "Ansvarsformer och innovation", "question": "Utvecklingen av de tjänster som entreprenörer och konsulter ska utföra påverkas av valet av ________.", "type": "choice", "options": ["Tidplan", "Ansvarsform", "Bygglov", "WBS"], "correct": ["B"]}, {"title": "Offentlig-privat samverkan (OPS)", "question": "När är OPS särskilt lämpligt?", "type": "choice", "options": ["När staten vill överlåta allt ansvar till privata företag", "När stora investeringar krävs men offentliga resurser är begränsade", "När privata företag vill slippa regler", "När staten vill undvika investeringar"], "correct": ["B"]}, {"title": "AB04", "question": "Varför rekommenderas parter att undvika att ändra paragrafer i AB04?", "type": "choice", "options": ["AB04 är inte dispositiv", "Det kan öka risken för missförstånd", "Förenklad tvistelösning försvinner", "Avtalet blir automatiskt dyrare"], "correct": ["B"]}, {"title": "LOU", "question": "Vilka omfattas inte av LOU?", "type": "choice", "options": ["Statliga myndigheter", "Privatpersoner", "Regioner", "Kommuner"], "correct": ["B"]}, {"title": "Hinder för och systemfel i projekteringsprocessen", "question": "Vilken situation är ett exempel på bristande erfarenhetsåterföring i projekteringsprocessen?", "type": "choice", "options": ["Konsulten avstår från att utreda en lösning som kan sänka driftkostnaden eftersom utredningen innebär obetalt arbete.", "Arkitekten flyttar en vägg utan att ändringen samordnas med ventilationskonsultens ritningar.", "Montörerna löser ett problem på byggarbetsplatsen, men projektörerna får aldrig information om lösningen och samma problem återkommer i nästa projekt.", "Konsulten väljer ett beprövat material eftersom ett nytt material kräver mer utredning och medför osäkerhet. [lindholmno...essen.pptx | PowerPoint]"], "correct": ["C"]}, {"title": "Förslags- huvudhandlings- och bygghandlingsskede", "question": "Para ihop påståendet med rätt skede.", "type": "match", "pairs": [["Kostnadsuppskattning samt ritningar med planer, sektioner och fasader", "Förslagsskedet"], ["Ritningar över stomme och konstruktion samt scheman för installationer (VVS och el)", "Huvudhandlingsskedet"], ["Detaljritningar samt mängdförteckningar", "Bygghandlingsskedet"]]}, {"title": "Genomförandeprocessen", "question": "Para ihop rätt alternativ.", "type": "match", "pairs": [["Tekniskt samråd", "Byggherren och byggnadsnämnden går igenom projektet"], ["Startbesked", "Byggnadsnämnden ger tillstånd att börja bygga"], ["Slutbesked", "Byggnaden får normalt tas i bruk"]]}, {"title": "Tekniska beskrivningar och förfrågningsunderlagets ritningar", "question": "Vilka två av följande påståenden om tekniska beskrivningar inom AMA är korrekta?", "type": "choice", "options": ["En teknisk beskrivning anger detaljerade krav på material, produkter och utförande för en specifik del av entreprenaden.", "En teknisk beskrivning ersätter alltid ritningar och fungerar som den enda bindande handlingen för mått och dimensioner.", "Den tekniska beskrivningen utformas ofta med stöd av AMA-systemet som används för att standardisera koder, benämningar och kravställningar.", "En rambeskrivning är alltid betydligt mer detaljerad än den tekniska beskrivningen när det gäller enskilda materialval."], "correct": ["A", "C"]}, {"title": "Initiala Skedet", "question": "Hur stor del av de totala investeringskostnaderna finns i det tidiga skedet?", "type": "choice", "options": ["50 %", "10 %", "20 %", "30 %"], "correct": ["B"]}, {"title": "Initiala skedet", "question": "Vad är det första man gör i initiala skedet?", "type": "choice", "options": ["Programarbete", "Behovsutredning", "Huvudhandlingar"], "correct": ["B"]}, {"title": "Bygglov", "question": "Vad är giltighetstiden för ett bygglov från at Välj alla rätta alternativ ('+q.correct.length+' st).':'Välj ett alternativ.')+'</p>'+q.options.map((o,i)=>{let id=String.fromCharCode(65+i);return '<label class="opt"><input type="'+(q.correct.length>1?'checkbox':'radio')+'" name="answer" value="'+id+'" '+(a.includes(id)?'checked':'')+'><span><b>'+id+'.</b> '+esc(o)+'</span></label>'}).join('')}root.innerHTML='<div class="muted">Fråga '+(idx+1)+' av '+Q.length+' · '+esc(q.title)+'</div><div class="progress"><div class="bar" style="width:'+((idx+1)/Q.length*100)+'%"></div></div><section class="card"><h2>'+esc(q.question)+'</h2>'+inner+'<div class="controls"><button class="secondary" id="prev" '+(idx===0?'disabled':'')+'>Föregående</button><button id="next">'+(idx===Q.length-1?'Avsluta och rätta':'Nästa fråga')+'</button></div></section>';document.querySelectorAll('input').forEach(el=>el.onchange=()=>{answers[idx]=q.correct.length>1?[...document.querySelectorAll('input:checked')].map(x=>x.value):[el.value];save()});document.querySelectorAll('select').forEach(el=>el.onchange=()=>{answers[idx]??={};answers[idx][el.dataset.match]=el.value;save()});document.getElementById('prev').onclick=()=>{idx--;save();render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{if(idx<Q.length-1){idx++;save();render();window.scrollTo(0,0)}else finish()}}function finish(){let points=Q.reduce((s,q,i)=>s+(correct(q,answers[i])?1:0),0);let review=Q.map((q,i)=>{let a=answers[i],ok=correct(q,a);let expected=q.type==='match'?q.pairs.map(p=>esc(p[0])+' → '+esc(p[1])).join('<br>'):q.correct.map(c=>esc(c+'. '+q.options[c.charCodeAt(0)-65])).join('<br>');let given=q.type==='match'?q.pairs.map((p,j)=>esc(p[0])+' → '+esc((a||{})[j]||'Ej besvarad')).join('<br>'):(a||[]).map(c=>esc(c+'. '+q.options[c.charCodeAt(0)-65])).join('<br>')||'Ej besvarad';return '<div class="review '+(ok?'good':'')+'"><b>'+(i+1)+'. '+esc(q.question)+'</b><p>'+(ok?'✓ Rätt':'✕ Fel')+'</p><small><b>Ditt svar:</b><br>'+given+'<br><b>Facit:</b><br>'+expected+'</small></div>'}).join('');root.innerHTML='<section class="card"><p class="muted">Ditt resultat</p><div class="score">'+points+' / '+Q.length+'</div><h2>'+Math.round(points/Q.length*100)+' % rätt</h2><p>Här ser du alla dina svar och facit från dokumentet.</p><button id="restart">Gör om quizet</button></section><h2>Genomgång av svaren</h2>'+review;document.getElementById('restart').onclick=()=>{idx=0;answers={};save();render();window.scrollTo(0,0)};window.scrollTo(0,0)}render();</script><footer>Samhällsbyggnad · Studiematerial 2026–2028 <span aria-hidden="true">·</span> <a href="om-pluggportalen.html" style="color:inherit;text-underline-offset:3px">Om Pluggportalen</a> <span aria-hidden="true">·</span> © 2026 Frida Mäntyranta</footer>
