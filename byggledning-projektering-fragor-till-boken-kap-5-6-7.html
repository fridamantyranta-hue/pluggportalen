gn:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Byggledning projektering - frågor till boken</h1><p>Utmanande quiz med varierande antal rätta svar och närliggande alternativ från kurslitteraturen · Kapitel 5, 6 och 7.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 24 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Studiematerial · Bygg- och anläggningsprojektering P0009B</footer><script>const Q=[{"ch":5,"q":"En byggherre anlitar en extern projektledningskonsult. Vilket förhållande bör klargöras redan vid uppdragsstart?","opts":["Att konsulten har rätt att ändra byggherrens krav utan särskilt beslut","Vilken projekteringsmetod konsulten föredrar oberoende av uppdraget","Att konsultens rapportering ersätter beställarens beslutsordning","Konsultens mandat, ansvar och rapportering till byggherren"],"correct":[3],"why":"En extern konsult företräder beställaren inom överenskommet uppdrag och mandat.","multi":false},{"ch":5,"q":"Vilka åtgärder kan minska risken för systemfel i projekteringen?","opts":["Att ansvar för kontroll och samordning av gränssnitt är tydligt","Tydliga rutiner för ändringar","Granskning av handlingarnas gränssnitt","Samordning mellan discipliner"],"correct":[0,1,2,3],"why":"Systemfel kan uppstå genom brister i samordning och arbetssätt, inte bara i en enskild ritning. Även det fjärde alternativet är relevant i den aktuella avgränsningen.","multi":true},{"ch":5,"q":"Flera ritningar är var för sig korrekta men fungerar inte tillsammans. Vilken typ av problem är mest träffande?","opts":["En ändring i entreprenadens ekonomiska villkor","Ett rent leveransfel i byggmaterial","Ett samordnings- eller systemfel","Ett isolerat ritfel i en enda disciplin"],"correct":[2],"why":"Fel i gränssnitt mellan handlingar visar brister i systemet för projektering och samordning.","multi":false},{"ch":5,"q":"Varför är kontrollrutiner särskilt viktiga tidigt i projektet?","opts":["Det innebär att tekniska lösningar kan fastställas innan behov formulerats","Det gör att samordning mellan discipliner inte längre behövs","Det minskar behovet av dokumenterad ändringshantering","Tidiga fel kan annars föras vidare och bli kostsamma att rätta"],"correct":[3],"why":"Fel som upptäcks sent har ofta hunnit påverka flera handlingar och aktiviteter.","multi":false},{"ch":5,"q":"Vilka frågor bör en beställare ta ställning till vid val av konsultinsats?","opts":["Hur konsultens arbete ska följas upp","Att konsultens leverans kan definieras efter att uppdraget har avslutats","Vilken kompetens som saknas internt","Om konsulten föredrar ett visst digitalt ritverktyg oavsett leverans"],"correct":[0,2],"why":"Konsultuppdraget ska svara mot faktiska behov och vara möjligt att styra och följa upp. Det bortvalda alternativet är för kategoriskt eller hör till ett annat moment.","multi":true},{"ch":5,"q":"Ett projekt visar återkommande likartade projekteringsfel trots att enskilda fel rättas. Vilken åtgärd angriper grundproblemet bäst?","opts":["Utöka slutkontrollen utan att se över projekteringsrutinerna","Analysera gemensamma arbetssätt och kontrollpunkter","Öka antalet revideringar men behålla samma kontrollpunkter","Låta varje disciplin själv avgöra om återkommande fel ska rapporteras"],"correct":[1],"why":"Återkommande fel kräver åtgärder mot bakomliggande processbrister.","multi":false},{"ch":6,"q":"Verksamheten beskriver hur många personer som ska arbeta i byggnaden och vilka samband lokalerna behöver. Vilken handling är närmast aktuell?","opts":["Bygghandling som fastställer alla materialval","Systemhandling som redovisar valda tekniska huvudlösningar","Lokalprogram","Rumsfunktionsprogram med färdig detaljprojektering"],"correct":[2],"why":"Lokalprogrammet uttrycker verksamhetens lokalbehov och funktionskrav.","multi":false},{"ch":6,"q":"Vilka uppgifter hör typiskt till tidig program- och kravhantering?","opts":["Viktiga förutsättningar och begränsningar","Ytbehov och samband mellan lokaler","Vilka övergripande tillgänglighets- och funktionskrav verksamheten har","Verksamhetens funktionsbehov"],"correct":[0,1,2,3],"why":"Programarbetet utgår från behov och förutsättningar innan detaljerad projektering. Även det fjärde alternativet är relevant i den aktuella avgränsningen.","multi":true},{"ch":6,"q":"Vad är det huvudsakliga syftet med systemhandlingar?","opts":["Att slutligt dokumentera samtliga faktiskt utförda avvikelser","Att beskriva verksamhetens behov utan att pröva tekniska system","Att ange varje produktionsmoment i entreprenörens arbetsberedning","Att redovisa valda tekniska huvudlösningar för fortsatt projektering"],"correct":[3],"why":"Systemhandlingar konkretiserar huvudlösningar innan bygghandlingarnas detaljnivå.","multi":false},{"ch":6,"q":"En projektör behöver ange utförande och materialkrav som inte framgår tydligt av ritningen. Vilken komplettering är mest relevant?","opts":["En ritningsförteckning som visar vilka filer som är gällande","Teknisk beskrivning","En rumsfunktionsbeskrivning som enbart anger verksamhetsbehov","En samordningsmodell som visar geometri men inte materialkrav"],"correct":[1],"why":"Tekniska beskrivningar kompletterar ritningar med krav på material och utförande.","multi":false},{"ch":6,"q":"Vilka funktioner kan AMA fylla i arbetet med tekniska beskrivningar?","opts":["Ge en gemensam struktur för beskrivningstexter","Bidra till konsekvent terminologi","Att AMA automatiskt täcker alla projektspecifika funktionskrav","Att AMA alltid gäller i sin helhet utan uttrycklig hänvisning"],"correct":[0,1],"why":"AMA ger ett referenssystem men projektets egna krav måste fortfarande preciseras. Det bortvalda alternativet är för kategoriskt eller hör till ett annat moment.","multi":true},{"ch":6,"q":"Vad är en viktig skillnad mellan bygghandling och relationshandling?","opts":["Relationshandlingen ersätter behovet av att dokumentera ändringar","Bygghandlingen avser utförda ändringar och relationshandlingen planerat utförande","Bygghandlingen beskriver avsett utförande; relationshandlingen redovisar utfört resultat","Bygghandlingar kan inte revideras efter att produktionen startat"],"correct":[2],"why":"Relationshandlingar ska spegla det färdigställda utförandet, medan bygghandlingar styr genomförandet.","multi":false},{"ch":6,"q":"Vilka problem kan uppstå om ritningsförteckningen inte hålls aktuell?","opts":["Att gällande handlingar blir lättare att identifiera trots oklar versionsstatus","All granskning måste göras om från början vid varje revision","Fel ritningsversion kan användas","Äldre handlingar blir automatiskt ogiltiga för alla kontraktsfrågor"],"correct":[2],"why":"Här är bara ett av de fyra påståendena tillräckligt välgrundat för att väljas. En aktuell förteckning hjälper projektet att identifiera och distribuera gällande handlingar.","multi":true},{"ch":6,"q":"Vad bör en CAD-manual framför allt bidra till?","opts":["Att fastställa avtalsansvar mellan beställare och entreprenör","Enhetliga rutiner för digitala modeller och ritningar","Att bestämma projektspecifika funktionskrav utan beställarens medverkan","Att ersätta all manuell kontroll av digitala handlingar"],"correct":[1],"why":"Gemensamma CAD-regler underlättar samordning och informationsutbyte.","multi":false},{"ch":6,"q":"Ett ventilationsschakt kolliderar med en bärande balk i modellen. Vad är mest ändamålsenligt?","opts":["Flytta kollisionen till en särskild ritning utan att ändra lösningarna","Samordna berörda discipliner och revidera berörda handlingar","Låta installationsprojektören justera schaktet utan att samråda med konstruktören","Behålla båda lösningarna och lämna avvikelsen till produktionsplaneringen"],"correct":[1],"why":"Tekniska konflikter behöver lösas och föras in i samordnade handlingar före utförande.","multi":false},{"ch":6,"q":"Vilka kontroller är relevanta vid granskning av projekteringshandlingar?","opts":["Att krav har omhändertagits","Att alla ändringar kan accepteras om de har ett revisionsdatum","Att handlingar är samordnade","Att varje handling har enhetlig grafisk utformning oavsett innehåll"],"correct":[0,2],"why":"Granskningen omfattar kravuppfyllelse, samordning och styrning av ändringar. Det bortvalda alternativet är för kategoriskt eller hör till ett annat moment.","multi":true},{"ch":6,"q":"Varför behöver projekteringen stegvis öka detaljeringsgraden?","opts":["För att handlingarna ska kunna få samma detaljeringsgrad genom hela processen","För att alla projektörer ska kunna arbeta utan beslut om systemval","För att produktionsmetoder alltid ska bestämmas före funktionskrav","För att beslut om huvudlösningar ska kunna ligga till grund för utförandedetaljer"],"correct":[3],"why":"Projekteringen går från behov och systemval till detaljerade underlag för byggandet.","multi":false},{"ch":6,"q":"En ny ritningsversion skickas ut men tidigare version ligger kvar i arbetsmappen. Vad är den viktigaste risken?","opts":["Att handlingens revision kan missförstås även om tekniken är oförändrad","Att utförandet baseras på en inaktuell handling","Att filens metadata automatiskt ändrar byggnadens funktion","Att alla tidigare granskningsbeslut automatiskt blir ogiltiga"],"correct":[1],"why":"Versionsstyrning ska säkerställa att rätt handling används vid rätt tidpunkt.","multi":false},{"ch":6,"q":"Vilka handlingar är särskilt relevanta när en entreprenör ska förstå vad som ska utföras?","opts":["Gällande revideringar och hänvisningar","Tekniska beskrivningar","Att en tidig principskiss ensam räcker för entreprenörens utförande","Byggritningar"],"correct":[0,1,3],"why":"Utförandet styrs av samordnade, gällande bygghandlingar och beskrivningar.","multi":true},{"ch":7,"q":"En kontrollansvarig enligt PBL anlitas för ett byggprojekt. Vilken beskrivning är mest träffande?","opts":["Att ersätta byggnadsnämndens tekniska samråd","Att bistå byggherren i kontrollarbetet enligt reglerna","Att automatiskt överta byggherrens ansvar för kravuppfyllelse","Att självständigt fatta beslut om startbesked inom projektet"],"correct":[1],"why":"Kontrollansvarig stödjer byggherren och har särskilda uppgifter i kontrollprocessen.","multi":false},{"ch":7,"q":"Vilka frågor hör till en kontrollplan enligt PBL?","opts":["Vad som ska kontrolleras","Vem som ska utföra kontrollerna","Hur kontrollerna ska dokumenteras","Mot vilka handlingar eller krav respektive kontroll ska utföras"],"correct":[0,1,2,3],"why":"Kontrollplanen ska tydliggöra kontroller och deras genomförande. Även det fjärde alternativet är relevant i den aktuella avgränsningen.","multi":true},{"ch":7,"q":"Varför är tekniskt samråd viktigt i byggprocessen?","opts":["För att ersätta kontrollplanen med en muntlig genomgång","För att behandla tekniska förutsättningar och kontrollfrågor inför genomförandet","För att byggnadsnämnden ska välja entreprenadform åt byggherren","För att fastställa slutliga relationshandlingar innan byggstart"],"correct":[1],"why":"Tekniskt samråd är en del av byggnadsnämndens process kring tekniska frågor och kontroll.","multi":false},{"ch":7,"q":"Vilka förhållanden bör projektets kommunikationsrutiner stödja?","opts":["Att enbart projektledaren får ta del av avvikelser oavsett ansvar","Att rätt information når berörd aktör","Att beslut och ändringar kan följas","Att gränssnitt mellan discipliner hanteras"],"correct":[1,2,3],"why":"Kommunikationsrutiner ska underlätta samordning, beslut och spårbarhet.","multi":true},{"ch":7,"q":"En projektör upptäcker att en myndighetsförutsättning påverkar den valda lösningen. Vad bör ske?","opts":["Att projektören själv får tolka bort kravet om lösningen är tekniskt bättre","Att myndighetskravet kan hanteras först vid överlämning till förvaltning","Frågan ska lyftas och lösningen prövas mot gällande krav","Att projekteringen kan fortsätta utan ändring om bygglov har sökts"],"correct":[2],"why":"Myndighetskrav behöver beaktas i projekteringen och hanteras genom rätt beslutsvägar.","multi":false},{"ch":7,"q":"Vilka aktörer kan behöva samordna information under projekteringen?","opts":["Konstruktör","Att projekteringsledaren ensam ska producera alla discipliners tekniska handlingar","Arkitekt","Installationsprojektörer"],"correct":[0,2,3],"why":"Flera projekteringsdiscipliner måste samordna sina lösningar och handlingar.","multi":true},{"ch":7,"q":"Vad är skillnaden mellan egenkontroll och oberoende granskning?","opts":["Egenkontroll får endast utföras av myndighetens handläggare","Oberoende granskning gör den egna kontrollen överflödig","Egenkontroll avser bara kostnader medan oberoende granskning avser teknik","Egenkontroll görs i den egna verksamheten; oberoende granskning görs av annan part"],"correct":[3],"why":"Egenkontroll och extern/oberoende granskning har olika organisatorisk utgångspunkt.","multi":false},{"ch":7,"q":"Vilka steg ingår i en fungerande hantering av avvikelser?","opts":["Att alla avvikelser kan stängas efter att de har noterats i protokoll","Bedöma konsekvenser och besluta åtgärd","Att en åtgärd kan anses avslutad när ansvarig har utsetts","Registrera och beskriva avvikelsen"],"correct":[1,3],"why":"Avvikelsehantering kräver dokumentation, åtgärd och uppföljning. Det bortvalda alternativet är för kategoriskt eller hör till ett annat moment.","multi":true},{"ch":7,"q":"En entreprenör upptäcker att utfört arbete inte motsvarar handlingarna. Vilket agerande är mest lämpligt?","opts":["Dokumentera avvikelsen och hantera den enligt projektets rutiner","Att informera endast materialleverantören och fortsätta enligt plan","Att avvakta tills beställaren har betalat slutfakturan","Att omedelbart ändra relationshandlingen utan att utreda orsaken"],"correct":[0],"why":"Avvikelser ska hanteras spårbart och med rätt bedömning och beslut.","multi":false},{"ch":7,"q":"Varför bör kontroller knytas till definierade krav?","opts":["För att minska behovet av att identifiera vem som utfört kontrollen","För att kunna kontrollera om utfallet uppfyller överenskomna kriterier, utan att bedömningen blir godtycklig","För att undvika att dokumentera avvikelser som inte påverkar tidplanen","Så att resultatet kan bedömas mot en tydlig kontrollgrund"],"correct":[3],"why":"Kontroll kräver kriterier för att kunna bedöma om utförandet uppfyller kraven.","multi":false},{"ch":7,"q":"Vilka konsekvenser kan bristande projekteringssamordning få?","opts":["Kollisioner mellan tekniska system","Omarbetningar under produktionen","Otydlig ansvarsfördelning vid ändringar","Att varje projekteringsändring automatiskt blir ett myndighetsärende"],"correct":[0,1,2],"why":"Bristande samordning kan skapa konflikter, förseningar och merarbete.","multi":true}];const C=[["Extern projektledningskonsult","Tillför projektledningskompetens och resurser till beställaren."],["Projektstart","Skede där förutsättningar, mål och behov behöver tydliggöras."],["Systemfel","Brister i projekteringsprocessens arbetssätt och informationsflöden."],["Samordning","Att olika aktörers arbeten och lösningar fungerar ihop."],["Beställaruppföljning","Kontroll av att uppdrag och leveranser motsvarar beställarens krav."],["Byggledningskonsult","Kan stödja beställaren i kontroll och uppföljning."],["Projektering","Utveckling och dokumentation av byggprojektets lösningar."],["Lokalprogram","Underlag om verksamhetens lokalbehov och funktioner."],["Verksamhetskrav","Behov som lokaler och tekniska lösningar ska uppfylla."],["Systemhandling","Redovisar övergripande och samordnade lösningar."],["Huvudhandling","Redovisar byggnadens huvudsakliga utformning."],["Bygghandling","Underlag som beskriver hur byggandet ska utföras."],["Teknisk beskrivning","Anger tekniska krav och egenskaper som kompletterar ritningar."],["AMA","Referenssystem för strukturering av tekniska beskrivningar."],["Ritningsförteckning","Lista över projektets ritningar och versioner."],["CAD-manual","Gemensamma regler för digital ritnings- och modellhantering."],["Versionshantering","Säkerställer att rätt dokumentversion används."],["Kvalitetssäkring","Granskning och kontroll av att krav uppfylls."],["Kommunikationsplan","Plan för mottagare, innehåll, ansvar och kanaler."],["Projektörssamordning","Samordnar tekniska lösningar mellan olika discipliner."],["Myndighetskontakt","Kommunikation kring tillstånd, krav och myndighetsprövning."],["Kontrollansvarig","Bistår byggherren med kontrollplan och uppföljning enligt PBL."],["Kontrollplan","Anger kontroller, ansvar och redovisning."],["Tekniskt samråd","Genomgång av genomförande och kontrollfrågor inför byggstart."],["Egenkontroll","Kontroll av det egna arbetet mot gällande krav."]];let idx=0,selected=new Set(),answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}
function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><p>Frågor med kryssrutor ger poäng endast om exakt alla rätta alternativ har markerats – oavsett hur många det är.</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Kapitel '+q.ch;$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';let multi=q.multi===true;let hint=document.createElement('p');hint.className='muted small';hint.textContent=multi?'Flera svar kan vara rätt. Markera alla alternativ du bedömer som korrekta och klicka på Kontrollera svar.':'Välj det bästa svaret.';$('options').appendChild(hint);q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});let check=document.createElement('button');check.id='checkanswer';check.className='primary';check.textContent='Kontrollera svar';check.style.display=multi?'inline-block':'none';check.disabled=true;check.onclick=checkAnswer;$('options').appendChild(check);$('feedback').classList.add('hide');$('next').disabled=true;selected=new Set();answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}
function choose(i){if(answered)return;let q=Q[order[idx]];let multi=q.multi===true;if(!multi){selected=new Set([i]);checkAnswer();return}if(selected.has(i))selected.delete(i);else selected.add(i);[...$('options').querySelectorAll('button.option')].forEach((b,j)=>b.classList.toggle('selected',selected.has(j)));$('checkanswer').disabled=selected.size===0}
function checkAnswer(){if(answered||selected.size===0)return;answered=true;let q=Q[order[idx]];let ok=selected.size===q.correct.length&&q.correct.every(i=>selected.has(i));if(ok)score++;[...$('options').querySelectorAll('button.option')].forEach((b,j)=>{b.disabled=true;if(q.correct.includes(j))b.classList.add('correct');else if(selected.has(j))b.classList.add('wrong')});$('checkanswer').style.display='none';$('feedback').textContent='';let strong=document.createElement('b');strong.textContent=ok?'Rätt svar!':'Inte riktigt.';let p=document.createElement('p');p.textContent=q.why;let p2=document.createElement('p');p2.textContent='Rätt alternativ: '+q.correct.map(i=>String.fromCharCode(65+i)).join(', ')+'.';$('feedback').append(strong,p,p2);$('feedback').classList.remove('hide');$('next').disabled=false}
function next(){idx++;render()}function restart(){location.reload()}
function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
