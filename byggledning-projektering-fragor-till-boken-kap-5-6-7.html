<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggledning projektering - frågor till boken</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20352e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(115deg,#183d34,#396e59);color:white;padding:42px 20px}main,.inner{max-width:920px;margin:auto}h1{font-size:clamp(1.9rem,4vw,3rem);margin:7px 0}header p{color:#dcebe2}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #b7c9be;background:white;color:#234b3b;border-radius:12px;padding:11px 17px}button:hover{border-color:#315d4a}button.active,.primary{background:#285b47;color:white;border-color:#285b47}.panel{background:white;border:1px solid #e2e7de;border-radius:20px;padding:clamp(18px,4vw,35px);box-shadow:0 10px 35px #1c3b2910;margin-bottom:20px}.muted{color:#61766c}.progress{height:9px;background:#e8eee9;border-radius:9px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#5e9974;transition:width .2s}.options{display:grid;gap:10px;margin:24px 0}.option{text-align:left;width:100%;padding:15px;border:1px solid #cbd8ce}.option.selected{background:#e4f0e8;border-color:#447d5c}.option.correct{background:#d9f2df;border-color:#32804b}.option.wrong{background:#fce6e4;border-color:#b54b43}.feedback{border-left:4px solid #568d6b;padding:14px;background:#f1f7f2;border-radius:8px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.small{font-size:.9rem}.flash{min-height:240px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#f4f8f3;border:1px dashed #8eac98;border-radius:18px;padding:25px;margin:20px 0}.flash strong{font-size:1.6rem}.hide{display:none}.pill{display:inline-block;background:#e4ede4;color:#335e46;border-radius:99px;padding:5px 11px;font-size:.85rem}footer{text-align:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Byggledning projektering - frågor till boken</h1><p>Fördjupande quiz med resonemang och flervalsfrågor från kurslitteraturen · Kapitel 5, 6 och 7.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 24 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Studiematerial · Bygg- och anläggningsprojektering P0009B</footer><script>const Q=[{"ch":5,"q":"En byggherre anlitar en extern projektledningskonsult. Vilket förhållande bör klargöras redan vid uppdragsstart?","opts":["Konsultens mandat, ansvar och rapportering till byggherren","Att konsulten automatiskt blir byggherre i juridisk mening","Att alla andra konsulter upphör att ha egna uppdrag","Att projektets krav får ändras utan godkännande"],"correct":[0],"why":"En extern konsult företräder beställaren inom överenskommet uppdrag och mandat."},{"ch":5,"q":"Vilka åtgärder kan minska risken för systemfel i projekteringen? Markera alla rätta.","opts":["Samordning mellan discipliner","Granskning av handlingarnas gränssnitt","Tydliga rutiner för ändringar","Att varje disciplin arbetar utan insyn från övriga"],"correct":[0,1,2],"why":"Systemfel kan uppstå genom brister i samordning och arbetssätt, inte bara i en enskild ritning."},{"ch":5,"q":"Flera ritningar är var för sig korrekta men fungerar inte tillsammans. Vilken typ av problem är mest träffande?","opts":["Ett samordnings- eller systemfel","Enbart ett fel i materialleveransen","Ett problem som endast kan finnas efter slutbesiktning","Ett tecken på att projektering inte behövs"],"correct":[0],"why":"Fel i gränssnitt mellan handlingar visar brister i systemet för projektering och samordning."},{"ch":5,"q":"Varför är kontrollrutiner särskilt viktiga tidigt i projektet?","opts":["Tidiga fel kan annars föras vidare och bli kostsamma att rätta","De gör att inga nya beslut behöver fattas","De ersätter all senare kvalitetskontroll","De gör tekniska krav överflödiga"],"correct":[0],"why":"Fel som upptäcks sent har ofta hunnit påverka flera handlingar och aktiviteter."},{"ch":5,"q":"Vilka frågor bör en beställare ta ställning till vid val av konsultinsats? Markera alla rätta.","opts":["Vilken kompetens som saknas internt","Vilka leveranser som förväntas","Hur konsultens arbete ska följas upp","Om konsulten kan ersätta samtliga lagstadgade beslut"],"correct":[0,1,2],"why":"Konsultuppdraget ska svara mot faktiska behov och vara möjligt att styra och följa upp."},{"ch":5,"q":"Ett projekt visar återkommande likartade projekteringsfel trots att enskilda fel rättas. Vilken åtgärd angriper grundproblemet bäst?","opts":["Analysera gemensamma arbetssätt och kontrollpunkter","Enbart rätta den senaste ritningen","Skjuta upp granskningen tills produktionen är färdig","Byta ritningsnummer utan att ändra processen"],"correct":[0],"why":"Återkommande fel kräver åtgärder mot bakomliggande processbrister."},{"ch":6,"q":"Verksamheten beskriver hur många personer som ska arbeta i byggnaden och vilka samband lokalerna behöver. Vilken handling är närmast aktuell?","opts":["Lokalprogram","Relationsritning","Slutbesiktningsutlåtande","Driftjournal"],"correct":[0],"why":"Lokalprogrammet uttrycker verksamhetens lokalbehov och funktionskrav."},{"ch":6,"q":"Vilka uppgifter hör typiskt till tidig program- och kravhantering? Markera alla rätta.","opts":["Verksamhetens funktionsbehov","Ytbehov och samband mellan lokaler","Viktiga förutsättningar och begränsningar","Slutligt uppmätta mängder av utfört arbete"],"correct":[0,1,2],"why":"Programarbetet utgår från behov och förutsättningar innan detaljerad projektering."},{"ch":6,"q":"Vad är det huvudsakliga syftet med systemhandlingar?","opts":["Att redovisa valda tekniska huvudlösningar för fortsatt projektering","Att dokumentera exakt hur byggnaden faktiskt blev efter färdigställande","Att ersätta alla tekniska beskrivningar i produktionen","Att redovisa endast entreprenörens fakturor"],"correct":[0],"why":"Systemhandlingar konkretiserar huvudlösningar innan bygghandlingarnas detaljnivå."},{"ch":6,"q":"En projektör behöver ange utförande och materialkrav som inte framgår tydligt av ritningen. Vilken komplettering är mest relevant?","opts":["Teknisk beskrivning","Anbudsöppningsprotokoll","Organisationsschema","Intressentförteckning"],"correct":[0],"why":"Tekniska beskrivningar kompletterar ritningar med krav på material och utförande."},{"ch":6,"q":"Vilka funktioner kan AMA fylla i arbetet med tekniska beskrivningar? Markera alla rätta.","opts":["Ge en gemensam struktur för beskrivningstexter","Underlätta hänvisningar till etablerade krav","Bidra till konsekvent terminologi","Automatiskt ersätta alla projektspecifika val"],"correct":[0,1,2],"why":"AMA ger ett referenssystem men projektets egna krav måste fortfarande preciseras."},{"ch":6,"q":"Vad är en viktig skillnad mellan bygghandling och relationshandling?","opts":["Bygghandlingen beskriver avsett utförande; relationshandlingen redovisar utfört resultat","Bygghandlingen upprättas alltid efter relationshandlingen","Relationshandlingen är endast ett ekonomiskt dokument","Handlingarna har alltid samma innehåll och datum"],"correct":[0],"why":"Relationshandlingar ska spegla det färdigställda utförandet, medan bygghandlingar styr genomförandet."},{"ch":6,"q":"Vilka problem kan uppstå om ritningsförteckningen inte hålls aktuell? Markera alla rätta.","opts":["Fel ritningsversion kan användas","Utgångna handlingar kan misstas för gällande","Distribution och kontroll blir svårare","Projektets tekniska gränssnitt försvinner automatiskt"],"correct":[0,1,2],"why":"En aktuell förteckning hjälper projektet att identifiera och distribuera gällande handlingar."},{"ch":6,"q":"Vad bör en CAD-manual framför allt bidra till?","opts":["Enhetliga rutiner för digitala modeller och ritningar","Att byggnadens funktionella krav upphör att gälla","Att entreprenören automatiskt får projekteringsansvar","Att all kommunikation kan ske utan dokumentation"],"correct":[0],"why":"Gemensamma CAD-regler underlättar samordning och informationsutbyte."},{"ch":6,"q":"Ett ventilationsschakt kolliderar med en bärande balk i modellen. Vad är mest ändamålsenligt?","opts":["Samordna berörda discipliner och revidera berörda handlingar","Låta båda disciplinernas ritningar gälla utan ändring","Vänta tills schaktet byggs innan någon kontakt tas","Ta bort kollisionsnoteringen utan teknisk bedömning"],"correct":[0],"why":"Tekniska konflikter behöver lösas och föras in i samordnade handlingar före utförande."},{"ch":6,"q":"Vilka kontroller är relevanta vid granskning av projekteringshandlingar? Markera alla rätta.","opts":["Att krav har omhändertagits","Att handlingar är samordnade","Att ändringar är spårbara","Att endast filnamnets längd är korrekt"],"correct":[0,1,2],"why":"Granskningen omfattar kravuppfyllelse, samordning och styrning av ändringar."},{"ch":6,"q":"Varför behöver projekteringen stegvis öka detaljeringsgraden?","opts":["För att beslut om huvudlösningar ska kunna ligga till grund för utförandedetaljer","För att alla detaljer ska bestämmas innan behov och mål formulerats","För att tekniska gränssnitt ska slippa samordnas","För att slutbesiktningen ska kunna ersätta projektering"],"correct":[0],"why":"Projekteringen går från behov och systemval till detaljerade underlag för byggandet."},{"ch":6,"q":"En ny ritningsversion skickas ut men tidigare version ligger kvar i arbetsmappen. Vad är den viktigaste risken?","opts":["Att utförandet baseras på en inaktuell handling","Att bygglovet automatiskt upphör","Att all projektering måste börja om från början","Att ritningens skala ändras av filens datum"],"correct":[0],"why":"Versionsstyrning ska säkerställa att rätt handling används vid rätt tidpunkt."},{"ch":6,"q":"Vilka handlingar är särskilt relevanta när en entreprenör ska förstå vad som ska utföras? Markera alla rätta.","opts":["Byggritningar","Tekniska beskrivningar","Gällande revideringar och hänvisningar","Endast den första idéskissen utan senare beslut"],"correct":[0,1,2],"why":"Utförandet styrs av samordnade, gällande bygghandlingar och beskrivningar."},{"ch":7,"q":"En kontrollansvarig enligt PBL anlitas för ett byggprojekt. Vilken beskrivning är mest träffande?","opts":["Att bistå byggherren i kontrollarbetet enligt reglerna","Att automatiskt överta byggherrens samtliga skyldigheter","Att utföra varje enskilt arbetsmoment på byggplatsen","Att själv utfärda bygglov och slutbesked"],"correct":[0],"why":"Kontrollansvarig stödjer byggherren och har särskilda uppgifter i kontrollprocessen."},{"ch":7,"q":"Vilka frågor hör till en kontrollplan enligt PBL? Markera alla rätta.","opts":["Vad som ska kontrolleras","Vem som ska utföra kontrollerna","Hur kontrollerna ska dokumenteras","Vilken entreprenör som har snyggast logotyp"],"correct":[0,1,2],"why":"Kontrollplanen ska tydliggöra kontroller och deras genomförande."},{"ch":7,"q":"Varför är tekniskt samråd viktigt i byggprocessen?","opts":["För att behandla tekniska förutsättningar och kontrollfrågor inför genomförandet","För att ersätta alla beslut om startbesked","För att avgöra entreprenörens semesterplanering","För att slutligt fastställa byggnadens driftkostnader"],"correct":[0],"why":"Tekniskt samråd är en del av byggnadsnämndens process kring tekniska frågor och kontroll."},{"ch":7,"q":"Vilka förhållanden bör projektets kommunikationsrutiner stödja? Markera alla rätta.","opts":["Att rätt information når berörd aktör","Att beslut och ändringar kan följas","Att gränssnitt mellan discipliner hanteras","Att all kommunikation sker muntligt utan spårbarhet"],"correct":[0,1,2],"why":"Kommunikationsrutiner ska underlätta samordning, beslut och spårbarhet."},{"ch":7,"q":"En projektör upptäcker att en myndighetsförutsättning påverkar den valda lösningen. Vad bör ske?","opts":["Frågan ska lyftas och lösningen prövas mot gällande krav","Frågan ska döljas tills slutbesiktningen","Projektören ska själv utfärda myndighetsbeslutet","Byggnaden ska utföras enligt första skissen oavsett krav"],"correct":[0],"why":"Myndighetskrav behöver beaktas i projekteringen och hanteras genom rätt beslutsvägar."},{"ch":7,"q":"Vilka aktörer kan behöva samordna information under projekteringen? Markera alla rätta.","opts":["Arkitekt","Konstruktör","Installationsprojektörer","Endast fastighetens framtida städleverantör"],"correct":[0,1,2],"why":"Flera projekteringsdiscipliner måste samordna sina lösningar och handlingar."},{"ch":7,"q":"Vad är skillnaden mellan egenkontroll och oberoende granskning?","opts":["Egenkontroll görs i den egna verksamheten; oberoende granskning görs av annan part","Egenkontroll görs bara efter garantitidens slut","Oberoende granskning innebär att inget ansvar finns kvar","Båda begreppen betyder att myndigheten utför allt arbete"],"correct":[0],"why":"Egenkontroll och extern/oberoende granskning har olika organisatorisk utgångspunkt."},{"ch":7,"q":"Vilka steg ingår i en fungerande hantering av avvikelser? Markera alla rätta.","opts":["Registrera och beskriva avvikelsen","Bedöma konsekvenser och besluta åtgärd","Följa upp att åtgärden genomförts","Radera avvikelsen innan den kommuniceras"],"correct":[0,1,2],"why":"Avvikelsehantering kräver dokumentation, åtgärd och uppföljning."},{"ch":7,"q":"En entreprenör upptäcker att utfört arbete inte motsvarar handlingarna. Vilket agerande är mest lämpligt?","opts":["Dokumentera avvikelsen och hantera den enligt projektets rutiner","Dölja skillnaden om den inte syns på fotografier","Vänta med information tills byggnaden tas i bruk","Ändra ritningen utan att någon berörd part underrättas"],"correct":[0],"why":"Avvikelser ska hanteras spårbart och med rätt bedömning och beslut."},{"ch":7,"q":"Varför bör kontroller knytas till definierade krav?","opts":["Så att resultatet kan bedömas mot en tydlig kontrollgrund","Så att kontrollerna kan göras helt utan dokumentation","Så att alla projekt får identiska tekniska lösningar","Så att kontrollansvarig slipper delta i processen"],"correct":[0],"why":"Kontroll kräver kriterier för att kunna bedöma om utförandet uppfyller kraven."},{"ch":7,"q":"Vilka konsekvenser kan bristande projekteringssamordning få? Markera alla rätta.","opts":["Kollisioner mellan tekniska system","Otydlig ansvarsfördelning vid ändringar","Omarbetningar under produktionen","Att behovet av bygglov alltid försvinner"],"correct":[0,1,2],"why":"Bristande samordning kan skapa konflikter, förseningar och merarbete."}];const C=[["Extern projektledningskonsult","Tillför projektledningskompetens och resurser till beställaren."],["Projektstart","Skede där förutsättningar, mål och behov behöver tydliggöras."],["Systemfel","Brister i projekteringsprocessens arbetssätt och informationsflöden."],["Samordning","Att olika aktörers arbeten och lösningar fungerar ihop."],["Beställaruppföljning","Kontroll av att uppdrag och leveranser motsvarar beställarens krav."],["Byggledningskonsult","Kan stödja beställaren i kontroll och uppföljning."],["Projektering","Utveckling och dokumentation av byggprojektets lösningar."],["Lokalprogram","Underlag om verksamhetens lokalbehov och funktioner."],["Verksamhetskrav","Behov som lokaler och tekniska lösningar ska uppfylla."],["Systemhandling","Redovisar övergripande och samordnade lösningar."],["Huvudhandling","Redovisar byggnadens huvudsakliga utformning."],["Bygghandling","Underlag som beskriver hur byggandet ska utföras."],["Teknisk beskrivning","Anger tekniska krav och egenskaper som kompletterar ritningar."],["AMA","Referenssystem för strukturering av tekniska beskrivningar."],["Ritningsförteckning","Lista över projektets ritningar och versioner."],["CAD-manual","Gemensamma regler för digital ritnings- och modellhantering."],["Versionshantering","Säkerställer att rätt dokumentversion används."],["Kvalitetssäkring","Granskning och kontroll av att krav uppfylls."],["Kommunikationsplan","Plan för mottagare, innehåll, ansvar och kanaler."],["Projektörssamordning","Samordnar tekniska lösningar mellan olika discipliner."],["Myndighetskontakt","Kommunikation kring tillstånd, krav och myndighetsprövning."],["Kontrollansvarig","Bistår byggherren med kontrollplan och uppföljning enligt PBL."],["Kontrollplan","Anger kontroller, ansvar och redovisning."],["Tekniskt samråd","Genomgång av genomförande och kontrollfrågor inför byggstart."],["Egenkontroll","Kontroll av det egna arbetet mot gällande krav."]];let idx=0,selected=new Set(),answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}
function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><p>Flervalsfrågor ger poäng endast om samtliga rätta alternativ har valts och inga felaktiga.</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Kapitel '+q.ch;$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML='';let multi=q.correct.length>1;let hint=document.createElement('p');hint.className='muted small';hint.textContent=multi?'Flera alternativ är rätt. Markera alla rätta och klicka sedan på Kontrollera svar.':'Välj det bästa svaret.';$('options').appendChild(hint);q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});let check=document.createElement('button');check.id='checkanswer';check.className='primary';check.textContent='Kontrollera svar';check.style.display=multi?'inline-block':'none';check.disabled=true;check.onclick=checkAnswer;$('options').appendChild(check);$('feedback').classList.add('hide');$('next').disabled=true;selected=new Set();answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}
function choose(i){if(answered)return;let q=Q[order[idx]];let multi=q.correct.length>1;if(!multi){selected=new Set([i]);checkAnswer();return}if(selected.has(i))selected.delete(i);else selected.add(i);[...$('options').querySelectorAll('button.option')].forEach((b,j)=>b.classList.toggle('selected',selected.has(j)));$('checkanswer').disabled=selected.size===0}
function checkAnswer(){if(answered||selected.size===0)return;answered=true;let q=Q[order[idx]];let ok=selected.size===q.correct.length&&q.correct.every(i=>selected.has(i));if(ok)score++;[...$('options').querySelectorAll('button.option')].forEach((b,j)=>{b.disabled=true;if(q.correct.includes(j))b.classList.add('correct');else if(selected.has(j))b.classList.add('wrong')});$('checkanswer').style.display='none';$('feedback').textContent='';let strong=document.createElement('b');strong.textContent=ok?'Rätt svar!':'Inte riktigt.';let p=document.createElement('p');p.textContent=q.why;let p2=document.createElement('p');p2.textContent='Rätt alternativ: '+q.correct.map(i=>String.fromCharCode(65+i)).join(', ')+'.';$('feedback').append(strong,p,p2);$('feedback').classList.remove('hide');$('next').disabled=false}
function next(){idx++;render()}function restart(){location.reload()}
function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
