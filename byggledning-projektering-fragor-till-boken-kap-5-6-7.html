<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kapitel 5, 6 och 7</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20352e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(115deg,#183d34,#396e59);color:white;padding:42px 20px}main,.inner{max-width:920px;margin:auto}h1{font-size:clamp(1.9rem,4vw,3rem);margin:7px 0}header p{color:#dcebe2}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #b7c9be;background:white;color:#234b3b;border-radius:12px;padding:11px 17px}button:hover{border-color:#315d4a}button.active,.primary{background:#285b47;color:white;border-color:#285b47}.panel{background:white;border:1px solid #e2e7de;border-radius:20px;padding:clamp(18px,4vw,35px);box-shadow:0 10px 35px #1c3b2910;margin-bottom:20px}.muted{color:#61766c}.progress{height:9px;background:#e8eee9;border-radius:9px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#5e9974;transition:width .2s}.options{display:grid;gap:10px;margin:24px 0}.option{text-align:left;width:100%;padding:15px;border:1px solid #cbd8ce}.option.selected{background:#e4f0e8;border-color:#447d5c}.option.correct{background:#d9f2df;border-color:#32804b}.option.wrong{background:#fce6e4;border-color:#b54b43}.feedback{border-left:4px solid #568d6b;padding:14px;background:#f1f7f2;border-radius:8px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.small{font-size:.9rem}.flash{min-height:240px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#f4f8f3;border:1px dashed #8eac98;border-radius:18px;padding:25px;margin:20px 0}.flash strong{font-size:1.6rem}.hide{display:none}.pill{display:inline-block;background:#e4ede4;color:#335e46;border-radius:99px;padding:5px 11px;font-size:.85rem}footer{text-align:center;color:#708277;padding:30px}a{color:inherit}</style></head><body><header><div class="inner"><span class="pill">LTU · P0009B</span><h1>Kapitel 5, 6 och 7</h1><p>Interaktivt quiz och flashcards från kurslitteraturen. Kapitel 5, 6 och 7.</p></div></header><main><nav><button id="tabq" class="active" onclick="showTab('quiz')">✓ Quiz · 30 frågor</button><button id="tabc" onclick="showTab('cards')">▣ Flashcards · 25 kort</button></nav><section id="quiz" class="panel"><div class="actions"><span id="count" class="muted"></span><span class="pill" id="topic"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button onclick="shuffle()">Blanda och börja om</button><button id="next" class="primary" onclick="next()" disabled>Nästa fråga →</button></div></section><section id="cards" class="panel hide"><div class="actions"><h2>Begreppskort</h2><span id="cardcount" class="muted"></span></div><div id="flash" class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"></div><div class="actions"><button onclick="moveCard(-1)">← Föregående</button><button onclick="flip()">Vänd kort</button><button class="primary" onclick="moveCard(1)">Nästa →</button></div></section></main><footer>Studiematerial · Bygg- och anläggningsprojektering P0009B</footer><script>const Q=[["Vad är ett viktigt skäl att anlita en extern projektledningskonsult?",["Att tillföra kompetens och resurser som beställaren behöver","Att beställaren automatiskt slipper allt ansvar","Att bygglov inte längre behövs","Att entreprenören tar över alla beställarbeslut"],0,"Att tillföra kompetens och resurser som beställaren behöver.","5.1"],["Vad betonas vid starten av ett projekt enligt avsnittet om kontroller?",["Att vänta med att identifiera risker tills byggnaden är klar","Att endast granska entreprenörens fakturor","Att hoppa över dokumentation av förutsättningar","Att tidigt kontrollera projektets förutsättningar och beställarens behov"],3,"Att tidigt kontrollera projektets förutsättningar och beställarens behov.","5.2"],["Vad innebär systemfel i projekteringsprocessen?",["Att projektets budget alltid är för liten","Att ritningarna innehåller för många mått","Brister i hur arbetssätt, information och samordning fungerar","Endast fel i en enskild byggnadsdel"],2,"Brister i hur arbetssätt, information och samordning fungerar.","5.3"],["Vilken åtgärd lyfts fram för att minska systemfel?",["Att avstå från beställarens uppföljning","Att säkerställa tydlig information och samordning mellan aktörer","Att helt förbjuda parallellt arbete","Att ta bort projektets tidplan"],1,"Att säkerställa tydlig information och samordning mellan aktörer.","5.3"],["Varför behövs konsument- och beställarpräglade kommentarer?",["För att beställaren ska kunna förstå, värdera och ställa krav på konsultinsatsen","För att ersätta alla tekniska beskrivningar","För att låta konsulten ensam bestämma projektmålen","För att undvika kontakt med byggentreprenören"],0,"För att beställaren ska kunna förstå, värdera och ställa krav på konsultinsatsen.","5.8"],["Vilken roll kan en byggledningskonsult ha i byggprojektet?",["Att automatiskt överta rollen som byggnadsnämnd","Att alltid utföra allt fysiskt byggarbete","Att ersätta samtliga konstruktionsritningar","Att biträda beställaren med kontroll, samordning och uppföljning"],3,"Att biträda beställaren med kontroll, samordning och uppföljning.","5.2"],["Vad är huvudsyftet med projekteringsskedet?",["Att endast beställa byggmaterial","Att avveckla projektorganisationen","Att utveckla och dokumentera lösningar som byggprojektet ska genomföras utifrån","Att utföra slutbesiktning av den färdiga byggnaden"],2,"Att utveckla och dokumentera lösningar som byggprojektet ska genomföras utifrån.","6.1"],["Vad är ett lokalprogram i projekteringen?",["Enbart en sammanställning av bygglovsavgifter","En beskrivning av verksamhetens behov av lokaler och deras funktioner","En tidplan för entreprenörens semester","En lista över endast leverantörernas adresser"],1,"En beskrivning av verksamhetens behov av lokaler och deras funktioner.","6.3"],["Varför är verksamhetens krav viktiga tidigt i projekteringen?",["De påverkar bland annat lokalutformning, tekniska lösningar och kostnader","De används först efter slutbesiktningen","De ersätter alla myndighetskrav","De påverkar bara byggnadens fasadfärg"],0,"De påverkar bland annat lokalutformning, tekniska lösningar och kostnader.","6.3"],["Vilket syfte har ett systemhandlingsskede?",["Att slutbesiktiga färdiga installationer","Att enbart beställa möbler","Att upprätta garantibevis för redan färdiga arbeten","Att utveckla och samordna principiella tekniska och funktionella lösningar"],3,"Att utveckla och samordna principiella tekniska och funktionella lösningar.","6.4"],["Vad används byggnadens huvudhandlingar till?",["Att redovisa entreprenörens årsredovisning","Att ersätta projektets alla kontrakt","Att redovisa byggnadens utformning och viktiga förutsättningar","Att enbart registrera arbetarnas närvaro"],2,"Att redovisa byggnadens utformning och viktiga förutsättningar.","6.4"],["Vad beskriver bygghandlingar främst?",["Enbart projektets framtida hyresgäster","Hur byggnaden och dess delar ska utföras","Endast vilka intressenter som finns i närområdet","Bara företagets organisationsstruktur"],1,"Hur byggnaden och dess delar ska utföras.","6.5"],["Varför behövs tekniska beskrivningar tillsammans med ritningar?",["För att ange krav och egenskaper som ritningar inte ensamma tydliggör","För att ersätta all mängdredovisning","För att undvika att ange materialkrav","För att dokumentera personalens arbetstider"],0,"För att ange krav och egenskaper som ritningar inte ensamma tydliggör.","6.6"],["Vad är AMA i samband med tekniska beskrivningar?",["En myndighet som alltid beviljar bygglov","Ett program för enbart löneutbetalning","En entreprenadform för småhus","Ett referenssystem som hjälper till att strukturera tekniska krav"],3,"Ett referenssystem som hjälper till att strukturera tekniska krav.","6.6"],["Vad är syftet med ritningsförteckningen?",["Att bestämma byggnadens hyresnivå","Att ersätta alla ritningar med en enda tabell","Att ge överblick över vilka ritningar som ingår och deras aktuella versioner","Att endast redovisa projektets leverantörsfakturor"],2,"Att ge överblick över vilka ritningar som ingår och deras aktuella versioner.","6.7"],["Vad kan en CAD-manual reglera i ett projekt?",["Hur byggnadens slutbesiktning ska protokollföras","Gemensamma rutiner för digital ritnings- och modellhantering","Hur beställaren ska betala fakturor","Vilken entreprenadform som alltid måste väljas"],1,"Gemensamma rutiner för digital ritnings- och modellhantering.","6.8"],["Varför är versionshantering av projekteringshandlingar viktig?",["För att rätt och aktuellt underlag ska användas i projektet","För att alla äldre versioner automatiskt ska användas samtidigt","För att avskaffa behovet av granskning","För att ritningsnummer ska kunna utelämnas"],0,"För att rätt och aktuellt underlag ska användas i projektet.","6.8"],["Vad innebär projektets kvalitetssäkring av projekteringshandlingar?",["Att dokumentationen hålls hemlig för alla projektörer","Att endast entreprenörens slutkostnad kontrolleras","Att tekniska krav ersätts av muntliga instruktioner","Att handlingar granskas och kontrolleras mot krav och samordningsbehov"],3,"Att handlingar granskas och kontrolleras mot krav och samordningsbehov.","6.9"],["Vilket är ett centralt syfte med kommunikation i byggprocessen?",["Att ersätta projektering med möten","Att avskaffa behovet av beslut","Att rätt information når berörda aktörer i rätt tid","Att alla handlingar skickas till samtliga utan urval"],2,"Att rätt information når berörda aktörer i rätt tid.","7.2"],["Vad är en viktig funktion hos byggherrens kommunikationsplan?",["Att bestämma slutlig byggkostnad utan kalkyl","Att klargöra informationsbehov, målgrupper, ansvar och kanaler","Att fastställa enbart betongens hållfasthet","Att ersätta projektets alla kontrakt"],1,"Att klargöra informationsbehov, målgrupper, ansvar och kanaler.","7.2"],["Varför är samordning mellan olika projektörer viktig?",["För att lösningar från olika teknikområden ska fungera tillsammans","För att alla teknikområden alltid har identiska krav","För att bygglov aldrig ska behövas","För att varje disciplin ska arbeta utan insyn"],0,"För att lösningar från olika teknikområden ska fungera tillsammans.","7.3"],["Vad är syftet med myndighetskontakter i byggprocessen?",["Att överlåta alla projekteringsbeslut till myndigheten","Att ersätta behovet av entreprenör","Att automatiskt bevilja dispens från alla regler","Att hantera tillstånd, krav och prövningar som berör projektet"],3,"Att hantera tillstånd, krav och prövningar som berör projektet.","7.3"],["Vad är en huvuduppgift för kontrollansvarig enligt PBL?",["Att ersätta byggnadsnämndens beslut","Att alltid upprätta entreprenörens anbud","Att bistå byggherren med kontrollplan och uppföljning av att den följs","Att själv utföra samtliga byggarbeten"],2,"Att bistå byggherren med kontrollplan och uppföljning av att den följs.","7.5"],["Vad är syftet med en kontrollplan enligt PBL?",["Att bara ange entreprenörens betalningsplan","Att ange vilka kontroller som ska göras, av vem och hur de redovisas","Att enbart beskriva byggnadens färgsättning","Att ersätta projektets alla tekniska handlingar"],1,"Att ange vilka kontroller som ska göras, av vem och hur de redovisas.","7.5"],["Vad används ett byggsamråd eller tekniskt samråd till?",["Att behandla hur byggåtgärden ska genomföras och kontrolleras","Att endast välja möbler till lokalerna","Att fastställa hyreskontrakt för framtida brukare","Att ersätta alla projekteringsmöten"],0,"Att behandla hur byggåtgärden ska genomföras och kontrolleras.","7.4"],["Vad innebär egenkontroll i ett byggprojekt?",["Att endast beställaren kontrollerar alla arbetsmoment","Att kontroller alltid görs först flera år efter färdigställande","Att externa besiktningar blir förbjudna","Att den som utför arbetet kontrollerar och dokumenterar det mot ställda krav"],3,"Att den som utför arbetet kontrollerar och dokumenterar det mot ställda krav.","7.5"],["Vad är en avvikelse i projektets kontrollarbete?",["En godkänd och planerad kontrollpunkt","Ett möte som hålls enligt tidplan","Ett konstaterat förhållande som inte överensstämmer med uppställda krav","En ritning som fått ett dokumentnummer"],2,"Ett konstaterat förhållande som inte överensstämmer med uppställda krav.","7.6"],["Vad är ett viktigt syfte med kontrollplanens dokumentation?",["Att ersätta byggnadens relationshandlingar","Att det ska gå att visa vilka kontroller som har genomförts och resultaten","Att undvika all kommunikation med byggnadsnämnden","Att automatiskt garantera att inga fel finns"],1,"Att det ska gå att visa vilka kontroller som har genomförts och resultaten.","7.5"],["Vad ska en beskrivning av en byggprojekterad lösning bidra till?",["Att tydliggöra tekniska val och förutsättningar för berörda aktörer","Att göra all ritningssamordning onödig","Att fastställa löner för byggplatsens personal","Att avskaffa behovet av krav från verksamheten"],0,"Att tydliggöra tekniska val och förutsättningar för berörda aktörer.","7.4"],["Vad är syftet med att följa upp kvalitetskrav under byggprocessen?",["Att ersätta alla kontroller med en slutlig ekonomirapport","Att låta felaktiga utföranden förbli odokumenterade","Att begränsa granskning till projektets första dag","Att upptäcka och hantera brister innan de leder till större problem"],3,"Att upptäcka och hantera brister innan de leder till större problem.","7.6"]],C=[["Extern projektledningskonsult","Tillför projektledningskompetens och resurser till beställaren."],["Projektstart","Skede där förutsättningar, mål och behov behöver tydliggöras."],["Systemfel","Brister i projekteringsprocessens arbetssätt och informationsflöden."],["Samordning","Att olika aktörers arbeten och lösningar fungerar ihop."],["Beställaruppföljning","Kontroll av att uppdrag och leveranser motsvarar beställarens krav."],["Byggledningskonsult","Kan stödja beställaren i kontroll och uppföljning."],["Projektering","Utveckling och dokumentation av byggprojektets lösningar."],["Lokalprogram","Underlag om verksamhetens lokalbehov och funktioner."],["Verksamhetskrav","Behov som lokaler och tekniska lösningar ska uppfylla."],["Systemhandling","Redovisar övergripande och samordnade lösningar."],["Huvudhandling","Redovisar byggnadens huvudsakliga utformning."],["Bygghandling","Underlag som beskriver hur byggandet ska utföras."],["Teknisk beskrivning","Anger tekniska krav och egenskaper som kompletterar ritningar."],["AMA","Referenssystem för strukturering av tekniska beskrivningar."],["Ritningsförteckning","Lista över projektets ritningar och versioner."],["CAD-manual","Gemensamma regler för digital ritnings- och modellhantering."],["Versionshantering","Säkerställer att rätt dokumentversion används."],["Kvalitetssäkring","Granskning och kontroll av att krav uppfylls."],["Kommunikationsplan","Plan för mottagare, innehåll, ansvar och kanaler."],["Projektörssamordning","Samordnar tekniska lösningar mellan olika discipliner."],["Myndighetskontakt","Kommunikation kring tillstånd, krav och myndighetsprövning."],["Kontrollansvarig","Bistår byggherren med kontrollplan och uppföljning enligt PBL."],["Kontrollplan","Anger kontroller, ansvar och redovisning."],["Tekniskt samråd","Genomgång av genomförande och kontrollfrågor inför byggstart."],["Egenkontroll","Kontroll av det egna arbetet mot gällande krav."]];let idx=0,selected=null,answered=false,score=0,order=Q.map((_,i)=>i),ci=0,flipped=false;const $=id=>document.getElementById(id);function showTab(t){$('quiz').classList.toggle('hide',t!=='quiz');$('cards').classList.toggle('hide',t!=='cards');$('tabq').classList.toggle('active',t==='quiz');$('tabc').classList.toggle('active',t==='cards')}function render(){if(idx>=order.length){$('quiz').innerHTML=`<h2>Klart! 🎉</h2><p>Du fick <b>${score} av ${Q.length}</b> rätt (${Math.round(score/Q.length*100)} %).</p><button class="primary" onclick="restart()">Öva igen</button>`;return}let q=Q[order[idx]];$('count').textContent=`Fråga ${idx+1} av ${Q.length}`;$('topic').textContent='Avsnitt '+q[4];$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q[0];$('options').innerHTML='';q[1].forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);$('options').appendChild(b)});$('feedback').classList.add('hide');$('next').disabled=true;selected=null;answered=false;$('next').textContent=idx===Q.length-1?'Visa resultat':'Nästa fråga →'}function choose(i){if(answered)return;answered=true;selected=i;let q=Q[order[idx]];if(i===q[2])score++;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').innerHTML='<b>'+(i===q[2]?'Rätt svar!':'Inte riktigt.')+'</b><p>'+q[3]+'</p>';$('feedback').classList.remove('hide');$('next').disabled=false}function next(){idx++;render()}function restart(){location.reload()}function renderCard(){let c=C[ci];$('cardcount').textContent=`Kort ${ci+1} av ${C.length}`;$('flash').innerHTML='<div><span class="muted small">'+(flipped?'Förklaring':'Begrepp')+'</span><p><strong>'+c[flipped?1:0]+'</strong></p><span class="muted small">Klicka för att vända kortet</span></div>'}function flip(){flipped=!flipped;renderCard()}function moveCard(d){ci=(ci+d+C.length)%C.length;flipped=false;renderCard()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;score=0;render()}render();renderCard();</script></body></html>
